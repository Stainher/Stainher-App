<body class="v156-login-mode">
<div id="loginView" class="login-wrap">
  <form id="loginForm" class="login">
    <div class="brand"><div class="brandmark">S</div><div><h1>STAINHER</h1><small>Gestión Integral de Contratos</small></div></div>

</div>

<div id="appView" class="app hidden">
  <aside class="sidebar">
    <div class="brand"><div class="brandmark">S</div><div><h1>STAINHER</h1><small>Dashboard Mantenimiento</small></div></div>
    <nav class="nav">
      <button data-page="inicio" class="active">▦ Inicio</button>

      <button data-page="solicitudes" class="v15-nav">✓ Solicitudes</button>
      <button data-page="contrato" class="admin-only hidden">▤ Administración del Contrato</button>
      <button data-page="sistema" class="admin-only hidden">◫ Sistema</button>

    </nav>
    <div class="sidebar-bottom"><div class="userbox"><strong id="userName">Usuario</strong><small id="userRole">rol</small><button id="logoutBtn" class="logout">Cerrar sesión</button></div></div>
  </aside>
  <main class="main">
    <section id="page-inicio" class="page"></section>
    <section id="page-preventivo" class="page hidden"></section>
    <section id="page-correctivo" class="page hidden"></section>
    <section id="page-equipos" class="page hidden"></section>
    <section id="page-vehiculos" class="page hidden"></section>
    <section id="page-dotacion" class="page hidden"></section>
    <section id="page-turnos" class="page hidden"></section>
    <section id="page-solicitudes" class="page hidden"></section>
    <section id="page-contrato" class="page hidden"></section>
    <section id="page-sistema" class="page hidden"></section>
    <section id="page-usuarios" class="page hidden"></section>
  </main>
</div>
<div id="modalRoot"></div>
<script>
const CFG=window.STAINHER_CONFIG; const sb=supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
let state={session:null,profile:null,equipos:[],correctivo:[],correctivoMonth:new Date().getMonth()+1,correctivoYear:new Date().getFullYear(),charts:{},system:{},preventivos:[],preventivosYear:[],prevSelectedEquipo:'',prevYear:new Date().getFullYear(),prevMonth:new Date().getMonth()+1,prevView:'equipos'};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const fmtH=n=>Number.isFinite(n)?`${n.toFixed(1)} h`:'—';
function toast(msg,type=''){const el=document.createElement('div');el.className=`notice ${type}`;el.textContent=msg;$('#modalRoot').appendChild(el);setTimeout(()=>el.remove(),3500)}
function isAdmin(){return state.profile?.rol==='administrador'} function canPlan(){return ['administrador','planificador'].includes(state.profile?.rol)}
async function loadProfile(){const {data,error}=await sb.from('perfiles').select('*').eq('id',state.session.user.id).single();if(error)throw error;state.profile=data;$('#userName').textContent=data.nombre||state.session.user.email;$('#userRole').textContent=data.rol;$$('.admin-only').forEach(x=>x.classList.toggle('hidden',!isAdmin()));}
async function loadEquipos(){const {data,error}=await sb.from('equipos').select('*').order('nombre');if(error)throw error;state.equipos=data||[];}
function showApp(){ $('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');renderAll(); }
function showLogin(){ $('#appView').classList.add('hidden');$('#loginView').classList.remove('hidden'); }
async function init(){const {data:{session}}=await sb.auth.getSession();if(session){state.session=session;try{await loadProfile();await loadEquipos();showApp();}catch(e){console.error(e);showLogin();}}else showLogin();}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const m=$('#loginMsg');m.classList.add('hidden');const {data,error}=await sb.auth.signInWithPassword({email:$('#email').value,password:$('#password').value});if(error){m.textContent=error.message;m.classList.remove('hidden');return;}state.session=data.session;try{await loadProfile();await loadEquipos();showApp();}catch(err){m.textContent='Usuario autenticado, pero falta su perfil/rol.';m.classList.remove('hidden')}});
$('#logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};
$$('.nav button').forEach(b=>b.onclick=()=>{if(['usuarios','sistema','contrato'].includes(b.dataset.page)&&!isAdmin())return;$$('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$$('.page').forEach(x=>x.classList.add('hidden'));$(`#page-${b.dataset.page}`).classList.remove('hidden');if(b.dataset.page==='correctivo')loadCorrectivo();if(b.dataset.page==='preventivo')renderPreventivo();if(b.dataset.page==='contrato')renderContrato();if(b.dataset.page==='vehiculos')renderStandaloneVehiculos();if(b.dataset.page==='dotacion')renderStandaloneDotacion();if(b.dataset.page==='sistema')renderSistema();if(b.dataset.page==='usuarios')renderUsuarios();});
function renderAll(){renderInicio();renderEquipos();renderPreventivo();renderCorrectivoShell();renderContrato();renderSistema();renderUsuarios();}
function renderInicio(){const activos=state.equipos.filter(e=>e.estado==='activo').length;$('#page-inicio').innerHTML=`<div class="topbar"><div><h2>Panel de Mantenimiento</h2><p>Vista integrada de parque, preventivo y correctivo.</p></div><div class="actions">${isAdmin()?'<button class="btn primary" onclick="openUserModal()">+ Crear usuario</button>':''}</div></div><div class="grid-kpi"><div class="kpi"><span>Equipos</span><strong>${state.equipos.length}</strong><details class="kpi-help"><summary>Cómo se calcula</summary><div><b>Equipos = total de equipos registrados en el maestro.</b><br>Incluye equipos activos y retirados que permanezcan registrados para conservar su trazabilidad histórica.</div></details></div><div class="kpi"><span>Activos</span><strong>${activos}</strong><details class="kpi-help"><summary>Cómo se calcula</summary><div><b>Activos = equipos cuyo estado es “activo”.</b><br>Los equipos fuera de servicio o retirados se mantienen en el parque y en el histórico, pero no se contabilizan en este KPI.</div></details></div><div class="kpi"><span>Correctivos mes</span><strong id="homeCorr">—</strong><details class="kpi-help"><summary>Cómo se calcula</summary><div><b>Correctivos mes = número de atenciones correctivas del mes actual.</b><br>Se cuentan los registros válidos cargados en la base de averías para el período vigente, después de las exclusiones configuradas.</div></details></div><div class="kpi"><span>Horas correctivo</span><strong id="homeHours">—</strong><details class="kpi-help"><summary>Cómo se calcula</summary><div><b>Horas correctivo = suma de la duración de todas las atenciones del mes.</b><br>Cada duración se calcula entre Fecha/Hora inicio y Fecha/Hora término del trabajo.</div></details></div><div class="kpi"><span>Cierre operativo</span><strong id="homeOp">—</strong><details class="kpi-help"><summary>Cómo se calcula</summary><div><b>Cierre operativo = (atenciones finalizadas Operativas ÷ total de atenciones) × 100.</b><br>Usa el campo Estado final del equipo de la base de averías.</div></details></div></div><div class="panel"><div class="row-between"><h3>Parque de equipos</h3><button class="btn" onclick="gotoPage('equipos')">Ver todos</button></div><div class="cards">${state.equipos.map(cardEquipo).join('')||'<div class="empty">Aún no hay equipos cargados.</div>'}</div></div>`;loadCorrectivo(true);} 
function cardEquipo(e){return `<article class="equipment-card"><div class="row-between"><span class="tag">${e.tipo||'Equipo'}</span><span class="status ${e.estado==='activo'?'ok':e.estado==='fuera_servicio'?'bad':'warn'}">${e.estado==='fuera_servicio'?'fuera de servicio':(e.estado||'activo')}</span></div><h4>${e.nombre}</h4><div class="muted">${e.ubicacion||'Ubicación no informada'}</div><div class="progress"><i style="width:${e.estado==='activo'?100:e.estado==='fuera_servicio'?10:30}%"></i></div><div class="row-between"><small class="muted">${e.fabricante||'Fabricante s/i'} ${e.modelo?`· ${e.modelo}`:''}</small><button class="btn" onclick="openEquipoModal('${e.id}')">Detalle</button></div></article>`}
function gotoPage(p){document.querySelector(`[data-page="${p}"]`).click()}
function renderEquipos(){const btn=canPlan()?'<button class="btn primary" onclick="openEquipoModal()">+ Nuevo equipo</button>':'';$('#page-equipos').innerHTML=`<div class="topbar"><div><h2>Equipos</h2><p>Maestro técnico editable del parque.</p></div>${btn}</div><div class="cards">${state.equipos.map(cardEquipo).join('')||'<div class="empty">Sin equipos cargados.</div>'}</div>`}
function openEquipoModal(id=''){if(!canPlan()&&id==='')return;const e=state.equipos.find(x=>x.id===id)||{};const editable=canPlan();$('#modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="row-between"><h3>${id?'Ficha del equipo':'Nuevo equipo'}</h3><button class="btn" onclick="closeModal()">Cerrar</button></div><form id="equipoForm" class="form-grid"><label>Nombre<input class="field" name="nombre" value="${e.nombre||''}" ${editable?'':'disabled'} required></label><label>Nombre alternativo<input class="field" name="nombre_alternativo" value="${e.nombre_alternativo||''}" ${editable?'':'disabled'}></label><label>Tipo<input class="field" name="tipo" value="${e.tipo||''}" ${editable?'':'disabled'}></label><label>Ubicación<input class="field" name="ubicacion" value="${e.ubicacion||''}" ${editable?'':'disabled'}></label><label>Fabricante<input class="field" name="fabricante" value="${e.fabricante||''}" ${editable?'':'disabled'}></label><label>Modelo<input class="field" name="modelo" value="${e.modelo||''}" ${editable?'':'disabled'}></label><label>Capacidad carga<input class="field" name="capacidad_carga" value="${e.capacidad_carga||''}" ${editable?'':'disabled'}></label><label>Pasajeros<input class="field" name="pasajeros" type="number" value="${e.pasajeros??''}" ${editable?'':'disabled'}></label><label>Velocidad<input class="field" name="velocidad" value="${e.velocidad||''}" ${editable?'':'disabled'}></label><label>Paradas<input class="field" name="paradas" type="number" value="${e.paradas??''}" ${editable?'':'disabled'}></label><label>Criticidad<select class="field" name="criticidad" ${editable?'':'disabled'}><option ${e.criticidad==='Alta'?'selected':''}>Alta</option><option ${e.criticidad==='Media'?'selected':''}>Media</option><option ${e.criticidad==='Baja'?'selected':''}>Baja</option></select></label><label>Estado<select class="field" name="estado" ${editable?'':'disabled'}><option value="activo" ${(!e.estado||e.estado==='activo')?'selected':''}>activo</option><option value="fuera_servicio" ${e.estado==='fuera_servicio'?'selected':''}>fuera de servicio</option><option value="retirado" ${e.estado==='retirado'?'selected':''}>retirado</option></select></label><label class="full">Observaciones<textarea class="field" name="observaciones" rows="4" ${editable?'':'disabled'}>${e.observaciones||''}</textarea></label>${editable?'<div class="full"><button class="btn primary" type="submit">Guardar</button></div>':''}</form></div></div>`;if(editable)$('#equipoForm').onsubmit=async ev=>{ev.preventDefault();const obj=Object.fromEntries(new FormData(ev.target));obj.pasajeros=obj.pasajeros?Number(obj.pasajeros):null;obj.paradas=obj.paradas?Number(obj.paradas):null;let q=id?sb.from('equipos').update(obj).eq('id',id):sb.from('equipos').insert(obj);const {error}=await q;if(error)return toast(error.message,'error');await loadEquipos();closeModal();renderAll();toast('Equipo guardado','success')};}
function closeModal(){ $('#modalRoot').innerHTML=''; }
function openDeletePreventivoModal(){
  if(!isAdmin())return;
  const y=Number($('#prevYear')?.value||state.prevYear||new Date().getFullYear());
  const m=Number($('#prevMonth')?.value||state.prevMonth||new Date().getMonth()+1);
  const monthName=new Date(2000,m-1).toLocaleString('es-CL',{month:'long'});
  $('#modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" style="width:min(620px,100%)"><div class="row-between"><h3>Borrar programación preventiva</h3><button class="btn" onclick="closeModal()">Cerrar</button></div><div class="notice error"><b>Acción irreversible.</b> Esta opción elimina registros de programación preventiva desde Supabase. No elimina equipos ni registros correctivos.</div><form id="deletePrevForm" class="form-grid"><label>Año<input id="deletePrevYear" class="field" type="number" value="${y}" required></label><label>Alcance<select id="deletePrevScope" class="field"><option value="month">Solo un mes</option><option value="year">Todo el año</option></select></label><label id="deletePrevMonthWrap">Mes<select id="deletePrevMonth" class="field">${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${i+1===m?'selected':''}>${new Date(2000,i).toLocaleString('es-CL',{month:'long'})}</option>`).join('')}</select></label><label class="full">Escribe <b>BORRAR</b> para confirmar<input id="deletePrevConfirm" class="field" autocomplete="off" placeholder="BORRAR" required></label><div class="full"><div id="deletePrevSummary" class="notice">Se eliminará la programación de <b>${monthName} ${y}</b>.</div></div><div class="full"><button id="deletePrevBtn" class="btn" type="submit" style="background:#7f1d1d;border-color:#991b1b;color:white;font-weight:700">Eliminar programación</button></div></form></div></div>`;
  const refresh=()=>{const scope=$('#deletePrevScope').value,yr=Number($('#deletePrevYear').value||y),mo=Number($('#deletePrevMonth').value||m);$('#deletePrevMonthWrap').classList.toggle('hidden',scope==='year');const txt=scope==='year'?`Se eliminará <b>toda la programación preventiva del año ${yr}</b>.`:`Se eliminará la programación preventiva de <b>${new Date(2000,mo-1).toLocaleString('es-CL',{month:'long'})} ${yr}</b>.`;$('#deletePrevSummary').innerHTML=txt;};
  $('#deletePrevScope').addEventListener('change',refresh);$('#deletePrevYear').addEventListener('input',refresh);$('#deletePrevMonth').addEventListener('change',refresh);refresh();
  $('#deletePrevForm').onsubmit=deletePreventivoProgramacion;
}
async function deletePreventivoProgramacion(ev){
  ev.preventDefault();
  if(!isAdmin())return toast('Solo el administrador puede borrar programación preventiva','error');
  if(($('#deletePrevConfirm')?.value||'').trim().toUpperCase()!=='BORRAR')return toast('Escribe BORRAR para confirmar','error');
  const y=Number($('#deletePrevYear').value),scope=$('#deletePrevScope').value,m=Number($('#deletePrevMonth').value);
  if(!Number.isInteger(y)||y<2000||y>2100)return toast('Año no válido','error');
  const btn=$('#deletePrevBtn');btn.disabled=true;btn.textContent='Eliminando…';
  let q=sb.from('programacion_preventiva').delete().eq('anio',y);
  if(scope==='month')q=q.eq('mes',m);
  const {error}=await q;
  if(error){btn.disabled=false;btn.textContent='Eliminar programación';return toast(error.message,'error');}
  closeModal();state.prevYear=y;if(scope==='month')state.prevMonth=m;renderPreventivo();toast(scope==='year'?`Programación ${y} eliminada`:`Programación del mes eliminada`,'success');
}
function renderPreventivo(){
  const y=state.prevYear||new Date().getFullYear(),m=state.prevMonth||new Date().getMonth()+1;
  $('#page-preventivo').innerHTML=`<div class="topbar"><div><h2>Mantenimiento Preventivo</h2><p>Planificación, programación y cumplimiento mensual.</p></div><div class="actions"><button class="btn" onclick="downloadPreventivoReport()">↓ Informe mensual PDF</button>${canPlan()?'<button class="btn" onclick="openImportPlanModal()">↑ Importar Plan Matriz Excel</button><button class="btn primary" onclick="openPlanModal()">+ Programar actividad</button>':''}${isAdmin()?'<button class="btn" style="border-color:#7f1d1d;color:#fca5a5" onclick="openDeletePreventivoModal()">🗑 Borrar programación</button>':''}</div></div><div class="prev-view-tabs"><button class="prev-view-tab ${state.prevView==='equipos'?'active':''}" onclick="setPrevView('equipos')">▦ Vista mensual por equipos</button><button class="prev-view-tab ${state.prevView==='gantt'?'active':''}" onclick="setPrevView('gantt')">▤ Carta Gantt anual</button></div><div class="prev-toolbar"><select id="prevYear" class="field"><option>${y-1}</option><option selected>${y}</option><option>${y+1}</option></select><select id="prevMonth" class="field ${state.prevView==='gantt'?'hidden':''}">${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${m===i+1?'selected':''}>${new Date(2000,i).toLocaleString('es',{month:'long'})}</option>`).join('')}</select><select id="prevState" class="field"><option value="">Todos los estados</option><option value="programado">Programado</option><option value="pendiente">Pendiente</option><option value="ejecutado">Ejecutado</option></select><input id="prevSearch" class="field" placeholder="Buscar actividad o equipo..." style="min-width:220px"><button class="btn primary" onclick="loadPreventivos()">Actualizar</button></div><div id="prevContent"><div class="empty">Cargando planificación…</div></div>`;
  $('#prevState').addEventListener('change',renderPreventivoData);$('#prevSearch').addEventListener('input',renderPreventivoData);loadPreventivos();
}
function setPrevView(view){state.prevView=view==='gantt'?'gantt':'equipos';renderPreventivo();}
async function loadPreventivos(){
  const y=Number($('#prevYear')?.value||state.prevYear||new Date().getFullYear()),m=Number($('#prevMonth')?.value||state.prevMonth||new Date().getMonth()+1);state.prevYear=y;state.prevMonth=m;
  const [monthRes,yearRes]=await Promise.all([
    sb.from('programacion_preventiva').select('*,equipos(nombre,estado)').eq('anio',y).eq('mes',m).order('fecha_programada'),
    sb.from('programacion_preventiva').select('*,equipos(nombre,estado)').eq('anio',y).order('mes').order('fecha_programada')
  ]);
  const error=monthRes.error||yearRes.error;if(error){if($('#prevContent'))$('#prevContent').innerHTML=`<div class="notice error">${error.message}</div>`;return;}
  state.preventivos=(monthRes.data||[]).filter(r=>r.equipos?.estado!=='retirado');state.preventivosYear=(yearRes.data||[]).filter(r=>r.equipos?.estado!=='retirado');
  if(!state.prevSelectedEquipo||!(state.preventivosYear||[]).some(r=>r.equipo_id===state.prevSelectedEquipo)){state.prevSelectedEquipo=state.preventivosYear[0]?.equipo_id||state.equipos[0]?.id||'';}
  renderPreventivoData();
}
function preventivoIsLate(r){if(r.estado==='ejecutado'||!r.fecha_programada)return false;const today=new Date();today.setHours(0,0,0,0);const d=new Date(r.fecha_programada+'T00:00:00');return d<today;}
function preventivoStats(rows){const total=rows.length,exec=rows.filter(r=>r.estado==='ejecutado').length,pend=rows.filter(r=>r.estado!=='ejecutado').length,late=rows.filter(preventivoIsLate).length,pct=total?exec/total*100:0;return {total,exec,pend,late,pct};}
function renderPreventivoData(){
  if(state.prevView==='gantt')return renderPreventivoGantt();
  const box=$('#prevContent');if(!box)return;let rows=[...(state.preventivos||[])];const st=$('#prevState')?.value||'',q=cleanHeader($('#prevSearch')?.value||'');if(st)rows=rows.filter(r=>r.estado===st);if(q)rows=rows.filter(r=>cleanHeader(r.actividad).includes(q)||cleanHeader(r.equipos?.nombre||'').includes(q));

function cleanHeader(v=''){return String(v??'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ')}
function findCol(obj,names){const keys=Object.keys(obj||{});for(const n of names){const hit=keys.find(k=>cleanHeader(k)===cleanHeader(n));if(hit)return hit;}return null}
const MONTH_ALIASES=[['enero','ene','jan'],['febrero','feb'],['marzo','mar'],['abril','abr','apr'],['mayo','may'],['junio','jun'],['julio','jul'],['agosto','ago','aug'],['septiembre','setiembre','sep','sept'],['octubre','oct'],['noviembre','nov'],['diciembre','dic','dec']];
function detectMonthCol(obj,monthIndex){const keys=Object.keys(obj||{});return keys.find(k=>MONTH_ALIASES[monthIndex].includes(cleanHeader(k)))||null}
function mapEquipoPlan(nombre){const norm=normalizarEquipo(nombre);const raw=cleanHeader(nombre);return state.equipos.find(e=>cleanHeader(e.nombre)===cleanHeader(norm)||cleanHeader(e.nombre_alternativo||'')===raw||cleanHeader(e.nombre)===raw)||null}
function valueMeansScheduled(v){const x=cleanHeader(v);return !!x&&!['no','n','0','-','—','na','n/a','no aplica'].includes(x)}
function stateFromMatrixValue(v,siMode='programado'){const x=cleanHeader(v);if(!x)return null;if(['si','sí','x','ok','programado','programada'].includes(x))return siMode;if(['espera','pendiente','pending'].includes(x))return 'pendiente';if(['ejecutado','ejecutada','realizado','realizada','cumplido','cumplida'].includes(x))return 'ejecutado';return valueMeansScheduled(v)?'programado':null}

function planHeaderScore(row){
  const vals=(row||[]).map(v=>cleanHeader(v));
  const has=(aliases)=>vals.some(v=>aliases.some(a=>v===cleanHeader(a)||v.includes(cleanHeader(a))));
  const equipo=has(['Equipo','Nombre equipo','Ascensor / Equipo']);
  const actividad=has(['Actividad','Actividad de mantenimiento','Pauta','Tarea','Descripción','Descripcion','Descripción actividad','Descripcion actividad']);
  const frecuencia=has(['Frecuencia','Periodicidad']);
  let months=0;
  vals.forEach(v=>{for(let i=0;i<12;i++){if(MONTH_ALIASES[i].includes(v)||v===String(i+1)||v===String(i+1).padStart(2,'0')){months++;break}}});
  const plano=has(['Mes']) && has(['Estado']);
  return (equipo?6:0)+(actividad?6:0)+(frecuencia?1:0)+months*2+(plano?4:0);
}
function detectPlanSheetAndHeader(wb){
  let best=null;
  for(const sheetName of wb.SheetNames){
    const ws=wb.Sheets[sheetName];
    const grid=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});
    for(let i=0;i<Math.min(grid.length,80);i++){
      const row=grid[i]||[];
      const first=cleanHeader(row[0]);
      const dateMonths=row.slice(1,13).filter(v=>{
        if(v instanceof Date&&!Number.isNaN(v.getTime()))return true;
        const d=new Date(v);return v&&!Number.isNaN(d.getTime());
      }).length;
      const legacyScore=(first.includes('columna primaria')&&dateMonths>=8)?100+dateMonths:0;
      const score=Math.max(planHeaderScore(row),legacyScore);
      if(!best||score>best.score)best={sheetName,ws,grid,headerIndex:i,score,legacy:legacyScore>0};
    }
  }
  return best;
}
function planObjectsFromGrid(grid,headerIndex){
  const src=(grid[headerIndex]||[]).map((v,i)=>String(v||'').trim()||`__col_${i}`);
  const headers=[];const used={};
  src.forEach((h,i)=>{let k=h;if(used[k])k=`${k}_${i}`;used[k]=1;headers.push(k)});
  return grid.slice(headerIndex+1).map((row,ri)=>{const o={__row:headerIndex+2+ri};headers.forEach((h,i)=>o[h]=row?.[i]??'');return o});
}
function detectMonthCol(obj,monthIndex){const keys=Object.keys(obj||{});return keys.find(k=>{const c=cleanHeader(k);return MONTH_ALIASES[monthIndex].includes(c)||c===String(monthIndex+1)||c===String(monthIndex+1).padStart(2,'0')})||null}
function inferFrequencyFromActivity(activity,count){
  const a=cleanHeader(activity);
  if(a.includes('quincenal'))return 'Quincenal';
  if(a.includes('mensual'))return 'Mensual';
  if(a.includes('trimestral'))return 'Trimestral';
  if(a.includes('semestral'))return 'Semestral';
  if(a.includes('anual'))return 'Anual';
  if(count>=10)return 'Mensual';
  if(count>=4)return 'Trimestral';
  if(count===2)return 'Semestral';
  if(count===1)return 'Anual';
  return '';
}
function isLegacyEquipmentRow(row){
  if(!row||!row[0])return false;
  const label=String(row[0]).trim();
  const eq=mapEquipoPlan(label);
  if(!eq)return false;
  const vals=row.slice(1,13);
  const formulaLike=vals.filter(v=>String(v||'').includes('IFERROR')||String(v||'').includes('#REF!')).length;

function calcReliabilityKpis(rows){
  const eq=$('#corrEquipo')?.value||'';
  const scoped=eq?rows.filter(r=>r.equipo===eq):rows;

  // La guía de trabajo es el ID de la falla. Registros sin guía no participan
  // en MTBF, MTTR ni Disponibilidad.
  const valid=scoped.filter(r=>String(r.guia||'').trim() && Number.isFinite(Number(r.duracion_horas)) && Number(r.duracion_horas)>=0);
  if(!valid.length)return {ready:false,mttr:null,mtbf:null,disponibilidad:null,fallas:0,downtime:0,observedHours:0};

  // Agrupa por número de guía para no contar dos veces una misma falla.
  // Si una misma guía tiene más de una intervención, sus duraciones se acumulan.
  const events=new Map();
  valid.forEach(r=>{
    const key=String(r.guia).trim();
    const h=Number(r.duracion_horas)||0;
    events.set(key,(events.get(key)||0)+h);
  });

  const fallas=events.size;
  const downtime=[...events.values()].reduce((a,h)=>a+h,0);
  const days=new Date(state.correctivoYear,state.correctivoMonth,0).getDate();
  const periodHours=days*24;
  const equipmentCount=eq?1:Math.max(1,new Set(scoped.map(r=>r.equipo).filter(Boolean)).size);
  const observedHours=periodHours*equipmentCount;
  const uptime=Math.max(0,observedHours-downtime);

  return {
    ready:true,
    mttr:fallas?downtime/fallas:null,
    mtbf:fallas?uptime/fallas:null,
    disponibilidad:observedHours?uptime/observedHours*100:null,
    fallas,
    downtime,
    observedHours
  };
}

function calcReliabilityKpis(rows){

  const pdf=doc.output('datauristring').split(',')[1],requestKey=`confiabilidad:${state.session?.user?.id||'anon'}:${crypto.randomUUID()}`;
  document.getElementById('modalRoot').innerHTML=`<div class="modal-bg"><div class="modal"><div class="row-between"><h3>Enviar informe de Confiabilidad</h3><button class="btn" type="button" onclick="closeModal()">Cerrar</button></div><form id="v1518ReliabilityEmailForm" class="form-grid"><label class="full">Para<input class="field" type="email" name="to" required autocomplete="email" placeholder="correo@empresa.cl"></label><label class="full">Nombre del destinatario <span class="muted">(opcional)</span><input class="field" name="toName" autocomplete="name" placeholder="Nombre y apellido"></label><label class="full">Asunto<input class="field" name="subject" value="Informe de Confiabilidad · ${esc(v1512RangeLabel(state.correctivoFrom,state.correctivoTo))}" required maxlength="200"></label><label class="full">Mensaje<textarea class="field" name="message" rows="4" maxlength="4000">Adjuntamos Informe de Confiabilidad generado desde Stainher App para el período seleccionado.</textarea></label><div class="full notice">Adjunto: <b>${esc(fn)}</b></div><div id="v1518EmailStatus" class="full" aria-live="polite"></div><div class="full"><button class="btn primary" type="submit">Enviar correo</button></div></form></div></div>`;
  const form=document.getElementById('v1518ReliabilityEmailForm');form.onsubmit=async event=>{event.preventDefault();const submit=form.querySelector('button[type="submit"]'),values=Object.fromEntries(new FormData(form)),box=document.getElementById('v1518EmailStatus');submit.disabled=true;box.innerHTML='<div class="notice">Enviando y verificando entrega…</div>';try{const result=await v1519SendEmail({to:values.to,toName:values.toName,subject:values.subject,htmlContent:`<h2>Informe de Confiabilidad</h2><p>${esc(values.message).replace(/\n/g,'<br>')}</p><p><b>Período:</b> ${esc(v1512RangeLabel(state.correctivoFrom,state.correctivoTo))}</p>`,pdfBase64:pdf,pdfName:fn,modulo:'confiabilidad',tipoDocumento:'correctivo_confiabilidad',idempotencyKey:requestKey});box.innerHTML=`<div class="notice success">Correo confirmado por el proveedor${result?.messageId?` · ${esc(result.messageId)}`:''}.</div>`;toast('Informe enviado por correo','success')}catch(error){box.innerHTML=`<div class="notice error">${esc(error.message||String(error))}</div>`;submit.disabled=false}}
};

/* Prueba administrativa protegida contra doble clic. */
v156TestMail=async function(){
  const to=state.profile?.email||state.session?.user?.email;if(!to)return toast('Tu perfil no tiene correo asociado.','error');
  return v1523RequestLock('sistema:correo-prueba',async()=>{try{await v1519SendEmail({to,toName:state.profile?.nombre||'',subject:'Stainher App · Correo de prueba',htmlContent:`<h2>Stainher App</h2><p>Prueba operativa del servicio central <b>send-stainher-email</b>.</p>`,modulo:'sistema',tipoDocumento:'prueba',referencia_id:'prueba-v1523',testMode:true,idempotencyKey:`prueba:${state.session?.user?.id}:${crypto.randomUUID()}`});toast('Correo de prueba enviado correctamente','success')}catch(error){toast(error.message||String(error),'error')}finally{await v1519LoadEmailHistory?.()}})
};

/* Historial autoritativo: el navegador solo lee lo registrado por la Edge Function. */
v1519LoadEmailHistory=async function(){
  const box=document.getElementById('v1519MailHistory'),stateBadge=document.getElementById('v1523MailServiceState');if(!box)return;
  box.innerHTML='<div class="muted">Verificando trazabilidad del servidor…</div>';
  const query=await sb.from('email_envios_v1518').select('id,created_at,procesado_at,destinatario,destinatario_previsto,copias,asunto,estado,message_id,intentos,ultimo_error,http_status,modulo,tipo_documento').order('created_at',{ascending:false}).limit(20);
  if(query.error){box.innerHTML=`<div class="notice error">${esc(query.error.message)}</div>`;if(stateBadge){stateBadge.className='status bad';stateBadge.textContent='Sin verificación'}return}
  const rows=query.data||[],latest=rows[0];if(stateBadge){if(!latest){stateBadge.className='status warn';stateBadge.textContent='Sin pruebas'}else if(latest.estado==='enviado'){stateBadge.className='status ok';stateBadge.textContent='Operativo'}else if(latest.estado==='procesando'){stateBadge.className='status warn';stateBadge.textContent='Procesando'}else{stateBadge.className='status bad';stateBadge.textContent='Requiere revisión'}}
  if(!rows.length){box.innerHTML='<div class="muted">Sin envíos registrados.</div>';return}
  box.innerHTML=`<div class="admin-table"><table><thead><tr><th>Fecha</th><th>Módulo</th><th>Destinatario</th><th>Estado</th></tr></thead><tbody>${rows.map(item=>{const cls=item.estado==='enviado'?'ok':item.estado==='procesando'?'warn':'bad',copies=Array.isArray(item.copias)?item.copias.map(x=>x?.email||x).filter(Boolean):[];return `<tr><td>${new Date(item.created_at).toLocaleString('es-CL')}<small class="muted">Intento ${Number(item.intentos||1)}</small></td><td>${esc(item.modulo||'—')}<small class="muted">${esc(item.tipo_documento||'')}</small></td><td>${esc(item.destinatario||'—')}${copies.length?`<small class="muted">CC: ${esc(copies.join(', '))}</small>`:''}</td><td><span class="status ${cls}">${esc(item.estado||'—')}</span>${item.http_status?` <small class="muted">HTTP ${item.http_status}</small>`:''}${item.ultimo_error?`<small class="muted">${esc(item.ultimo_error)}</small>`:''}${item.message_id?`<small class="muted">ID: ${esc(item.message_id)}</small>`:''}</td></tr>`}).join('')}</tbody></table></div>`;
};

};

  return `<div class="v1523-prev-equipment-list">${groups.map(group=>`<section class="v1523-prev-equipment-group"><header class="v1523-prev-equipment-head"><h4>${esc(group.name)}</h4><span>${esc(v1523PreventiveEquipmentSummary(group.rows))}</span></header><div class="v1523-prev-equipment-table"><table><thead><tr><th>Actividad</th><th>Frecuencia</th><th>Período Plan Matriz</th><th>Fecha programada</th><th>Fecha real</th><th>Estado</th>${planner?'<th>Acciones</th>':''}</tr></thead><tbody>${group.rows.map(row=>{const status=v1520PrevComputed(row);return `<tr><td><b>${esc(row.actividad||'Sin actividad')}</b></td><td>${esc(row.frecuencia||'—')}</td><td>${v1520MonthLabel(row.anio,row.mes)}</td><td>${row.fecha_programada?v1520Date(row.fecha_programada):'<span class="muted">Por calendarizar</span>'}</td><td>${row.fecha_ejecucion?v1520Date(row.fecha_ejecucion):'—'}</td><td><span class="v1520-status ${status.cls}">${status.label}</span></td>${planner?`<td>${v1520PrevActions(row)}</td>`:''}</tr>`}).join('')}</tbody></table></div></section>`).join('')}</div>`;
};
function v1523PreventiveDayMark(items){
  if(!items.length)return '';
  const states=items.map(v1520PrevComputed),classes=new Set(states.map(state=>state.cls)),cls=classes.size>1?'mixed':states[0].cls,title=items.map(row=>`${row.actividad||'Actividad'} · ${v1520PrevComputed(row).label}`).join(' | ');
  return `<div class="v1523-prev-day-cell"><span class="v1523-prev-day-mark ${cls}" title="${esc(title)}" aria-label="${esc(title)}"><b>${items.length}</b><span>${items.length===1?'actividad':'actividades'}</span></span></div>`;
}
function v1523PreventiveUnplanned(groups){
  const pending=groups.map(group=>({name:group.name,rows:group.rows.filter(row=>!row.fecha_programada)})).filter(group=>group.rows.length),total=pending.reduce((sum,group)=>sum+group.rows.length,0);
  return `<section class="v1523-prev-unplanned"><h4>Por calendarizar · ${total}</h4><div class="muted">Actividades del Plan Matriz todavía sin día asignado, agrupadas por equipo.</div><div class="v1523-prev-unplanned-groups">${pending.map(group=>`<section class="v1523-prev-unplanned-group"><header><h5>${esc(group.name)}</h5><span class="status warn">${group.rows.length}</span></header>${group.rows.map(row=>`<div class="v1523-prev-unplanned-row"><div><b>${esc(row.actividad||'Sin actividad')}</b><small>${esc(row.frecuencia||'Sin frecuencia')} · ${v1520MonthLabel(row.anio,row.mes)}</small></div>${v1520Planner()?`<button class="btn" onclick="v1520CalendarizePreventivo('${row.id}')">Calendarizar</button>`:''}</div>`).join('')}</section>`).join('')||'<div class="empty">Todas las actividades visibles tienen fecha programada.</div>'}</div></section>`;
}
v1520PrevGantt=function(rows){
  const groups=v1523PreventiveEquipmentGroups(rows),columns=v1523PreventiveDateColumns(),today=v1520DateIso(new Date());
  if(!groups.length)return '<div class="empty">Sin actividades en el período.</div>';
  const table=`<div class="v1523-prev-day-grid" role="region" aria-label="Carta Gantt preventiva diaria" tabindex="0"><table><thead><tr><th class="equipment">Equipo</th>${columns.map(date=>{const day=new Date(`${date}T12:00:00`),weekend=[0,6].includes(day.getDay());return `<th class="${weekend?'weekend ':''}${date===today?'today':''}">${day.toLocaleDateString('es-CL',{weekday:'short'}).replace('.','')}<br><b>${day.getDate()}</b></th>`}).join('')}</tr></thead><tbody>${groups.map(group=>{const pending=group.rows.filter(row=>!row.fecha_programada).length,planned=group.rows.length-pending;return `<tr><td class="equipment"><b>${esc(group.name)}</b><small>${group.rows.length} actividades · ${planned} con fecha${pending?` · ${pending} por calendarizar`:''}</small></td>${columns.map(date=>{const day=new Date(`${date}T12:00:00`),items=group.rows.filter(row=>row.fecha_programada===date);return `<td class="${[0,6].includes(day.getDay())?'weekend ':''}${date===today?'today':''}">${v1523PreventiveDayMark(items)}</td>`}).join('')}</tr>`}).join('')}</tbody></table></div>`;
  return `${table}<div class="v1523-prev-legend"><span><i style="background:#3b82f6"></i>Programada</span><span><i style="background:#ef4444"></i>Atrasada</span><span><i style="background:#10b981"></i>Ejecutada</span><span><i style="background:#f59e0b"></i>Estados combinados</span></div>${v1523PreventiveUnplanned(groups)}`;
};
v1523RenderPreventiveContent=function(){
  const box=document.getElementById('v1520PrevContent');if(!box)return;const rows=state.v1520PrevRows||[],groups=v1523PreventiveEquipmentGroups(rows),mode=v1523PreventiveMode();
  const title=mode==='gantt'?'Carta Gantt preventiva por equipo':'Listado preventivo por equipo',description=mode==='gantt'?'Cada fila corresponde a un equipo y cada columna a un día del período seleccionado.':'Las actividades se agrupan dentro de un bloque único por nombre de equipo.';
  box.dataset.preventiveView=mode;box.innerHTML=`${v1523PreventiveKpis(rows)}<section class="panel v1523-prev-view-panel" data-view="${mode}"><div class="v1523-prev-view-head"><div><h3>${title}</h3><p>${description}</p></div><span class="v1523-prev-view-badge">${groups.length} equipo${groups.length===1?'':'s'} · ${mode==='gantt'?'Cuadrícula diaria':'Listado agrupado'}</span></div>${mode==='gantt'?v1520PrevGantt(rows):v1520PrevTable(rows)}</section>`;
  v1523ScheduleResponsivePolish?.();
};

<script id="v1523-preventive-edp-period-script">
/* V15.23 · Preventivo usa un único mes EDP: 21 del mes anterior al 20 del mes seleccionado. */
function v1523PreventiveEdpPeriod(){
  if(!state.v1523PrevEdpYear||!state.v1523PrevEdpMonth){const current=currentEdp();state.v1523PrevEdpYear=current.year;state.v1523PrevEdpMonth=current.month}
  const year=Number(state.v1523PrevEdpYear),month=Number(state.v1523PrevEdpMonth),range=edpRange(year,month);state.prevYear=year;state.prevMonth=month;state.v1520PrevFrom=range.start;state.v1520PrevTo=range.end;return {year,month,range,key:`${year}-${String(month).padStart(2,'0')}`};
}
function v1523PreventiveEdpLabel(period=v1523PreventiveEdpPeriod()){return `EDP ${MONTHS_ES[period.month-1]} ${period.year}: ${fmtDateCL(period.range.start)} al ${fmtDateCL(period.range.end)}`}
function v1523PreviewPreventivePeriod(value){
  const [year,month]=String(value||'').split('-').map(Number);if(!year||!month)return;const range=edpRange(year,month),note=document.getElementById('v1523PrevPeriodNote');if(note)note.innerHTML=`<b>Período contractual:</b> ${fmtDateCL(range.start)} al ${fmtDateCL(range.end)} <span class="muted">· corte fijo 21→20</span>`;
}
async function v1523SelectPreventivePeriod(value){
  const [year,month]=String(value||'').split('-').map(Number);if(!year||!month)return toast('Selecciona un mes contractual válido.','error');state.v1523PrevEdpYear=year;state.v1523PrevEdpMonth=month;const range=edpRange(year,month);state.v1520PrevFrom=range.start;state.v1520PrevTo=range.end;state.prevYear=year;state.prevMonth=month;return renderPreventivo();
}
v1520PrevDefaults=function(){const period=v1523PreventiveEdpPeriod();state.v1520PrevView=v1523PreventiveMode(state.v1520PrevView);state.v1520PrevStatus=state.v1520PrevStatus||'';state.v1520PrevSearch=state.v1520PrevSearch||'';state.v1520PrevFrom=period.range.start;state.v1520PrevTo=period.range.end};
v1520LoadPreventivo=async function(){
  v1520PrevDefaults();const period=v1523PreventiveEdpPeriod(),query=await sb.from('programacion_preventiva').select('*,equipos:equipo_id(nombre,estado)').eq('anio',period.year).eq('mes',period.month).order('actividad');if(query.error)throw query.error;
  let rows=query.data||[],search=String(state.v1520PrevSearch||'').trim().toLowerCase();if(search)rows=rows.filter(row=>`${row.equipos?.nombre||''} ${row.actividad||''} ${row.frecuencia||''}`.toLowerCase().includes(search));if(state.v1520PrevStatus)rows=rows.filter(row=>v1520PrevComputed(row).key===state.v1520PrevStatus);return rows;
};
renderPreventivo=async function(){
  if(!canViewV11('preventivo'))return;const page=document.getElementById('page-preventivo');if(!page)return;v1520PrevDefaults();const period=v1523PreventiveEdpPeriod();v1520SetHeader('preventivo');
  page.innerHTML=`<div class="topbar"><div></div><div class="actions"><button class="btn" onclick="v1520PrevReport()">↓ Informe</button>${v1520Planner()?'<button class="btn" onclick="openImportPlanModal()">↑ Importar Plan Matriz</button>':''}</div></div><div class="v1512-filterbar v1523-prev-period-toolbar"><label class="v1512-filter"><span>Mes contractual</span><input id="v1523PrevEdpMonth" class="field" type="month" value="${period.key}" onchange="v1523SelectPreventivePeriod(this.value)"></label><label class="v1512-filter"><span>Estado</span><select id="v1520PrevStatus" class="field"><option value="">Todos</option><option value="calendarizar" ${state.v1520PrevStatus==='calendarizar'?'selected':''}>Por calendarizar</option><option value="programada" ${state.v1520PrevStatus==='programada'?'selected':''}>Programada</option><option value="atrasada" ${state.v1520PrevStatus==='atrasada'?'selected':''}>Atrasada</option><option value="ejecutada" ${state.v1520PrevStatus==='ejecutada'?'selected':''}>Ejecutada</option></select></label><label class="v1512-filter"><span>Vista</span><select id="v1520PrevView" class="field" onchange="v1523SetPreventiveView(this.value)"><option value="lista" ${state.v1520PrevView==='lista'?'selected':''}>Listado</option><option value="gantt" ${state.v1520PrevView==='gantt'?'selected':''}>Carta Gantt</option></select></label></div><div id="v1523PrevPeriodNote" class="v1523-prev-period-note"><b>Período contractual:</b> ${fmtDateCL(period.range.start)} al ${fmtDateCL(period.range.end)} <span class="muted">· corte fijo 21→20</span></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0"><input id="v1520PrevSearch" class="field" style="min-width:260px" placeholder="Buscar equipo o actividad" value="${esc(state.v1520PrevSearch)}"><button class="btn primary" onclick="v1523ApplyPreventiveFilters()">Actualizar filtros</button></div><div class="notice">El Plan Matriz define las actividades del <b>${esc(v1523PreventiveEdpLabel(period))}</b>. Toda fecha programada debe quedar dentro de este período; no se permiten fechas fuera del corte contractual.</div><div id="v1520PrevContent"><div class="empty">Cargando planificación preventiva…</div></div>`;
  const token=(state.v1523PreventiveLoadSeq||0)+1;state.v1523PreventiveLoadSeq=token;try{const rows=await v1520LoadPreventivo();if(token!==state.v1523PreventiveLoadSeq)return;state.v1520PrevRows=rows;v1523RenderPreventiveContent()}catch(error){if(token!==state.v1523PreventiveLoadSeq)return;v1523RecordError?.('preventivo',error);const box=document.getElementById('v1520PrevContent');if(box)box.innerHTML=`<div class="notice error">${esc(error.message||String(error))}</div>`}
};
v1523ApplyPreventiveFilters=function(){
  const value=document.getElementById('v1523PrevEdpMonth')?.value,[year,month]=String(value||'').split('-').map(Number);if(!year||!month)return toast('Selecciona un mes contractual válido.','error');state.v1523PrevEdpYear=year;state.v1523PrevEdpMonth=month;const range=edpRange(year,month);state.v1520PrevFrom=range.start;state.v1520PrevTo=range.end;state.prevYear=year;state.prevMonth=month;state.v1520PrevStatus=document.getElementById('v1520PrevStatus')?.value||'';state.v1520PrevView=v1523PreventiveMode(document.getElementById('v1520PrevView')?.value);state.v1520PrevSearch=document.getElementById('v1520PrevSearch')?.value||'';return renderPreventivo();
};
v1520ApplyPrevFilters=v1523ApplyPreventiveFilters;
v1520CalendarizePreventivo=function(id){
  if(!v1520Planner())return;const row=v1520PrevFind(id);if(!row)return;const range=edpRange(Number(row.anio),Number(row.mes));document.getElementById('modalRoot').innerHTML=`<div class="modal-bg"><div class="modal"><div class="row-between"><h3>${row.fecha_programada?'Reprogramar':'Calendarizar'} actividad</h3><button class="btn" onclick="closeModal()">Cerrar</button></div><div class="notice"><b>${esc(row.equipos?.nombre||'')}</b><br>${esc(row.actividad||'')}<br>${esc(edpLabel(Number(row.anio),Number(row.mes)))}</div><form id="v1523CalPrev" class="form-grid"><label>Fecha programada<input class="field" name="fecha" type="date" min="${range.start}" max="${range.end}" value="${row.fecha_programada||range.start}" required></label>${row.fecha_programada?'<label class="full">Motivo de reprogramación<textarea class="field" name="motivo" rows="3" required></textarea></label>':''}<div class="full"><button class="btn primary">Guardar</button></div></form></div></div>`;
  document.getElementById('v1523CalPrev').onsubmit=async event=>{event.preventDefault();const values=Object.fromEntries(new FormData(event.target));if(!dateInEdp(values.fecha,Number(row.anio),Number(row.mes)))return toast(`La fecha debe quedar entre ${fmtDateCL(range.start)} y ${fmtDateCL(range.end)}.`,'error');if(row.fecha_programada&&row.fecha_programada!==values.fecha){const history=await sb.from('preventivo_reprogramaciones').insert({programacion_id:row.id,fecha_anterior:row.fecha_programada,fecha_nueva:values.fecha,anio_edp_anterior:row.anio,mes_edp_anterior:row.mes,anio_edp_nuevo:row.anio,mes_edp_nuevo:row.mes,motivo:values.motivo,usuario_id:state.session.user.id});if(history.error)return toast(history.error.message,'error')}const query=await sb.from('programacion_preventiva').update({fecha_programada:values.fecha,estado:'programado',updated_at:new Date().toISOString()}).eq('id',row.id);if(query.error)return toast(query.error.message,'error');closeModal();await renderPreventivo();toast('Fecha programada guardada dentro del período contractual','success')};
};
openPlanModal=async function(){
  if(!v1520Planner())return toast('La programación preventiva es exclusiva del Planificador.','error');const period=v1523PreventiveEdpPeriod(),range=period.range,catalog=await v1519LoadPlanCatalog(),eligible=state.equipos.filter(e=>e.estado==='activo'&&(catalog.get(String(e.id))||[]).length);if(!eligible.length){document.getElementById('modalRoot').innerHTML=`<div class="modal-bg"><div class="modal"><div class="row-between"><h3>Programar preventivo</h3><button class="btn" onclick="closeModal()">Cerrar</button></div><div class="notice warn"><b>No hay equipos con Plan Matriz disponible.</b><br>Debes importar actividades antes de programar.</div></div></div>`;return}
  document.getElementById('modalRoot').innerHTML=`<div class="modal-bg"><div class="modal"><div class="row-between"><h3>Programar preventivo</h3><button class="btn" onclick="closeModal()">Cerrar</button></div><div class="notice"><b>${esc(v1523PreventiveEdpLabel(period))}</b><br>La fecha programada debe pertenecer obligatoriamente a este período.</div><form id="planForm" class="form-grid"><label>Equipo<select id="planEquipo" class="field" name="equipo_id">${eligible.map(e=>`<option value="${e.id}">${esc(e.nombre)}</option>`).join('')}</select></label><label>Fecha programada<input id="v1523PlanFecha" class="field" type="date" name="fecha_programada" min="${range.start}" max="${range.end}" value="${range.start}" required></label><label class="full">Actividad<select id="planActividad" class="field" name="actividad" required></select></label><label>Frecuencia<select id="planFrecuencia" class="field" name="frecuencia" required></select></label><label>Estado<select class="field" name="estado"><option value="programado">Programado</option><option value="pendiente">Pendiente</option><option value="ejecutado">Ejecutado</option></select></label><div class="full"><button class="btn primary">Guardar programación</button></div></form></div></div>`;
  const fill=()=>{const items=catalog.get(String(document.getElementById('planEquipo').value))||[],activity=document.getElementById('planActividad'),frequency=document.getElementById('planFrecuencia');activity.innerHTML=items.map(([name,freq])=>`<option value="${esc(name)}" data-frequency="${esc(freq||'')}">${esc(name)}</option>`).join('');const sync=()=>{const value=activity.selectedOptions[0]?.dataset.frequency||'';frequency.innerHTML=`<option value="${esc(value)}">${esc(value||'Sin frecuencia')}</option>`};activity.onchange=sync;sync()};fill();document.getElementById('planEquipo').onchange=fill;v1514InstallDatePickers?.(document.getElementById('modalRoot'));
  document.getElementById('planForm').onsubmit=async event=>{event.preventDefault();const values=Object.fromEntries(new FormData(event.target));if(!dateInEdp(values.fecha_programada,period.year,period.month))return toast(`La fecha debe quedar entre ${fmtDateCL(range.start)} y ${fmtDateCL(range.end)}.`,'error');values.anio=period.year;values.mes=period.month;const query=await sb.from('programacion_preventiva').insert(values);if(query.error)return toast(query.error.message,'error');state.v1519PlanCatalogLoaded=false;closeModal();await renderPreventivo();toast('Actividad programada dentro del período contractual','success')};
};
