<script id="v157-script">
const V157_VERSION='V15.7';
const V157_DATE='26-08-2026';

/* =========================================================
   1. ELIMINAR ENCABEZADO CONTRACTUAL FUERA DE 3 MÓDULOS
========================================================= */
const V157_CONTRACT_PAGES=new Set(['preventivo','correctivo','contrato']);
function v157PageId(page){return (page?.id||'').replace(/^page-/,'')}
function v157RemoveContractHeader(){
  document.querySelectorAll('.page').forEach(page=>{
    const id=v157PageId(page);
    if(V157_CONTRACT_PAGES.has(id))return;
    [...page.querySelectorAll('*')].forEach(el=>{
      if(el.children.length>8)return;
      const t=(el.textContent||'').trim();
      const classMatch=el.matches?.('.contract-header,.contract-meta,.contract-banner,[data-contract-header]');
      const textMatch=/Contrato\s*4600029879|Mantenimiento y Certificación para Ascensores y Montacargas/i.test(t);
      if(classMatch||(textMatch&&t.length<420)){
        if(!el.closest('.modal'))el.remove();
      }
    });
  });
}
const v157HeaderObserver=new MutationObserver(()=>requestAnimationFrame(v157RemoveContractHeader));
setTimeout(()=>v157HeaderObserver.observe(document.getElementById('appView')||document.body,{childList:true,subtree:true}),200);

/* =========================================================
   2. USUARIO ABAJO IZQUIERDA + MENÚ
========================================================= */
function v157Initials(name){
  return String(name||'U').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase();
}
function v157InstallUserMenu(){
  const box=document.querySelector('.userbox');if(!box||box.dataset.v157)return;
  box.dataset.v157='1';
  const name=state.profile?.nombre||document.getElementById('userName')?.textContent||'Usuario';
  const role=state.profile?.rol||document.getElementById('userRole')?.textContent||'';
  box.innerHTML=`<button type="button" class="v157-user-trigger" onclick="v157ToggleUserMenu(event)">
    <span class="v157-avatar">${esc(v157Initials(name))}</span>
    <span class="v157-user-copy"><strong>${esc(name)}</strong><small>${esc(role)}</small></span>
    <span>⌃</span>
  </button>
  <div id="v157UserMenu" class="v157-user-menu hidden">
    <button type="button" onclick="v157OpenAccount()">Mi cuenta</button>
    <button type="button" onclick="v15OpenPasswordChange();v157CloseUserMenu()">Cambiar contraseña</button>
    <button type="button" class="danger" onclick="v157Logout()">Cerrar sesión</button>
  </div>`;
}
function v157ToggleUserMenu(e){e?.stopPropagation();document.getElementById('v157UserMenu')?.classList.toggle('hidden')}
function v157CloseUserMenu(){document.getElementById('v157UserMenu')?.classList.add('hidden')}
document.addEventListener('click',v157CloseUserMenu);
function v157OpenAccount(){
  v157CloseUserMenu();
  const p=state.profile||{},email=state.session?.user?.email||p.email||'';
  document.getElementById('modalRoot').innerHTML=`<div class="modal-bg"><div class="modal">
    <div class="row-between"><h3>Mi cuenta</h3><button class="btn" onclick="closeModal()">Cerrar</button></div>
    <div class="panel" style="margin:12px 0 0">
      <div style="display:grid;gap:10px">
        <div><small class="muted">Nombre</small><div><b>${esc(p.nombre||'')}</b></div></div>
        <div><small class="muted">Correo</small><div>${esc(email)}</div></div>
        <div><small class="muted">Rol</small><div>${esc(p.rol||'')}</div></div>
      </div>
    </div>
    <button class="btn primary" style="margin-top:10px" onclick="closeModal();v15OpenPasswordChange()">Cambiar contraseña</button>
  </div></div>`;
}
async function v157Logout(){await sb.auth.signOut();location.reload()}

/* =========================================================
   3. DOTACIÓN
========================================================= */
function v157DocRows(p){
  const fields=(typeof V13_EXP_FIELDS!=='undefined'?V13_EXP_FIELDS:[]);
  const rows=fields.filter(([k])=>p[k]).map(([k,l])=>{
    const label=l==='Examen'?'Examen Preocupacional':l;
    const days=v12Days(p[k]);
    return `<div class="v157-doc">
      <div class="v157-doc-name">${esc(label)}</div>
      <div class="v157-doc-meta"><small>Vence</small><b>${fmtDateCL(p[k])}</b></div>
      <div class="v157-doc-meta"><small>Restan</small><b class="status ${days<=30?'bad':days<=90?'warn':'ok'}">${days<0?Math.abs(days)+' días vencido':days+' días'}</b></div>
    </div>`;
  }).join('');
  return rows||'<div class="muted">Sin documentos con vencimiento registrados.</div>';
}
function v157Person(p){
  const edit=canEditV11('dotacion');
  return `<div class="v157-person">
    <div class="v157-person-name">${esc(p.nombre||'Sin nombre')}</div>

      ${edit?`<div class="v157-edit-actions"><button class="btn primary" onclick="openPersonModal('${p.id}')">Editar datos</button></div>`:''}
    </details>
  </div>`;
}
renderContractDotacion=function(){
  let rows=state.contractData?.dotacion||[];
  rows=v156VisibleDotation?.(rows)||rows;
  const restricted=['supervisor','tecnico'].includes(v11Role());
  const tech=rows.filter(x=>x.area==='tecnico');
  const adm=rows.filter(x=>x.area==='administrativo_apoyo'||x.area==='administrativo');
  const prev=rows.filter(x=>x.area==='prevencion');
  const sups=tech.filter(x=>v13Norm(x.cargo).includes('supervisor'));
  const groups=sups.map((s,i)=>{
    const crew=tech.filter(t=>t.id!==s.id&&v13SupervisorNameMatch(t.supervisor_nombre,s.nombre));

function v157FieldValid(el){

function v157PageMissing(page){

function v157GenericGo(form,index,validate=true){
  const pages=[...form.querySelectorAll('.v157-page')];if(!pages.length)return;
  const cur=pages.findIndex(x=>x.classList.contains('active'));
  if(validate&&cur>=0&&index>cur){
    const miss=v157PageMissing(pages[cur]);
    if(miss.length){
      miss.forEach(x=>x.classList.add('v157-invalid'));
      miss[0].scrollIntoView({behavior:'smooth',block:'center'});
      return toast(`Completa ${miss.length} campo${miss.length===1?'':'s'} antes de continuar.`,'error');
    }
  }
  index=Math.max(0,Math.min(index,pages.length-1));
  pages.forEach((p,i)=>p.classList.toggle('active',i===index));
  form.dataset.v157Page=String(index);
  const title=form.querySelector('.v157-step-title'),counter=form.querySelector('.v157-step-count');
  if(title)title.textContent=pages[index].dataset.title||`Paso ${index+1}`;
  if(counter)counter.textContent=`Paso ${index+1} de ${pages.length}`;
  const prev=form.querySelector('[data-v157-prev]'),next=form.querySelector('[data-v157-next]'),finish=form.querySelector('[data-v157-finish]');
  if(prev)prev.disabled=index===0;
  if(next)next.classList.toggle('hidden',index===pages.length-1);

  const result=await v1571LoadProfileSafe();
  if(!result.ok){
    if(result.stage==='perfil_missing'){
      v1571LoginMessage('Tu cuenta fue autenticada, pero no tiene un perfil asociado. Contacta al administrador.','error');
    }else if(result.stage==='perfil_query'){
      v1571LoginMessage('No se pudo cargar tu perfil. Revisa permisos/RLS de la tabla perfiles.','error');
    }else if(result.stage==='equipos'){
      v1571LoginMessage('Tu perfil cargó correctamente, pero no se pudo cargar el parque de equipos. Revisa permisos/RLS de equipos.','error');
    }else{
      v1571LoginMessage('No se pudo completar el inicio de sesión.','error');
    }
    return false;
  }
  return true;
}

/* Interceptar login para separar las etapas de carga */
const _v1571ShowAppBase=showApp;
showApp=async function(){
  try{
    const ok=await v1571BootstrapAfterAuth();
    if(!ok){
      v1571SetAuthDebug?.();
      showLogin();
      return;
    }
  }catch(e){
    console.error('[V15.7.1] bootstrap general:',e);
    v1571LoginMessage('Error inesperado al cargar la aplicación.','error');
    showLogin();
    return;
  }
  return _v1571ShowAppBase();
};

/* Evitar mensaje genérico heredado si existe */
const _v1571ShowLoginBase=showLogin;
showLogin=function(){
  _v1571ShowLoginBase();
  setTimeout(()=>{
    const boxes=[...document.querySelectorAll('#loginView .notice,#loginView .login-message')];
    boxes.forEach(b=>{
      if(/Usuario autenticado, pero falta su perfil\/rol/i.test(b.textContent||'')){
        b.textContent='No se pudo completar la carga inicial. Intenta nuevamente.';
      }
    });
  },0);
};
</script>
