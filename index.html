/* Stainher App V15.24 r19 ¬∑ arranque visual estable en Inicio.
 * Este bloque se ejecuta desde config.js antes del primer renderizado visible.
 */
(()=>{
  'use strict';
  if(window.__STAINHER_INITIAL_ROUTE_GUARD__)return;
  window.__STAINHER_INITIAL_ROUTE_GUARD__=true;

  const style=document.createElement('style');
  style.id='stainher-initial-route-guard-style';
  style.textContent=`
    @media(max-width:900px){
      html:not([data-stainher-initial-route-ready="1"]) #appView .page,
      html:not([data-stainher-initial-route-ready="1"]) #v151MobileTitle,
      html:not([data-stainher-initial-route-ready="1"]) .v151-mobile-title small{
        visibility:hidden!important
      }
    }
  `;
  document.head.appendChild(style);

  let observer,completed=false;
  function activateInicio(){
    if(completed)return true;
    if(!window.matchMedia?.('(max-width:900px)').matches){
      completed=true;
      observer?.disconnect();
      document.documentElement.dataset.stainherInitialRouteReady='1';
      return true;
    }
    const page=document.getElementById('page-inicio');
    const title=document.getElementById('v151MobileTitle');
    if(!page||!title)return false;

    /* Detener antes de modificar el DOM: cambiar el t√≠tulo tambi√©n genera una
     * mutaci√≥n y Safari pod√≠a encadenar el observador indefinidamente. */
    completed=true;
    observer?.disconnect();

    document.querySelectorAll('.page[id^="page-"]').forEach(node=>{
      const selected=node===page;
      node.classList.toggle('hidden',!selected);
      node.hidden=!selected;
      node.setAttribute('aria-hidden',String(!selected));
    });
    document.querySelectorAll('.nav button[data-page]').forEach(button=>{
      button.classList.toggle('active',button.dataset.page==='inicio');
    });
    document.querySelectorAll('#v151MobileBottom button[data-v151-page]').forEach(button=>{
      const selected=button.dataset.v151Page==='inicio';
      button.classList.toggle('active',selected);
      button.setAttribute('aria-current',selected?'page':'false');
    });
    if(title.textContent!=='‚åÇ Inicio')title.textContent='‚åÇ Inicio';
    const version=title.closest('.v151-mobile-title')?.querySelector('small');
    if(version)version.textContent='Stainher App ¬∑ V15.24 r19';

    requestAnimationFrame(()=>{
      document.documentElement.dataset.stainherInitialRouteReady='1';
    });
    return true;
  }

  observer=new MutationObserver(activateInicio);
  observer.observe(document.documentElement,{childList:true,subtree:true});
  if(!activateInicio())document.addEventListener('DOMContentLoaded',activateInicio,{once:true});
  setTimeout(()=>{
    completed=true;
    document.documentElement.dataset.stainherInitialRouteReady='1';
    observer?.disconnect();
  },2500);
})();

async function loadPreventivos(){

}

function cleanHeader(v=''){return String(v??'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ')}
function findCol(obj,names){const keys=Object.keys(obj||{});for(const n of names){const hit=keys.find(k=>cleanHeader(k)===cleanHeader(n));if(hit)return hit;}return null}
const MONTH_ALIASES=[['enero','ene','jan'],['febrero','feb'],['marzo','mar'],['abril','abr','apr'],['mayo','may'],['junio','jun'],['julio','jul'],['agosto','ago','aug'],['septiembre','setiembre','sep','sept'],['octubre','oct'],['noviembre','nov'],['diciembre','dic','dec']];
function detectMonthCol(obj,monthIndex){const keys=Object.keys(obj||{});return keys.find(k=>MONTH_ALIASES[monthIndex].includes(cleanHeader(k)))||null}
function mapEquipoPlan(nombre){const norm=normalizarEquipo(nombre);const raw=cleanHeader(nombre);return state.equipos.find(e=>cleanHeader(e.nombre)===cleanHeader(norm)||cleanHeader(e.nombre_alternativo||'')===raw||cleanHeader(e.nombre)===raw)||null}
function valueMeansScheduled(v){const x=cleanHeader(v);return !!x&&!['no','n','0','-','‚Äî','na','n/a','no aplica'].includes(x)}
function stateFromMatrixValue(v,siMode='programado'){const x=cleanHeader(v);if(!x)return null;if(['si','s√≠','x','ok','programado','programada'].includes(x))return siMode;if(['espera','pendiente','pending'].includes(x))return 'pendiente';if(['ejecutado','ejecutada','realizado','realizada','cumplido','cumplida'].includes(x))return 'ejecutado';return valueMeansScheduled(v)?'programado':null}

function planHeaderScore(row){
  const vals=(row||[]).map(v=>cleanHeader(v));
  const has=(aliases)=>vals.some(v=>aliases.some(a=>v===cleanHeader(a)||v.includes(cleanHeader(a))));
  const equipo=has(['Equipo','Nombre equipo','Ascensor / Equipo']);
  const actividad=has(['Actividad','Actividad de mantenimiento','Pauta','Tarea','Descripci√≥n','Descripcion','Descripci√≥n actividad','Descripcion actividad']);
  const frecuencia=has(['Frecuencia','Periodicidad']);
  let months=0;
  vals.forEach(v=>{for(let i=0;i<12;i++){if(MONTH_ALIASES[i].includes(v)||v===String(i+1)||v===String(i+1).padStart(2,'0')){months++;break}}});
  const plano=has(['Mes']) && has(['Estado']);
  return (equipo?6:0)+(actividad?6:0)+(frecuencia?1:0)+months*2+(plano?4:0);
}
function detectPlanSheetAndHeader(wb){
  let best=null;
  for(const sheetName of wb.SheetNames){
    const ws=wb.Sheets[sheetName];
    const grid=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});
    for(let i=0;i<Math.min(grid.length,80);i++){
      const row=grid[i]||[];
      const first=cleanHeader(row[0]);
      const dateMonths=row.slice(1,13).filter(v=>{
        if(v instanceof Date&&!Number.isNaN(v.getTime()))return true;
        const d=new Date(v);return v&&!Number.isNaN(d.getTime());
      }).length;
      const legacyScore=(first.includes('columna primaria')&&dateMonths>=8)?100+dateMonths:0;
      const score=Math.max(planHeaderScore(row),legacyScore);
      if(!best||score>best.score)best={sheetName,ws,grid,headerIndex:i,score,legacy:legacyScore>0};
    }
  }
  return best;
}
function planObjectsFromGrid(grid,headerIndex){
  const src=(grid[headerIndex]||[]).map((v,i)=>String(v||'').trim()||`__col_${i}`);
  const headers=[];const used={};
  src.forEach((h,i)=>{let k=h;if(used[k])k=`${k}_${i}`;used[k]=1;headers.push(k)});
  return grid.slice(headerIndex+1).map((row,ri)=>{const o={__row:headerIndex+2+ri};headers.forEach((h,i)=>o[h]=row?.[i]??'');return o});
}
function detectMonthCol(obj,monthIndex){const keys=Object.keys(obj||{});return keys.find(k=>{const c=cleanHeader(k);return MONTH_ALIASES[monthIndex].includes(c)||c===String(monthIndex+1)||c===String(monthIndex+1).padStart(2,'0')})||null}
function inferFrequencyFromActivity(activity,count){
  const a=cleanHeader(activity);
  if(a.includes('quincenal'))return 'Quincenal';
  if(a.includes('mensual'))return 'Mensual';
  if(a.includes('trimestral'))return 'Trimestral';
  if(a.includes('semestral'))return 'Semestral';
  if(a.includes('anual'))return 'Anual';
  if(count>=10)return 'Mensual';
  if(count>=4)return 'Trimestral';
  if(count===2)return 'Semestral';
  if(count===1)return 'Anual';
  return '';
}
function isLegacyEquipmentRow(row){
  if(!row||!row[0])return false;
  const label=String(row[0]).trim();
  const eq=mapEquipoPlan(label);
  if(!eq)return false;
  const vals=row.slice(1,13);
  const formulaLike=vals.filter(v=>String(v||'').includes('IFERROR')||String(v||'').includes('#REF!')).length;
  return formulaLike>=4 || vals.filter(v=>v!==''&&v!=null).length>=8;
}
function parseLegacyPlanMatrix(detected,year,siMode){
  const parsed=[];const errors=[];const grid=detected.grid;let currentEq=null;
  for(let ri=detected.headerIndex+1;ri<grid.length;ri++){
    const row=grid[ri]||[];const label=String(row[0]??'').trim();
    if(!label)continue;
    if(isLegacyEquipmentRow(row)){
      currentEq=mapEquipoPlan(label);
      if(!currentEq)errors.push(`Fila ${ri+1}: equipo no reconocido ‚Äú${label}‚Äù`);
      continue;
    }
    if(!currentEq)continue;
    const monthStates=[];
    for(let mi=0;mi<12;mi++){
      const est=stateFromMatrixValue(row[mi+1],siMode);
      if(est)monthStates.push({mi,est});
    }
    if(!monthStates.length)continue;
    const frecuencia=inferFrequencyFromActivity(label,monthStates.length);
    monthStates.forEach(({mi,est})=>parsed.push({
      equipo_id:currentEq.id,equipo_nombre:currentEq.nombre,actividad:label,frecuencia,
      anio:year,mes:mi+1,fecha_programada:null,estado:est
    }));
  }
  return {parsed,errors};
}
async function previewPlanImport(ev){
  const file=ev.target.files?.[0];if(!file)return;
  const box=$('#planImportPreview');box.innerHTML='<div class="empty">Leyendo archivo‚Ä¶</div>';
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array',cellDates:true});
    const detected=detectPlanSheetAndHeader(wb);
    if(!detected||detected.score<12)throw new Error('No pude localizar la estructura del Plan Matriz.');
    const year=Number($('#planImportYear').value)||new Date().getFullYear();
    const siMode=$('#planSiMode').value;
    let parsed=[];let errors=[];
    if(detected.legacy){
      ({parsed,errors}=parseLegacyPlanMatrix(detected,year,siMode));
    }else{
      const raw=planObjectsFromGrid(detected.grid,detected.headerIndex);
      let ultimoEquipo='';
      raw.forEach((r)=>{
        const rowNum=r.__row||'';
        const equipoCol=findCol(r,['Equipo','Nombre equipo','Ascensor / Equipo']);
        const actCol=findCol(r,['Actividad','Actividad de mantenimiento','Pauta','Tarea','Descripci√≥n','Descripcion','Descripci√≥n actividad','Descripcion actividad']);
        const freqCol=findCol(r,['Frecuencia','Periodicidad']);
        const yearCol=findCol(r,['A√±o','Anio']);
        const monthCol=findCol(r,['Mes']);
        const dateCol=findCol(r,['Fecha programada','Fecha']);
        const stateCol=findCol(r,['Estado']);
        let equipoTxt=equipoCol?String(r[equipoCol]||'').trim():'';
        if(equipoTxt)ultimoEquipo=equipoTxt; else equipoTxt=ultimoEquipo;
        const actividad=actCol?r[actCol]:'';
        if(!equipoTxt&&!actividad)return;
        if(!actividad)return;
        const eq=mapEquipoPlan(equipoTxt);
        if(!eq){errors.push(`Fila ${rowNum}: equipo no reconocido ‚Äú${equipoTxt}‚Äù`);return}
        if(monthCol){
          let m=Number(r[monthCol]);
          if(!m){const cm=cleanHeader(r[monthCol]);m=MONTH_ALIASES.findIndex(a=>a.includes(cm))+1}
          if(m>=1&&m<=12){
            parsed.push({equipo_id:eq.id,equipo_nombre:eq.nombre,actividad:String(actividad).trim(),frecuencia:freqCol?String(r[freqCol]||'').trim():'',anio:Number(yearCol?r[yearCol]:year)||year,mes:m,fecha_programada:dateCol?excelDateToIso(r[dateCol]):null,estado:stateCol?normalizePlanState(r[stateCol]):'programado'});
          }else errors.push(`Fila ${rowNum}: mes inv√°lido`);
          return;
        }
        let monthHits=0;
        for(let mi=0;mi<12;mi++){
          const mk=detectMonthCol(r,mi);if(!mk)continue;
          const est=stateFromMatrixValue(r[mk],siMode);
          if(est){monthHits++;parsed.push({equipo_id:eq.id,equipo_nombre:eq.nombre,actividad:String(actividad).trim(),frecuencia:freqCol?String(r[freqCol]||'').trim():'',anio:year,mes:mi+1,fecha_programada:null,estado:est});}
        }
      });
    }
    if(!parsed.length)errors.push('No se encontraron actividades programadas en la matriz.');
    const {data:existing,error}=await sb.from('programacion_preventiva').select('equipo_id,actividad,anio,mes');if(error)throw error;
    const keys=new Set((existing||[]).map(x=>`${x.equipo_id}|${cleanHeader(x.actividad)}|${x.anio}|${x.mes}`));
    let dup=0;const nuevos=[];
    parsed.forEach(x=>{const k=`${x.equipo_id}|${cleanHeader(x.actividad)}|${x.anio}|${x.mes}`;if(keys.has(k)){dup++;return}keys.add(k);nuevos.push(x)});
    state.planImport={fileName:file.name,rows:nuevos,all:parsed,dup,errors};
    const sample=nuevos.slice(0,40);
    box.innerHTML=`<div class="notice"><b>Lectura detectada:</b> hoja ‚Äú${detected.sheetName}‚Äù, fila base ${detected.headerIndex+1}${detected.legacy?' ¬∑ formato Plan Matriz Stainher':''}.</div><div class="grid-kpi" style="grid-template-columns:repeat(4,minmax(140px,1fr))"><div class="kpi"><span>Programaciones detectadas</span><strong>${parsed.length}</strong></div><div class="kpi"><span>Nuevas</span><strong>${nuevos.length}</strong></div><div class="kpi"><span>Duplicadas omitidas</span><strong>${dup}</strong></div><div class="kpi"><span>Errores</span><strong>${errors.length}</strong></div></div>${errors.length?`<div class="notice warn"><b>Observaciones:</b><br>${errors.slice(0,12).join('<br>')}${errors.length>12?'<br>‚Ä¶':''}</div>`:''}<div class="panel"><h3>Vista previa</h3><div style="overflow:auto"><table><thead><tr><th>Equipo</th><th>Actividad</th><th>Frecuencia</th><th>A√±o</th><th>Mes</th><th>Estado</th></tr></thead><tbody>${sample.map(x=>`<tr><td>${x.equipo_nombre}</td><td>${x.actividad}</td><td>${x.frecuencia||'‚Äî'}</td><td>${x.anio}</td><td>${x.mes}</td><td>${x.estado}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No hay programaciones nuevas.</td></tr>'}</tbody></table></div></div><button class="btn primary" ${nuevos.length?'':'disabled'} onclick="confirmPlanImport()">Importar ${nuevos.length} programaciones</button>`;

function calcReliabilityKpis(rows){

  const scoped=eq?rows.filter(r=>r.equipo===eq):rows;

  // La gu√≠a de trabajo es el ID de la falla. Registros sin gu√≠a no participan
  // en MTBF, MTTR ni Disponibilidad.
  const valid=scoped.filter(r=>String(r.guia||'').trim() && Number.isFinite(Number(r.duracion_horas)) && Number(r.duracion_horas)>=0);
  if(!valid.length)return {ready:false,mttr:null,mtbf:null,disponibilidad:null,fallas:0,downtime:0,observedHours:0};

  // Agrupa por n√∫mero de gu√≠a para no contar dos veces una misma falla.
  // Si una misma gu√≠a tiene m√°s de una intervenci√≥n, sus duraciones se acumulan.
  const events=new Map();
  valid.forEach(r=>{
    const key=String(r.guia).trim();
    const h=Number(r.duracion_horas)||0;
    events.set(key,(events.get(key)||0)+h);
  });

  const fallas=events.size;
  const downtime=[...events.values()].reduce((a,h)=>a+h,0);
  const days=new Date(state.correctivoYear,state.correctivoMonth,0).getDate();
  const periodHours=days*24;
  const equipmentCount=eq?1:Math.max(1,new Set(scoped.map(r=>r.equipo).filter(Boolean)).size);
  const observedHours=periodHours*equipmentCount;
  const uptime=Math.max(0,observedHours-downtime);

  return {
    ready:true,
    mttr:fallas?downtime/fallas:null,
    mtbf:fallas?uptime/fallas:null,
    disponibilidad:observedHours?uptime/observedHours*100:null,
    fallas,
    downtime,
    observedHours
  };
}
