    <input class="field" id="email" type="email" placeholder="Correo" required>
    <input class="field" id="password" type="password" placeholder="Contraseña" required>

<div id="appView" class="app hidden">
  <aside class="sidebar">
    <div class="brand"><div class="brandmark">S</div><div><h1>STAINHER</h1><small>Dashboard Mantenimiento</small></div></div>
    <nav class="nav">
      <button data-page="inicio" class="active">▦ Inicio</button>
      <button data-page="preventivo">✓ Preventivo</button>
      <button data-page="correctivo">⚙ Correctivo</button>
      <button data-page="equipos">▣ Equipos</button>
      <button data-page="vehiculos">▥ Vehículos</button>
      <button data-page="dotacion">♟ Dotación</button>
      <button data-page="contrato" class="admin-only hidden">▤ Administración del Contrato</button>
      <button data-page="sistema" class="admin-only hidden">◫ Sistema</button>
      <button data-page="usuarios" class="admin-only hidden">♙ Usuarios</button>
    </nav>
    <div class="sidebar-bottom"><div class="userbox"><strong id="userName">Usuario</strong><small id="userRole">rol</small><button id="logoutBtn" class="logout">Cerrar sesión</button></div></div>
  </aside>
  <main class="main">
    <section id="page-inicio" class="page"></section>
    <section id="page-preventivo" class="page hidden"></section>
    <section id="page-correctivo" class="page hidden"></section>
    <section id="page-equipos" class="page hidden"></section>
    <section id="page-vehiculos" class="page hidden"></section>
    <section id="page-dotacion" class="page hidden"></section>
    <section id="page-contrato" class="page hidden"></section>
    <section id="page-sistema" class="page hidden"></section>
    <section id="page-usuarios" class="page hidden"></section>
  </main>
</div>
<div id="modalRoot"></div>
<script>
const CFG=window.STAINHER_CONFIG; const sb=supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
let state={session:null,profile:null,equipos:[],correctivo:[],correctivoMonth:new Date().getMonth()+1,correctivoYear:new Date().getFullYear(),charts:{},system:{},preventivos:[],preventivosYear:[],prevSelectedEquipo:'',prevYear:new Date().getFullYear(),prevMonth:new Date().getMonth()+1,prevView:'equipos'};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const fmtH=n=>Number.isFinite(n)?`${n.toFixed(1)} h`:'—';
function toast(msg,type=''){const el=document.createElement('div');el.className=`notice ${type}`;el.textContent=msg;$('#modalRoot').appendChild(el);setTimeout(()=>el.remove(),3500)}
function isAdmin(){return state.profile?.rol==='administrador'} function canPlan(){return ['administrador','planificador'].includes(state.profile?.rol)}
async function loadProfile(){const {data,error}=await sb.from('perfiles').select('*').eq('id',state.session.user.id).single();if(error)throw error;state.profile=data;$('#userName').textContent=data.nombre||state.session.user.email;$('#userRole').textContent=data.rol;$$('.admin-only').forEach(x=>x.classList.toggle('hidden',!isAdmin()));}
async function loadEquipos(){const {data,error}=await sb.from('equipos').select('*').order('nombre');if(error)throw error;state.equipos=data||[];}
function showApp(){ $('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');renderAll(); }
function showLogin(){ $('#appView').classList.add('hidden');$('#loginView').classList.remove('hidden'); }
async function init(){const {data:{session}}=await sb.auth.getSession();if(session){state.session=session;try{await loadProfile();await loadEquipos();showApp();}catch(e){console.error(e);showLogin();}}else showLogin();}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const m=$('#loginMsg');m.classList.add('hidden');const {data,error}=await sb.auth.signInWithPassword({email:$('#email').value,password:$('#password').value});if(error){m.textContent=error.message;m.classList.remove('hidden');return;}state.session=data.session;try{await loadProfile();await loadEquipos();showApp();}catch(err){m.textContent='Usuario autenticado, pero falta su perfil/rol.';m.classList.remove('hidden')}});
$('#logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};
$$('.nav button').forEach(b=>b.onclick=()=>{if(['usuarios','sistema','contrato'].includes(b.dataset.page)&&!isAdmin())return;$$('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$$('.page').forEach(x=>x.classList.add('hidden'));$(`#page-${b.dataset.page}`).classList.remove('hidden');if(b.dataset.page==='correctivo')loadCorrectivo();if(b.dataset.page==='preventivo')renderPreventivo();if(b.dataset.page==='contrato')renderContrato();if(b.dataset.page==='vehiculos')renderStandaloneVehiculos();if(b.dataset.page==='dotacion')renderStandaloneDotacion();if(b.dataset.page==='sistema')renderSistema();if(b.dataset.page==='usuarios')renderUsuarios();});
function renderAll(){renderInicio();renderEquipos();renderPreventivo();renderCorrectivoShell();renderContrato();renderSistema();renderUsuarios();}
function renderInicio(){const activos=state.equipos.filter(e=>e.estado==='activo').length;$('#page-inicio').innerHTML=`<div class="topbar"><div><h2>Panel de Mantenimiento</h2><p>Vista integrada de parque, preventivo y correctivo.</p></div><div class="actions">${isAdmin()?'<button class="btn primary" onclick="openUserModal()">+ Crear usuario</button>':''}</div></div><div class="grid-kpi"><div class="kpi"><span>Equipos</span><strong>${state.equipos.length}</strong><details class="kpi-help"><summary>Cómo se calcula</summary><div><b>Equipos = total de equipos registrados en el maestro.</b><br>Incluye equipos activos y retirados que permanezcan registrados para conservar su trazabilidad histórica.</div></details></div><div class="kpi"><span>Activos</span><strong>${activos}</strong><details class="kpi-help"><summary>Cómo se calcula</summary><div><b>Activos = equipos cuyo estado es “activo”.</b><br>Los equipos fuera de servicio o retirados se mantienen en el parque y en el histórico, pero no se contabilizan en este KPI.</div></details></div><div class="kpi"><span>Correctivos mes</span><strong id="homeCorr">—</strong><details class="kpi-help"><summary>Cómo se calcula</summary><div><b>Correctivos mes = número de atenciones correctivas del mes actual.</b><br>Se cuentan los registros válidos cargados en la base de averías para el período vigente, después de las exclusiones configuradas.</div></details></div><div class="kpi"><span>Horas correctivo</span><strong id="homeHours">—</strong><details class="kpi-help"><summary>Cómo se calcula</summary><div><b>Horas correctivo = suma de la duración de todas las atenciones del mes.</b><br>Cada duración se calcula entre Fecha/Hora inicio y Fecha/Hora término del trabajo.</div></details></div><div class="kpi"><span>Cierre operativo</span><strong id="homeOp">—</strong><details class="kpi-help"><summary>Cómo se calcula</summary><div><b>Cierre operativo = (atenciones finalizadas Operativas ÷ total de atenciones) × 100.</b><br>Usa el campo Estado final del equipo de la base de averías.</div></details></div></div><div class="panel"><div class="row-between"><h3>Parque de equipos</h3><button class="btn" onclick="gotoPage('equipos')">Ver todos</button></div><div class="cards">${state.equipos.map(cardEquipo).join('')||'<div class="empty">Aún no hay equipos cargados.</div>'}</div></div>`;loadCorrectivo(true);} 
function cardEquipo(e){return `<article class="equipment-card"><div class="row-between"><span class="tag">${e.tipo||'Equipo'}</span><span class="status ${e.estado==='activo'?'ok':e.estado==='fuera_servicio'?'bad':'warn'}">${e.estado==='fuera_servicio'?'fuera de servicio':(e.estado||'activo')}</span></div><h4>${e.nombre}</h4><div class="muted">${e.ubicacion||'Ubicación no informada'}</div><div class="progress"><i style="width:${e.estado==='activo'?100:e.estado==='fuera_servicio'?10:30}%"></i></div><div class="row-between"><small class="muted">${e.fabricante||'Fabricante s/i'} ${e.modelo?`· ${e.modelo}`:''}</small><button class="btn" onclick="openEquipoModal('${e.id}')">Detalle</button></div></article>`}
function gotoPage(p){document.querySelector(`[data-page="${p}"]`).click()}
function renderEquipos(){const btn=canPlan()?'<button class="btn primary" onclick="openEquipoModal()">+ Nuevo equipo</button>':'';$('#page-equipos').innerHTML=`<div class="topbar"><div><h2>Equipos</h2><p>Maestro técnico editable del parque.</p></div>${btn}</div><div class="cards">${state.equipos.map(cardEquipo).join('')||'<div class="empty">Sin equipos cargados.</div>'}</div>`}
function openEquipoModal(id=''){if(!canPlan()&&id==='')return;const e=state.equipos.find(x=>x.id===id)||{};const editable=canPlan();$('#modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="row-between"><h3>${id?'Ficha del equipo':'Nuevo equipo'}</h3><button class="btn" onclick="closeModal()">Cerrar</button></div><form id="equipoForm" class="form-grid"><label>Nombre<input class="field" name="nombre" value="${e.nombre||''}" ${editable?'':'disabled'} required></label><label>Nombre alternativo<input class="field" name="nombre_alternativo" value="${e.nombre_alternativo||''}" ${editable?'':'disabled'}></label><label>Tipo<input class="field" name="tipo" value="${e.tipo||''}" ${editable?'':'disabled'}></label><label>Ubicación<input class="field" name="ubicacion" value="${e.ubicacion||''}" ${editable?'':'disabled'}></label><label>Fabricante<input class="field" name="fabricante" value="${e.fabricante||''}" ${editable?'':'disabled'}></label><label>Modelo<input class="field" name="modelo" value="${e.modelo||''}" ${editable?'':'disabled'}></label><label>Capacidad carga<input class="field" name="capacidad_carga" value="${e.capacidad_carga||''}" ${editable?'':'disabled'}></label><label>Pasajeros<input class="field" name="pasajeros" type="number" value="${e.pasajeros??''}" ${editable?'':'disabled'}></label><label>Velocidad<input class="field" name="velocidad" value="${e.velocidad||''}" ${editable?'':'disabled'}></label><label>Paradas<input class="field" name="paradas" type="number" value="${e.paradas??''}" ${editable?'':'disabled'}></label><label>Criticidad<select class="field" name="criticidad" ${editable?'':'disabled'}><option ${e.criticidad==='Alta'?'selected':''}>Alta</option><option ${e.criticidad==='Media'?'selected':''}>Media</option><option ${e.criticidad==='Baja'?'selected':''}>Baja</option></select></label><label>Estado<select class="field" name="estado" ${editable?'':'disabled'}><option value="activo" ${(!e.estado||e.estado==='activo')?'selected':''}>activo</option><option value="fuera_servicio" ${e.estado==='fuera_servicio'?'selected':''}>fuera de servicio</option><option value="retirado" ${e.estado==='retirado'?'selected':''}>retirado</option></select></label><label class="full">Observaciones<textarea class="field" name="observaciones" rows="4" ${editable?'':'disabled'}>${e.observaciones||''}</textarea></label>${editable?'<div class="full"><button class="btn primary" type="submit">Guardar</button></div>':''}</form></div></div>`;if(editable)$('#equipoForm').onsubmit=async ev=>{ev.preventDefault();const obj=Object.fromEntries(new FormData(ev.target));obj.pasajeros=obj.pasajeros?Number(obj.pasajeros):null;obj.paradas=obj.paradas?Number(obj.paradas):null;let q=id?sb.from('equipos').update(obj).eq('id',id):sb.from('equipos').insert(obj);const {error}=await q;if(error)return toast(error.message,'error');await loadEquipos();closeModal();renderAll();toast('Equipo guardado','success')};}
function closeModal(){ $('#modalRoot').innerHTML=''; }
function openDeletePreventivoModal(){
  if(!isAdmin())return;
  const y=Number($('#prevYear')?.value||state.prevYear||new Date().getFullYear());
  const m=Number($('#prevMonth')?.value||state.prevMonth||new Date().getMonth()+1);
  const monthName=new Date(2000,m-1).toLocaleString('es-CL',{month:'long'});
  $('#modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" style="width:min(620px,100%)"><div class="row-between"><h3>Borrar programación preventiva</h3><button class="btn" onclick="closeModal()">Cerrar</button></div><div class="notice error"><b>Acción irreversible.</b> Esta opción elimina registros de programación preventiva desde Supabase. No elimina equipos ni registros correctivos.</div><form id="deletePrevForm" class="form-grid"><label>Año<input id="deletePrevYear" class="field" type="number" value="${y}" required></label><label>Alcance<select id="deletePrevScope" class="field"><option value="month">Solo un mes</option><option value="year">Todo el año</option></select></label><label id="deletePrevMonthWrap">Mes<select id="deletePrevMonth" class="field">${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${i+1===m?'selected':''}>${new Date(2000,i).toLocaleString('es-CL',{month:'long'})}</option>`).join('')}</select></label><label class="full">Escribe <b>BORRAR</b> para confirmar<input id="deletePrevConfirm" class="field" autocomplete="off" placeholder="BORRAR" required></label><div class="full"><div id="deletePrevSummary" class="notice">Se eliminará la programación de <b>${monthName} ${y}</b>.</div></div><div class="full"><button id="deletePrevBtn" class="btn" type="submit" style="background:#7f1d1d;border-color:#991b1b;color:white;font-weight:700">Eliminar programación</button></div></form></div></div>`;
  const refresh=()=>{const scope=$('#deletePrevScope').value,yr=Number($('#deletePrevYear').value||y),mo=Number($('#deletePrevMonth').value||m);$('#deletePrevMonthWrap').classList.toggle('hidden',scope==='year');const txt=scope==='year'?`Se eliminará <b>toda la programación preventiva del año ${yr}</b>.`:`Se eliminará la programación preventiva de <b>${new Date(2000,mo-1).toLocaleString('es-CL',{month:'long'})} ${yr}</b>.`;$('#deletePrevSummary').innerHTML=txt;};
  $('#deletePrevScope').addEventListener('change',refresh);$('#deletePrevYear').addEventListener('input',refresh);$('#deletePrevMonth').addEventListener('change',refresh);refresh();
  $('#deletePrevForm').onsubmit=deletePreventivoProgramacion;
}
async function deletePreventivoProgramacion(ev){
  ev.preventDefault();
  if(!isAdmin())return toast('Solo el administrador puede borrar programación preventiva','error');
  if(($('#deletePrevConfirm')?.value||'').trim().toUpperCase()!=='BORRAR')return toast('Escribe BORRAR para confirmar','error');
  const y=Number($('#deletePrevYear').value),scope=$('#deletePrevScope').value,m=Number($('#deletePrevMonth').value);
  if(!Number.isInteger(y)||y<2000||y>2100)return toast('Año no válido','error');
  const btn=$('#deletePrevBtn');btn.disabled=true;btn.textContent='Eliminando…';
  let q=sb.from('programacion_preventiva').delete().eq('anio',y);
  if(scope==='month')q=q.eq('mes',m);
  const {error}=await q;
  if(error){btn.disabled=false;btn.textContent='Eliminar programación';return toast(error.message,'error');}
  closeModal();state.prevYear=y;if(scope==='month')state.prevMonth=m;renderPreventivo();toast(scope==='year'?`Programación ${y} eliminada`:`Programación del mes eliminada`,'success');
}
function renderPreventivo(){
  const y=state.prevYear||new Date().getFullYear(),m=state.prevMonth||new Date().getMonth()+1;
  $('#page-preventivo').innerHTML=`<div class="topbar"><div><h2>Mantenimiento Preventivo</h2><p>Planificación, programación y cumplimiento mensual.</p></div><div class="actions"><button class="btn" onclick="downloadPreventivoReport()">↓ Informe mensual PDF</button>${canPlan()?'<button class="btn" onclick="openImportPlanModal()">↑ Importar Plan Matriz Excel</button><button class="btn primary" onclick="openPlanModal()">+ Programar actividad</button>':''}${isAdmin()?'<button class="btn" style="border-color:#7f1d1d;color:#fca5a5" onclick="openDeletePreventivoModal()">🗑 Borrar programación</button>':''}</div></div><div class="prev-view-tabs"><button class="prev-view-tab ${state.prevView==='equipos'?'active':''}" onclick="setPrevView('equipos')">▦ Vista mensual por equipos</button><button class="prev-view-tab ${state.prevView==='gantt'?'active':''}" onclick="setPrevView('gantt')">▤ Carta Gantt anual</button></div><div class="prev-toolbar"><select id="prevYear" class="field"><option>${y-1}</option><option selected>${y}</option><option>${y+1}</option></select><select id="prevMonth" class="field ${state.prevView==='gantt'?'hidden':''}">${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${m===i+1?'selected':''}>${new Date(2000,i).toLocaleString('es',{month:'long'})}</option>`).join('')}</select><select id="prevState" class="field"><option value="">Todos los estados</option><option value="programado">Programado</option><option value="pendiente">Pendiente</option><option value="ejecutado">Ejecutado</option></select><input id="prevSearch" class="field" placeholder="Buscar actividad o equipo..." style="min-width:220px"><button class="btn primary" onclick="loadPreventivos()">Actualizar</button></div><div id="prevContent"><div class="empty">Cargando planificación…</div></div>`;
  $('#prevState').addEventListener('change',renderPreventivoData);$('#prevSearch').addEventListener('input',renderPreventivoData);loadPreventivos();
}
function setPrevView(view){state.prevView=view==='gantt'?'gantt':'equipos';renderPreventivo();}
async function loadPreventivos(){
  const y=Number($('#prevYear')?.value||state.prevYear||new Date().getFullYear()),m=Number($('#prevMonth')?.value||state.prevMonth||new Date().getMonth()+1);state.prevYear=y;state.prevMonth=m;
  const [monthRes,yearRes]=await Promise.all([
    sb.from('programacion_preventiva').select('*,equipos(nombre,estado)').eq('anio',y).eq('mes',m).order('fecha_programada'),
    sb.from('programacion_preventiva').select('*,equipos(nombre,estado)').eq('anio',y).order('mes').order('fecha_programada')
  ]);
  const error=monthRes.error||yearRes.error;if(error){if($('#prevContent'))$('#prevContent').innerHTML=`<div class="notice error">${error.message}</div>`;return;}
  state.preventivos=(monthRes.data||[]).filter(r=>r.equipos?.estado!=='retirado');state.preventivosYear=(yearRes.data||[]).filter(r=>r.equipos?.estado!=='retirado');
  if(!state.prevSelectedEquipo||!(state.preventivosYear||[]).some(r=>r.equipo_id===state.prevSelectedEquipo)){state.prevSelectedEquipo=state.preventivosYear[0]?.equipo_id||state.equipos[0]?.id||'';}
  renderPreventivoData();
}
function preventivoIsLate(r){if(r.estado==='ejecutado'||!r.fecha_programada)return false;const today=new Date();today.setHours(0,0,0,0);const d=new Date(r.fecha_programada+'T00:00:00');return d<today;}
function preventivoStats(rows){const total=rows.length,exec=rows.filter(r=>r.estado==='ejecutado').length,pend=rows.filter(r=>r.estado!=='ejecutado').length,late=rows.filter(preventivoIsLate).length,pct=total?exec/total*100:0;return {total,exec,pend,late,pct};}
function renderPreventivoData(){
  if(state.prevView==='gantt')return renderPreventivoGantt();
  const box=$('#prevContent');if(!box)return;let rows=[...(state.preventivos||[])];const st=$('#prevState')?.value||'',q=cleanHeader($('#prevSearch')?.value||'');if(st)rows=rows.filter(r=>r.estado===st);if(q)rows=rows.filter(r=>cleanHeader(r.actividad).includes(q)||cleanHeader(r.equipos?.nombre||'').includes(q));
  const allStats=preventivoStats(rows);const grouped={};rows.forEach(r=>{const n=r.equipos?.nombre||'Sin equipo';(grouped[n]??=[]).push(r)});
  const cards=Object.entries(grouped).map(([name,rs])=>{const k=preventivoStats(rs),id=rs[0]?.equipo_id||'';return `<article class="prev-equipment-card ${id===state.prevSelectedEquipo?'selected':''}" onclick="selectPrevEquipo('${id}')"><h4>${name}</h4><div class="pct" style="color:${k.pct>=80?'var(--green)':k.pct>=60?'var(--yellow)':'var(--red)'}">${k.pct.toFixed(0)}%</div><div class="muted" style="font-size:12px;margin-bottom:10px">Cumplimiento</div><div class="prev-mini"><span><i class="prev-dot" style="background:var(--blue)"></i>Programadas</span><b>${k.total}</b><span><i class="prev-dot" style="background:var(--green)"></i>Ejecutadas</span><b>${k.exec}</b><span><i class="prev-dot" style="background:var(--yellow)"></i>Pendientes</span><b>${k.pend}</b><span><i class="prev-dot" style="background:var(--red)"></i>Atrasadas</span><b>${k.late}</b></div></article>`}).join('');
  const selectedRows=rows.filter(r=>r.equipo_id===state.prevSelectedEquipo);const selectedName=selectedRows[0]?.equipos?.nombre||state.equipos.find(e=>e.id===state.prevSelectedEquipo)?.nombre||'Equipo';
  box.innerHTML=`<div class="grid-kpi"><div class="kpi"><span>Cumplimiento global</span><strong class="accent-green">${allStats.pct.toFixed(0)}%</strong><small>${allStats.exec} / ${allStats.total} actividades</small><details class="kpi-help"><summary>Cómo se calcula</summary><div>Actividades ejecutadas ÷ actividades programadas del período × 100.</div></details></div><div class="kpi"><span>Programadas</span><strong>${allStats.total}</strong><details class="kpi-help"><summary>Cómo se calcula</summary><div>Total de actividades preventivas registradas para el año, mes y filtros seleccionados.</div></details></div><div class="kpi"><span>Ejecutadas</span><strong class="accent-green">${allStats.exec}</strong><details class="kpi-help"><summary>Cómo se calcula</summary><div>Actividades cuyo estado es “ejecutado”.</div></details></div><div class="kpi"><span>Pendientes</span><strong class="accent-yellow">${allStats.pend}</strong><details class="kpi-help"><summary>Cómo se calcula</summary><div>Actividades que aún no están marcadas como ejecutadas.</div></details></div><div class="kpi"><span>Atrasadas</span><strong class="accent-red">${allStats.late}</strong><details class="kpi-help"><summary>Cómo se calcula</summary><div>Actividades no ejecutadas cuya fecha programada ya venció respecto de la fecha actual.</div></details></div></div><div class="panel"><div class="row-between"><h3>Vista por equipos</h3><span class="muted">Selecciona una ficha para editar su programación</span></div>${cards?`<div class="prev-equipment-grid">${cards}</div>`:'<div class="empty">No hay actividades para los filtros seleccionados.</div>'}</div>${selectedRows.length?renderPrevDetail(selectedName,selectedRows):''}`;
}
function ganttStatus(r){if(r.estado==='ejecutado')return 'ejecutado';if(preventivoIsLate(r))return 'atrasado';if(r.estado==='pendiente')return 'pendiente';return 'programado';}
function renderPreventivoGantt(){
  const box=$('#prevContent');if(!box)return;let rows=[...(state.preventivosYear||[])];const st=$('#prevState')?.value||'',q=cleanHeader($('#prevSearch')?.value||'');if(st)rows=rows.filter(r=>r.estado===st);if(q)rows=rows.filter(r=>cleanHeader(r.actividad).includes(q)||cleanHeader(r.equipos?.nombre||'').includes(q));
  const k=preventivoStats(rows);const groups=new Map();
  rows.forEach(r=>{const eq=r.equipos?.nombre||'Sin equipo';const key=[r.equipo_id,eq,r.actividad||'Sin actividad',r.frecuencia||'—'].join('||');if(!groups.has(key))groups.set(key,{equipo_id:r.equipo_id,equipo:eq,actividad:r.actividad||'Sin actividad',frecuencia:r.frecuencia||'—',months:Array.from({length:12},()=>[])});groups.get(key).months[(Number(r.mes)||1)-1].push(r);});
  const ordered=[...groups.values()].sort((a,b)=>a.equipo.localeCompare(b.equipo,'es')||a.actividad.localeCompare(b.actividad,'es'));
  const monthNames=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

function cleanHeader(v=''){return String(v??'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ')}
function findCol(obj,names){const keys=Object.keys(obj||{});for(const n of names){const hit=keys.find(k=>cleanHeader(k)===cleanHeader(n));if(hit)return hit;}return null}
const MONTH_ALIASES=[['enero','ene','jan'],['febrero','feb'],['marzo','mar'],['abril','abr','apr'],['mayo','may'],['junio','jun'],['julio','jul'],['agosto','ago','aug'],['septiembre','setiembre','sep','sept'],['octubre','oct'],['noviembre','nov'],['diciembre','dic','dec']];
function detectMonthCol(obj,monthIndex){const keys=Object.keys(obj||{});return keys.find(k=>MONTH_ALIASES[monthIndex].includes(cleanHeader(k)))||null}
function mapEquipoPlan(nombre){const norm=normalizarEquipo(nombre);const raw=cleanHeader(nombre);return state.equipos.find(e=>cleanHeader(e.nombre)===cleanHeader(norm)||cleanHeader(e.nombre_alternativo||'')===raw||cleanHeader(e.nombre)===raw)||null}

function planHeaderScore(row){
  const vals=(row||[]).map(v=>cleanHeader(v));
  const has=(aliases)=>vals.some(v=>aliases.some(a=>v===cleanHeader(a)||v.includes(cleanHeader(a))));
  const equipo=has(['Equipo','Nombre equipo','Ascensor / Equipo']);
  const actividad=has(['Actividad','Actividad de mantenimiento','Pauta','Tarea','Descripción','Descripcion','Descripción actividad','Descripcion actividad']);
  const frecuencia=has(['Frecuencia','Periodicidad']);
  let months=0;
  vals.forEach(v=>{for(let i=0;i<12;i++){if(MONTH_ALIASES[i].includes(v)||v===String(i+1)||v===String(i+1).padStart(2,'0')){months++;break}}});
  const plano=has(['Mes']) && has(['Estado']);
  return (equipo?6:0)+(actividad?6:0)+(frecuencia?1:0)+months*2+(plano?4:0);
}
function detectPlanSheetAndHeader(wb){
  let best=null;
  for(const sheetName of wb.SheetNames){
    const ws=wb.Sheets[sheetName];
    const grid=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});
    for(let i=0;i<Math.min(grid.length,80);i++){
      const row=grid[i]||[];
      const first=cleanHeader(row[0]);
      const dateMonths=row.slice(1,13).filter(v=>{
        if(v instanceof Date&&!Number.isNaN(v.getTime()))return true;
        const d=new Date(v);return v&&!Number.isNaN(d.getTime());
      }).length;
      const legacyScore=(first.includes('columna primaria')&&dateMonths>=8)?100+dateMonths:0;
      const score=Math.max(planHeaderScore(row),legacyScore);
      if(!best||score>best.score)best={sheetName,ws,grid,headerIndex:i,score,legacy:legacyScore>0};
    }
  }
  return best;
}
function planObjectsFromGrid(grid,headerIndex){
  const src=(grid[headerIndex]||[]).map((v,i)=>String(v||'').trim()||`__col_${i}`);
  const headers=[];const used={};
  src.forEach((h,i)=>{let k=h;if(used[k])k=`${k}_${i}`;used[k]=1;headers.push(k)});
  return grid.slice(headerIndex+1).map((row,ri)=>{const o={__row:headerIndex+2+ri};headers.forEach((h,i)=>o[h]=row?.[i]??'');return o});
}
function detectMonthCol(obj,monthIndex){const keys=Object.keys(obj||{});return keys.find(k=>{const c=cleanHeader(k);return MONTH_ALIASES[monthIndex].includes(c)||c===String(monthIndex+1)||c===String(monthIndex+1).padStart(2,'0')})||null}
function inferFrequencyFromActivity(activity,count){
  const a=cleanHeader(activity);
  if(a.includes('quincenal'))return 'Quincenal';
  if(a.includes('mensual'))return 'Mensual';
  if(a.includes('trimestral'))return 'Trimestral';
  if(a.includes('semestral'))return 'Semestral';
  if(a.includes('anual'))return 'Anual';
  if(count>=10)return 'Mensual';
  if(count>=4)return 'Trimestral';
  if(count===2)return 'Semestral';
  if(count===1)return 'Anual';
  return '';
}
function isLegacyEquipmentRow(row){
  if(!row||!row[0])return false;
  const label=String(row[0]).trim();
  const eq=mapEquipoPlan(label);
  if(!eq)return false;
  const vals=row.slice(1,13);
  const formulaLike=vals.filter(v=>String(v||'').includes('IFERROR')||String(v||'').includes('#REF!')).length;
  return formulaLike>=4 || vals.filter(v=>v!==''&&v!=null).length>=8;
}
function parseLegacyPlanMatrix(detected,year,siMode){
  const parsed=[];const errors=[];const grid=detected.grid;let currentEq=null;
  for(let ri=detected.headerIndex+1;ri<grid.length;ri++){
    const row=grid[ri]||[];const label=String(row[0]??'').trim();
    if(!label)continue;
    if(isLegacyEquipmentRow(row)){
      currentEq=mapEquipoPlan(label);
      if(!currentEq)errors.push(`Fila ${ri+1}: equipo no reconocido “${label}”`);
      continue;
    }
    if(!currentEq)continue;
    const monthStates=[];
    for(let mi=0;mi<12;mi++){
      const est=stateFromMatrixValue(row[mi+1],siMode);
      if(est)monthStates.push({mi,est});
    }
    if(!monthStates.length)continue;
    const frecuencia=inferFrequencyFromActivity(label,monthStates.length);
    monthStates.forEach(({mi,est})=>parsed.push({
      equipo_id:currentEq.id,equipo_nombre:currentEq.nombre,actividad:label,frecuencia,
      anio:year,mes:mi+1,fecha_programada:null,estado:est
    }));
  }
  return {parsed,errors};
}

        const actCol=findCol(r,['Actividad','Actividad de mantenimiento','Pauta','Tarea','Descripción','Descripcion','Descripción actividad','Descripcion actividad']);
        const freqCol=findCol(r,['Frecuencia','Periodicidad']);
        const yearCol=findCol(r,['Año','Anio']);
        const monthCol=findCol(r,['Mes']);
        const dateCol=findCol(r,['Fecha programada','Fecha']);

        let equipoTxt=equipoCol?String(r[equipoCol]||'').trim():'';
        if(equipoTxt)ultimoEquipo=equipoTxt; else equipoTxt=ultimoEquipo;
        const actividad=actCol?r[actCol]:'';
        if(!equipoTxt&&!actividad)return;
        if(!actividad)return;
        const eq=mapEquipoPlan(equipoTxt);
        if(!eq){errors.push(`Fila ${rowNum}: equipo no reconocido “${equipoTxt}”`);return}
        if(monthCol){
          let m=Number(r[monthCol]);
          if(!m){const cm=cleanHeader(r[monthCol]);m=MONTH_ALIASES.findIndex(a=>a.includes(cm))+1}
          if(m>=1&&m<=12){
            parsed.push({equipo_id:eq.id,equipo_nombre:eq.nombre,actividad:String(actividad).trim(),frecuencia:freqCol?String(r[freqCol]||'').trim():'',anio:Number(yearCol?r[yearCol]:year)||year,mes:m,fecha_programada:dateCol?excelDateToIso(r[dateCol]):null,estado:stateCol?normalizePlanState(r[stateCol]):'programado'});
          }else errors.push(`Fila ${rowNum}: mes inválido`);
          return;
        }
        let monthHits=0;
        for(let mi=0;mi<12;mi++){
          const mk=detectMonthCol(r,mi);if(!mk)continue;
          const est=stateFromMatrixValue(r[mk],siMode);
          if(est){monthHits++;parsed.push({equipo_id:eq.id,equipo_nombre:eq.nombre,actividad:String(actividad).trim(),frecuencia:freqCol?String(r[freqCol]||'').trim():'',anio:year,mes:mi+1,fecha_programada:null,estado:est});}
        }

function calcReliabilityKpis(rows){
  const eq=$('#corrEquipo')?.value||'';
  const scoped=eq?rows.filter(r=>r.equipo===eq):rows;

  // La guía de trabajo es el ID de la falla. Registros sin guía no participan
  // en MTBF, MTTR ni Disponibilidad.
  const valid=scoped.filter(r=>String(r.guia||'').trim() && Number.isFinite(Number(r.duracion_horas)) && Number(r.duracion_horas)>=0);
  if(!valid.length)return {ready:false,mttr:null,mtbf:null,disponibilidad:null,fallas:0,downtime:0,observedHours:0};

  // Agrupa por número de guía para no contar dos veces una misma falla.
  // Si una misma guía tiene más de una intervención, sus duraciones se acumulan.
  const events=new Map();
  valid.forEach(r=>{
    const key=String(r.guia).trim();
    const h=Number(r.duracion_horas)||0;
    events.set(key,(events.get(key)||0)+h);
  });

  const fallas=events.size;
  const downtime=[...events.values()].reduce((a,h)=>a+h,0);
  const days=new Date(state.correctivoYear,state.correctivoMonth,0).getDate();
  const periodHours=days*24;
  const equipmentCount=eq?1:Math.max(1,new Set(scoped.map(r=>r.equipo).filter(Boolean)).size);
  const observedHours=periodHours*equipmentCount;
  const uptime=Math.max(0,observedHours-downtime);

  return {
    ready:true,
    mttr:fallas?downtime/fallas:null,
    mtbf:fallas?uptime/fallas:null,
    disponibilidad:observedHours?uptime/observedHours*100:null,
    fallas,
    downtime,
    observedHours
  };
}
function calcCorrectivoKpis(rows){
  const hours=rows.reduce((a,r)=>a+(r.duracion_horas||0),0);
  const op=rows.length?rows.filter(r=>r.estado_normalizado==='Operativo').length/rows.length*100:0;
  return {atenciones:rows.length,horas:hours,cierre_operativo:op,...calcReliabilityKpis(rows)};
}

function parseFechaExcel(v){

    const d=XLSX.SSF.parse_date_code(v); if(d)return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;
  }

  m=x.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})$/);if(m)return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;

function parseHora(v){
  if(v===null||v===undefined||v==='')return null;
  if(typeof v==='number'&&v>=0&&v<1){const min=Math.round(v*24*60)%1440;return `${String(Math.floor(min/60)).padStart(2,'0')}:${String(min%60).padStart(2,'0')}`;}
  let x=String(v).trim().toUpperCase().replace(/HRS?|HORAS?/g,'').replace(/\s+/g,' ');
  x=x.replace(/\b(AM|PM)\b/g,' $1').replace(/\s+/g,' ').trim();
  let m=x.match(/^(\d{1,2})(?::(\d{1,3}))?\s*(AM|PM)?$/);if(!m)return null;
  let h=Number(m[1]),mi=Number((m[2]||'0').slice(0,2));if(mi>59)mi=0;
  const ap=m[3];if(ap==='PM'&&h<12)h+=12;if(ap==='AM'&&h===12)h=0;if(h>23)return null;
  return `${String(h).padStart(2,'0')}:${String(mi).padStart(2,'0')}`;
}

async function loadUsers(){if(!isAdmin())return;const [{data:profiles,error:pErr},{data:authUsers,error:aErr}]=await Promise.all([sb.from('perfiles').select('id,nombre,email,rol,activo').order('nombre'),sb.rpc('admin_list_auth_users')]);if(pErr||aErr){$('#usersTable').innerHTML=`<div class="notice error">${esc((pErr||aErr).message)}<br><small>Ejecuta PATCH_V7_MEJORAS.sql para habilitar sincronización de usuarios.</small></div>`;return}const pmap=new Map((profiles||[]).map(x=>[String(x.id),x])),rows=(authUsers||[]).map(a=>({...a,perfil:pmap.get(String(a.id))}));$('#usersTable').innerHTML=`<table><thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th><th>Sincronización</th><th>Acciones</th></tr></thead><tbody>${rows.map(u=>{const p=u.perfil;return `<tr><td>${esc(p?.nombre||'—')}</td><td>${esc(u.email||p?.email||'')}</td><td>${p?esc(p.rol):'—'}</td><td>${p?`<span class="status ${p.activo?'ok':'bad'}">${p.activo?'Activo':'Inactivo'}</span>`:'<span class="status warn">Sin perfil</span>'}</td><td>${p?'<span class="status ok">Sincronizado</span>':`<button class="btn" onclick="openSyncProfileModal('${u.id}','${esc(u.email||'')}')">Sincronizar perfil</button>`}</td><td>${p?`<button class="btn" onclick="openEditUserModal('${u.id}')">Editar usuario</button>`:'—'}</td></tr>`}).join('')}</tbody></table>`}
function openSyncProfileModal(uid,email){$('#modalRoot').innerHTML=`<div class="modal-bg"><div class="modal"><div class="row-between"><h3>Sincronizar perfil</h3><button class="btn" onclick="closeModal()">Cerrar</button></div><div class="notice sync-warning">El usuario ya existe en Supabase Auth. Esta acción crea o actualiza únicamente su registro en <b>public.perfiles</b>.</div><form id="syncProfileForm" class="form-grid"><label class="full">UID<input class="field" value="${esc(uid)}" disabled></label><label>Nombre<input class="field" name="nombre" required></label><label>Correo<input class="field" name="email" type="email" value="${esc(email)}" required></label><label>Rol<select class="field" name="rol"><option>administrador</option><option>planificador</option><option>supervisor</option><option>prevencion</option><option>tecnico</option><option>consulta</option></select></label><label>Estado<select class="field" name="activo"><option value="true">Activo</option><option value="false">Inactivo</option></select></label><div class="full"><button class="btn primary">Sincronizar</button></div></form></div></div>`;$('#syncProfileForm').onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));const {error}=await sb.rpc('admin_upsert_perfil',{p_user_id:uid,p_nombre:o.nombre,p_email:o.email,p_rol:o.rol,p_activo:o.activo==='true'});if(error)return toast(error.message,'error');closeModal();await loadUsers();toast('Perfil sincronizado','success')}}

  if(!isAdmin())return;
  const {data:u,error}=await sb.from('perfiles').select('id,nombre,email,rol,activo').eq('id',uid).maybeSingle();

// Consulta disponible para todos los perfiles autenticados.
// Edición restringida al Administrador mediante UI + RLS.

async function loadVehiculosSharedV952(){
  const qs=await Promise.all([
    sb.from('vehiculos_contrato').select('*').order('marca_modelo'),
    sb.from('vehiculo_eventos').select('*').order('fecha_inicio',{ascending:false}),
    sb.from('vehiculo_inventario').select('*').order('categoria').order('elemento')
  ]);
  const err=qs.find(x=>x.error)?.error;
  if(err)throw err;
  state.contractData=state.contractData||{};
  Object.assign(state.contractData,{
    vehiculos:qs[0].data||[],
    vehEventos:qs[1].data||[],
    vehInventario:qs[2].data||[]
  });
}
async function loadDotacionSharedV952(){
  const q=isAdmin()?await sb.from('dotacion_contrato').select('*').order('area').order('nombre'):await sb.rpc('dotacion_consulta');
  if(q.error)throw q.error;
  state.contractData=state.contractData||{};
  state.contractData.dotacion=q.data||[];
}
function operationalReadOnlyV93(root){
  if(isAdmin())return;
  root.querySelectorAll('input,select,textarea').forEach(el=>{el.disabled=true;el.title='Vista de consulta';});
  root.querySelectorAll('.action-mini').forEach(el=>el.classList.add('hidden'));
  root.querySelectorAll('button').forEach(btn=>{
    const t=(btn.textContent||'').toLowerCase();
    if(t.includes('registrar')||t.includes('agregar persona')||t.includes('guardar'))btn.classList.add('hidden');
  });
}
function renderLegacyOperationalV93(pageId,renderer,title,subtitle){
  const page=document.getElementById(pageId);if(!page)return;
  page.innerHTML=`<div class="topbar"><div><h2>${title}</h2><p>${subtitle}</p></div><button class="btn" onclick="${pageId==='page-vehiculos'?'renderStandaloneVehiculos()':'renderStandaloneDotacion()'}">↻ Actualizar</button></div><div class="standalone-operational-body"></div>`;
  const original=document.getElementById('contractContent');
  if(original)original.id='contractContent-admin-hidden';
  const mount=page.querySelector('.standalone-operational-body');mount.id='contractContent';
  try{renderer();}finally{mount.removeAttribute('id');if(original)original.id='contractContent';}
  operationalReadOnlyV93(page);
  const privacy=page.querySelector('.privacy-note');
  if(privacy)privacy.textContent=isAdmin()?'RUT y fecha de nacimiento se administran desde la ficha editable de cada persona.':'Vista general de dotación. Los datos personales sensibles no se muestran a perfiles de consulta.';
  decorateTopbars();
}
async function renderStandaloneVehiculos(){
  const p=$('#page-vehiculos');if(!p)return;
  p.innerHTML='<div class="empty">Cargando vehículos…</div>';
  try{await loadVehiculosSharedV952();renderLegacyOperationalV93('page-vehiculos',renderContractVehiculos,'Vehículos','Flota asignada al contrato · consulta disponible para todos los perfiles.');}
  catch(e){p.innerHTML=`<div class="notice error">No se pudo cargar Vehículos: ${esc(e.message||String(e))}<br><small>Verifica que el PATCH V9.5.2 de permisos de consulta esté aplicado en Supabase.</small></div>`;}
}
async function renderStandaloneDotacion(){
  const p=$('#page-dotacion');if(!p)return;
  p.innerHTML='<div class="empty">Cargando dotación…</div>';
  try{await loadDotacionSharedV952();renderLegacyOperationalV93('page-dotacion',renderContractDotacion,'Dotación','Estructura de personal del contrato · consulta disponible para todos los perfiles.');}
  catch(e){p.innerHTML=`<div class="notice error">No se pudo cargar Dotación: ${esc(e.message||String(e))}<br><small>Verifica que el PATCH V9.5.2 de permisos de consulta esté aplicado en Supabase.</small></div>`;}
}
// Evita abrir editores desde perfiles de consulta.
const _openVehicleEventModalV93=openVehicleEventModal;
openVehicleEventModal=function(vehiculoId){if(!isAdmin())return toast('Solo el Administrador puede registrar eventos de vehículos.','error');return _openVehicleEventModalV93(vehiculoId)};
const _openPersonModalV93=openPersonModal;
openPersonModal=function(id=''){if(!isAdmin())return toast('Solo el Administrador puede editar la dotación.','error');return _openPersonModalV93(id)};
// Refresca la página principal correspondiente después de cambios administrativos.
const _updateAdminRowV93=updateAdminRow;
updateAdminRow=async function(table,id,field,value,type='text'){
  await _updateAdminRowV93(table,id,field,value,type);
  if(table==='vehiculos_contrato'&&!$('#page-vehiculos')?.classList.contains('hidden'))setTimeout(renderStandaloneVehiculos,100);
  if(table==='dotacion_contrato'&&!$('#page-dotacion')?.classList.contains('hidden'))setTimeout(renderStandaloneDotacion,100);
};

const V95_CONTROLS=[
 {n:4,code:'CTRL-04',name:'Check List de Camioneta',freq:'Cada vez que aplique',active:false},

];

 'Desarrolla sus tareas en superficies de trabajo limpias.','Mantiene orden y aseo durante la ejecución.','Utiliza correctamente los elementos de protección personal.','Verifica el estado de herramientas y equipos antes de utilizarlos.','Mantiene control de energías y zonas de interacción.','Adopta postura y posición segura para ejecutar la tarea.','Respeta demarcaciones, señalización y restricciones del área.','Mantiene comunicación efectiva con el equipo de trabajo.','Reconoce los peligros y controles críticos de la actividad.','Interviene o detiene la tarea ante una condición insegura.','Las personas se encuentran calificadas para realizar el trabajo.','La documentación de trabajo se encuentra disponible y vigente.','Se cumplen las instrucciones y procedimientos aplicables.','Los materiales se almacenan de manera segura.','Las rutas de acceso y evacuación permanecen despejadas.','El entorno permite realizar el trabajo en forma segura.','Se evidencia liderazgo visible y retroalimentación preventiva.'
];
function v95Days(date){if(!date)return null;const a=new Date();a.setHours(0,0,0,0);const b=new Date(String(date).slice(0,10)+'T00:00:00');return Math.ceil((b-a)/86400000)}
function v95Class(days,priority='normal'){if(priority==='critica'||days<0||days<=7)return 'bad';if(priority==='importante'||days<=30)return 'warn';return ''}
function v95TextDate(d){try{return new Date(String(d).slice(0,10)+'T00:00:00').toLocaleDateString('es-CL',{day:'2-digit',month:'long',year:'numeric'})}catch(_){return d||'—'}}

// ---------------------- PDF corporativo transversal ------------------
function installCorporatePdfV95(doc,title,subtitle=''){
  if(doc.__stainherPdfV95)return;doc.__stainherPdfV95=true;
  const pageW=()=>doc.internal.pageSize.getWidth(),pageH=()=>doc.internal.pageSize.getHeight();
  const drawHeader=()=>{const W=pageW();doc.setFillColor(20,28,36);doc.rect(0,0,W,25,'F');doc.setFillColor(239,91,42);doc.rect(0,25,W,1.4,'F');doc.setTextColor(255);doc.setFont('helvetica','bold');doc.setFontSize(13);doc.text('STAINHER ASCENSORES LTDA.',12,9);doc.setFontSize(9.5);doc.text(title||'Informe',12,15);doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.text('Contrato 4600029879 · Codelco División Andina',12,20);doc.setTextColor(210,218,226);doc.text(subtitle||CONTRACT_FULL_NAME, W-12,15,{align:'right',maxWidth:W*0.46});};
  const drawFooter=(n,total)=>{const W=pageW(),H=pageH();doc.setDrawColor(185,190,196);doc.line(12,H-15,W-12,H-15);doc.setTextColor(90);doc.setFont('helvetica','normal');doc.setFontSize(6.7);doc.text('Stainher Ascensores Ltda. · www.stainher.cl · contacto@stainher.cl · +56 9 7353 0302',12,H-10);doc.text('Documento generado desde STAINHER Dashboard',12,H-6.5);doc.text(`Página ${n} de ${total}`,W-12,H-6.5,{align:'right'});};
  drawHeader();
  if(doc.autoTable){const raw=doc.autoTable.bind(doc);doc.autoTable=(opts={})=>{const userDid=opts.didDrawPage;const margin=Object.assign({},opts.margin||{}, {top:Math.max(Number(opts.margin?.top||0),31),bottom:Math.max(Number(opts.margin?.bottom||0),20)});return raw(Object.assign({},opts,{margin,didDrawPage:(data)=>{if(data.pageNumber>1)drawHeader();if(userDid)userDid(data);}}));};}
  const rawSave=doc.save.bind(doc);doc.save=(name)=>{const total=doc.getNumberOfPages();for(let i=1;i<=total;i++){doc.setPage(i);drawFooter(i,total)}return rawSave(name)};
}
// Reemplaza el encabezado anterior y conserva compatibilidad con todos los informes existentes.
pdfHeader=function(doc,title,subtitle=''){installCorporatePdfV95(doc,title,subtitle)};

async function renderHomeAlertsV95(){
  const box=document.querySelector('#homeImpactAlerts');if(!box)return;
  const items=[];
  try{
    const {data:b}=await sb.rpc('proximos_cumpleanos_v95');const bd=(b||[])[0];
    if(bd)items.push({icon:'🎂',title:'Próximo cumpleaños',txt:`${bd.nombre} · ${v95TextDate(bd.fecha_evento)}`,date:bd.fecha_evento,days:Number(bd.dias_restantes)});
  }catch(e){console.warn('cumpleaños',e)}
  const today=new Date();today.setHours(0,0,0,0);const hol=CHILE_HOLIDAYS.map(([date,name])=>({date,name,days:v95Days(date)})).filter(x=>x.days>=0).sort((a,b)=>a.days-b.days)[0];
  if(hol)items.push({icon:'🇨🇱',title:'Próximo feriado',txt:`${hol.name} · ${v95TextDate(hol.date)}`,date:hol.date,days:hol.days});
  try{
    const {data:h}=await sb.rpc('hitos_contractuales_v95');const x=(h||[])[0];
    if(x?.boleta_vencimiento)items.push({icon:'🛡️',title:'Boleta de garantía',txt:`Vence ${v95TextDate(x.boleta_vencimiento)}`,date:x.boleta_vencimiento,days:v95Days(x.boleta_vencimiento)});
    if(x?.proximo_reajuste)items.push({icon:'↗',title:'Próximo reajuste',txt:`${v95TextDate(x.proximo_reajuste)} · vigente ${Number(x.reajuste_vigente||0).toFixed(4)}%`,date:x.proximo_reajuste,days:v95Days(x.proximo_reajuste)});
  }catch(e){console.warn('hitos',e)}
  try{
    const {data:r}=await sb.from('recordatorios_alertas').select('*').eq('activo',true).gte('fecha_evento',new Date().toISOString().slice(0,10)).order('fecha_evento',{ascending:true}).limit(8);
    (r||[]).forEach(x=>items.push({manual:true,id:x.id,creator:x.created_by,icon:x.tipo==='alerta'?'⚠️':x.tipo==='hito'?'◆':'◷',title:x.titulo,txt:`${x.descripcion||x.tipo||'Recordatorio'} · ${v95TextDate(x.fecha_evento)}`,date:x.fecha_evento,days:v95Days(x.fecha_evento),priority:x.prioridad||'normal',type:x.tipo||'recordatorio'}));
  }catch(e){console.warn('recordatorios',e)}
  items.sort((a,b)=>(a.days??99999)-(b.days??99999));
  box.innerHTML=items.slice(0,8).map(a=>{const cls=v95Class(a.days,a.priority),canDel=a.manual&&(isAdmin()||a.creator===state.session?.user?.id);return `<div class="home-alert-card gadget ${cls} ${a.manual?'manual-v95':''}">${canDel?`<button class="delete-alert-v95" title="Eliminar" onclick="deleteReminderV95('${a.id}')">×</button>`:''}<span class="gadget-icon">${a.icon}</span><div class="gadget-copy"><strong>${esc(a.title)}</strong><small>${esc(a.txt)}</small>${a.manual?`<span class="alert-type-v95">${esc(a.type)}</span>`:''}<div class="gadget-days ${cls}"><b>${a.days===0?'HOY':a.days==null?'—':a.days<0?`${Math.abs(a.days)} DÍAS`:`${a.days} DÍAS`}</b><span>${a.days<0?'VENCIDO':'RESTANTES'}</span></div></div></div>`}).join('')||'<div class="empty">Sin alertas próximas.</div>';
}
renderHomeAlertsV77=renderHomeAlertsV95;

function openReminderV95(){
  const today=new Date().toISOString().slice(0,10);
  document.querySelector('#modalRoot').innerHTML=`<div class="modal-bg"><div class="modal"><div class="row-between"><h3>Nuevo recordatorio / alerta</h3><button class="btn" onclick="closeModal()">Cerrar</button></div><form id="reminderFormV95" class="form-grid"><label class="full">Título<input class="field" name="titulo" required maxlength="120"></label><label class="full">Descripción<textarea class="field" name="descripcion" rows="3"></textarea></label><label>Fecha del evento<input class="field" name="fecha_evento" type="date" min="${today}" required></label><label>Tipo<select class="field" name="tipo"><option value="recordatorio">Recordatorio</option><option value="alerta">Alerta</option><option value="hito">Hito</option></select></label><label>Prioridad<select class="field" name="prioridad"><option value="normal">Normal</option><option value="importante">Importante</option><option value="critica">Crítica</option></select></label><label>Visibilidad<select class="field" name="visibilidad"><option value="todos">Todos los perfiles</option><option value="personal">Solo yo</option></select></label><div class="full"><button class="btn primary">Guardar recordatorio</button></div></form></div></div>`;
  document.querySelector('#reminderFormV95').onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));o.created_by=state.session.user.id;o.activo=true;const {error}=await sb.from('recordatorios_alertas').insert(o);if(error)return toast(error.message,'error');closeModal();toast('Recordatorio creado','success');renderHomeAlertsV95()};
}
async function deleteReminderV95(id){if(!confirm('¿Eliminar este recordatorio?'))return;const {error}=await sb.from('recordatorios_alertas').delete().eq('id',id);if(error)return toast(error.message,'error');renderHomeAlertsV95();}

function openReajusteV95(){if(!isAdmin())return;const next=new Date();next.setMonth(next.getMonth()+1);const d=next.toISOString().slice(0,10);document.querySelector('#modalRoot').innerHTML=`<div class="modal-bg"><div class="modal"><div class="row-between"><h3>Ingresar nuevo reajuste</h3><button class="btn" onclick="closeModal()">Cerrar</button></div><div class="notice">El dashboard no calcula ni propone porcentajes. Registra únicamente el valor oficialmente informado por Codelco.</div><form id="reajusteFormV95" class="form-grid"><label>Inicio de vigencia<input class="field" name="fecha_inicio" type="date" value="${d}" required></label><label>Porcentaje informado por Codelco<input class="field" name="porcentaje" type="number" step="0.0001" placeholder="6.3720" required></label><label class="full">Período / glosa<input class="field" name="periodo" placeholder="Ej.: Ene-Jun 2027"></label><label class="full">Observación<textarea class="field" name="observacion" rows="3"></textarea></label><div class="full"><button class="btn primary">Guardar reajuste</button></div></form></div></div>`;document.querySelector('#reajusteFormV95').onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));o.porcentaje=Number(o.porcentaje)||0;o.created_by=state.session.user.id;const {error}=await sb.from('reajustes_contrato').upsert(o,{onConflict:'fecha_inicio'});if(error)return toast(error.message,'error');closeModal();toast('Reajuste actualizado','success');renderHomeAlertsV95()};}

async function renderLiderazgoV95(){
  const page=document.querySelector('#page-liderazgo');if(!page)return;
  page.innerHTML=`<div class="topbar"><div><h2>Liderazgo en Terreno</h2><p>Controles preventivos realizados en terreno y seguimiento de cumplimiento por supervisor.</p></div><div class="actions">${isAdmin()?'<button class="btn" onclick="openLeadershipGoalV95()">⚑ Programar meta mensual</button>':''}<button class="btn primary" onclick="openTerrainControlV95()">+ Realizar control N.º 6</button></div></div><div id="leadershipSummaryV95"><div class="empty">Cargando cumplimiento…</div></div><div class="panel"><div class="row-between"><h3>Controles Stainher</h3><span class="muted">La primera prueba funcional corresponde al control N.º 6</span></div><div class="control-grid-v95">${V95_CONTROLS.map(c=>`<article class="control-card-v95 ${c.active?'active':''}"><div class="row-between"><div class="control-number-v95">${c.n}</div><span class="status ${c.active?'ok':'warn'}">${c.active?'Disponible':'Próximamente'}</span></div><h4>${esc(c.name)}</h4><p>${esc(c.desc||'Se incorporará cuando se cargue el formulario oficial.')}</p><div class="control-frequency">Frecuencia: ${esc(c.freq)}</div>${c.active?'<button class="btn primary" onclick="openTerrainControlV95()">Realizar ahora</button>':'<button class="btn" disabled>Formulario pendiente</button>'}</article>`).join('')}</div></div>`;
  await loadLeadershipSummaryV95();
}
async function loadLeadershipSummaryV95(){
  const now=new Date(),year=now.getFullYear(),month=now.getMonth()+1;let goals=[],done=[];
  try{const [g,c]=await Promise.all([sb.from('liderazgo_programacion').select('*').eq('anio',year).eq('mes',month),sb.from('liderazgo_cumplimiento').select('*').eq('anio',year).eq('mes',month)]);if(g.error)throw g.error;if(c.error)throw c.error;goals=g.data||[];done=c.data||[]}catch(e){const el=document.querySelector('#leadershipSummaryV95');if(el)el.innerHTML=`<div class="notice error">${esc(e.message||'No se pudo cargar cumplimiento. Ejecuta el PATCH V9.5 en Supabase.')}</div>`;return}
  const names=[...new Set([...goals.map(x=>x.supervisor_nombre),...done.map(x=>x.supervisor_nombre)].filter(Boolean))].sort();const programmed=goals.reduce((a,x)=>a+Number(x.meta||0),0),realized=done.length,pending=Math.max(0,programmed-realized),pct=programmed?Math.min(100,realized/programmed*100):0;
  const rows=names.map(n=>{const p=goals.filter(x=>x.supervisor_nombre===n).reduce((a,x)=>a+Number(x.meta||0),0),r=done.filter(x=>x.supervisor_nombre===n).length,pe=Math.max(0,p-r),pc=p?Math.min(100,r/p*100):0;return {n,p,r,pe,pc}});

const _loadSupervisorsV10=loadSupervisorsV95;
loadSupervisorsV95=async function(selectId){
  if(isSupervisorV10()){const el=document.querySelector('#'+selectId);if(!el)return;const n=state.profile?.nombre||'';el.innerHTML=`<option value="${esc(n)}" selected>${esc(n)}</option>`;el.disabled=true;return;}
  return _loadSupervisorsV10(selectId);
};

// Refuerzo: supervisor no puede registrar cumplimiento para otra persona.
const _generateTerrainPdfV10=generateTerrainPdfV95;
generateTerrainPdfV95=async function(e){
  if(isSupervisorV10()){const sel=document.querySelector('#terrainSupervisorV95');if(sel)sel.value=state.profile?.nombre||'';}
  return _generateTerrainPdfV10(e);
};

// Reaplicar visibilidad después de cada render global.
const _renderAllV10=renderAll;renderAll=function(){_renderAllV10();applyRoleVisibilityV10();setTimeout(cleanInicioV10,0)};
setTimeout(()=>{applyRoleVisibilityV10();cleanInicioV10();},0);
