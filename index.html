<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Stainher | Dashboard de Mantenimiento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="config.js"></script>
  <style>
    :root{--bg:#080b0f;--panel:#10151c;--panel2:#151b24;--line:#27303d;--text:#f3f5f7;--muted:#99a3b1;--accent:#ef5b2a;--green:#34d399;--yellow:#fbbf24;--red:#fb7185;--blue:#60a5fa}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 10% 0%,#161c25 0,#080b0f 32%);color:var(--text);font-family:Inter,Arial,sans-serif}
    button,input,select,textarea{font:inherit}.hidden{display:none!important}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{border-right:1px solid var(--line);padding:24px 18px;background:#0b0f14;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:12px;margin-bottom:30px}.brandmark{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,#ff6a33,#9e2a00);display:grid;place-items:center;font-weight:900}.brand h1{font-size:17px;margin:0}.brand small{color:var(--muted)}.nav{display:flex;flex-direction:column;gap:7px}.nav button{border:0;background:transparent;color:#c8d0db;text-align:left;padding:12px 14px;border-radius:10px;cursor:pointer}.nav button:hover,.nav button.active{background:var(--panel2);color:white}.nav .admin-only{border:1px solid transparent}.sidebar-bottom{position:absolute;bottom:20px;left:18px;right:18px}.userbox{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}.userbox strong{display:block}.userbox small{color:var(--muted)}.logout{width:100%;margin-top:10px;background:transparent;border:1px solid var(--line);color:white;padding:9px;border-radius:8px;cursor:pointer}.main{padding:28px 32px 60px;min-width:0}.topbar{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:25px}.topbar h2{margin:0;font-size:26px}.topbar p{color:var(--muted);margin:6px 0 0}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel2);color:white;padding:10px 14px;border-radius:9px;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);font-weight:700}.grid-kpi{display:grid;grid-template-columns:repeat(5,minmax(140px,1fr));gap:14px;margin-bottom:20px}.kpi{background:linear-gradient(180deg,#141a22,#0f141b);border:1px solid var(--line);border-radius:14px;padding:17px}.kpi span{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}.kpi strong{font-size:27px;display:block;margin-top:9px}.panel{background:rgba(16,21,28,.94);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px}.panel h3{margin:0 0 14px;font-size:16px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:15px}.field{background:#0c1117;border:1px solid var(--line);color:white;border-radius:9px;padding:10px 11px}.cards{display:grid;grid-template-columns:repeat(3,minmax(250px,1fr));gap:14px}.equipment-card{background:linear-gradient(180deg,#151b24,#0e1319);border:1px solid var(--line);border-radius:14px;padding:16px}.equipment-card .tag{display:inline-block;font-size:11px;padding:5px 8px;border-radius:99px;background:#202936;color:#dce3eb}.equipment-card h4{margin:12px 0 5px}.muted{color:var(--muted)}.row-between{display:flex;justify-content:space-between;align-items:center;gap:12px}.progress{height:7px;background:#222a35;border-radius:10px;overflow:hidden;margin:10px 0}.progress>i{display:block;height:100%;background:var(--green)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:11px;border-bottom:1px solid #202833;text-align:left;vertical-align:top}th{color:#aeb8c5;font-weight:600}.status{display:inline-block;padding:4px 8px;border-radius:99px;font-size:11px}.ok{background:rgba(52,211,153,.13);color:var(--green)}.bad{background:rgba(251,113,133,.13);color:var(--red)}.warn{background:rgba(251,191,36,.13);color:var(--yellow)}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px}.chart-wrap{height:310px}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.login{width:min(420px,100%);background:#10151c;border:1px solid var(--line);border-radius:18px;padding:28px}.login h1{margin:0 0 5px}.login p{color:var(--muted);margin-bottom:20px}.login input{width:100%;margin:7px 0 12px}.login .btn{width:100%;margin-top:6px}.notice{padding:12px;border:1px solid #3b4656;border-radius:10px;color:#cdd5df;background:#121922;margin:12px 0}.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:20px;z-index:20}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:#111820;border:1px solid var(--line);border-radius:16px;padding:20px}.modal h3{margin-top:0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid label{font-size:12px;color:#b6c0cc}.form-grid input,.form-grid select,.form-grid textarea{width:100%;margin-top:6px}.full{grid-column:1/-1}.empty{color:var(--muted);padding:30px;text-align:center}.error{color:#fda4af}.success{color:#6ee7b7}
    @media(max-width:1100px){.grid-kpi{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.two-col{grid-template-columns:1fr}}
    @media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{height:auto;position:relative}.sidebar-bottom{position:relative;left:auto;right:auto;bottom:auto;margin-top:20px}.main{padding:22px 16px}.grid-kpi{grid-template-columns:1fr 1fr}.cards{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}}
  </style>
</head>
<body>
<div id="loginView" class="login-wrap">
  <form id="loginForm" class="login">
    <div class="brand"><div class="brandmark">S</div><div><h1>STAINHER</h1><small>Mantenimiento · Codelco Andina</small></div></div>
    <h1>Iniciar sesión</h1><p>Acceso al dashboard de mantenimiento.</p>
    <input class="field" id="email" type="email" placeholder="Correo" required>
    <input class="field" id="password" type="password" placeholder="Contraseña" required>
    <button class="btn primary" type="submit">Ingresar</button>
    <div id="loginMsg" class="notice hidden"></div>
  </form>
</div>

<div id="appView" class="app hidden">
  <aside class="sidebar">
    <div class="brand"><div class="brandmark">S</div><div><h1>STAINHER</h1><small>Dashboard Mantenimiento</small></div></div>
    <nav class="nav">
      <button data-page="inicio" class="active">▦ Inicio</button>
      <button data-page="preventivo">✓ Preventivo</button>
      <button data-page="correctivo">⚙ Correctivo</button>
      <button data-page="equipos">▣ Equipos</button>
      <button data-page="usuarios" class="admin-only hidden">♙ Usuarios</button>
    </nav>
    <div class="sidebar-bottom"><div class="userbox"><strong id="userName">Usuario</strong><small id="userRole">rol</small><button id="logoutBtn" class="logout">Cerrar sesión</button></div></div>
  </aside>
  <main class="main">
    <section id="page-inicio" class="page"></section>
    <section id="page-preventivo" class="page hidden"></section>
    <section id="page-correctivo" class="page hidden"></section>
    <section id="page-equipos" class="page hidden"></section>
    <section id="page-usuarios" class="page hidden"></section>
  </main>
</div>
<div id="modalRoot"></div>
<script>
const CFG=window.STAINHER_CONFIG; const sb=supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
let state={session:null,profile:null,equipos:[],correctivo:[],correctivoMonth:new Date().getMonth()+1,correctivoYear:new Date().getFullYear(),charts:{}};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const fmtH=n=>Number.isFinite(n)?`${n.toFixed(1)} h`:'—';
function toast(msg,type=''){const el=document.createElement('div');el.className=`notice ${type}`;el.textContent=msg;$('#modalRoot').appendChild(el);setTimeout(()=>el.remove(),3500)}
function isAdmin(){return state.profile?.rol==='administrador'} function canPlan(){return ['administrador','planificador'].includes(state.profile?.rol)}
async function loadProfile(){const {data,error}=await sb.from('perfiles').select('*').eq('id',state.session.user.id).single();if(error)throw error;state.profile=data;$('#userName').textContent=data.nombre||state.session.user.email;$('#userRole').textContent=data.rol;$$('.admin-only').forEach(x=>x.classList.toggle('hidden',!isAdmin()));}
async function loadEquipos(){const {data,error}=await sb.from('equipos').select('*').order('nombre');if(error)throw error;state.equipos=data||[];}
function showApp(){ $('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');renderAll(); }
function showLogin(){ $('#appView').classList.add('hidden');$('#loginView').classList.remove('hidden'); }
async function init(){const {data:{session}}=await sb.auth.getSession();if(session){state.session=session;try{await loadProfile();await loadEquipos();showApp();}catch(e){console.error(e);showLogin();}}else showLogin();}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const m=$('#loginMsg');m.classList.add('hidden');const {data,error}=await sb.auth.signInWithPassword({email:$('#email').value,password:$('#password').value});if(error){m.textContent=error.message;m.classList.remove('hidden');return;}state.session=data.session;try{await loadProfile();await loadEquipos();showApp();}catch(err){m.textContent='Usuario autenticado, pero falta su perfil/rol.';m.classList.remove('hidden')}});
$('#logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};
$$('.nav button').forEach(b=>b.onclick=()=>{if(b.dataset.page==='usuarios'&&!isAdmin())return;$$('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$$('.page').forEach(x=>x.classList.add('hidden'));$(`#page-${b.dataset.page}`).classList.remove('hidden');if(b.dataset.page==='correctivo')loadCorrectivo();if(b.dataset.page==='preventivo')renderPreventivo();if(b.dataset.page==='usuarios')renderUsuarios();});
function renderAll(){renderInicio();renderEquipos();renderPreventivo();renderCorrectivoShell();renderUsuarios();}
function renderInicio(){const activos=state.equipos.filter(e=>e.estado==='activo').length;$('#page-inicio').innerHTML=`<div class="topbar"><div><h2>Panel de Mantenimiento</h2><p>Vista integrada de parque, preventivo y correctivo.</p></div><div class="actions">${isAdmin()?'<button class="btn primary" onclick="openUserModal()">+ Crear usuario</button>':''}</div></div><div class="grid-kpi"><div class="kpi"><span>Equipos</span><strong>${state.equipos.length}</strong></div><div class="kpi"><span>Activos</span><strong>${activos}</strong></div><div class="kpi"><span>Correctivos mes</span><strong id="homeCorr">—</strong></div><div class="kpi"><span>Horas correctivo</span><strong id="homeHours">—</strong></div><div class="kpi"><span>Cierre operativo</span><strong id="homeOp">—</strong></div></div><div class="panel"><div class="row-between"><h3>Parque de equipos</h3><button class="btn" onclick="gotoPage('equipos')">Ver todos</button></div><div class="cards">${state.equipos.map(cardEquipo).join('')||'<div class="empty">Aún no hay equipos cargados.</div>'}</div></div>`;loadCorrectivo(true);}
function cardEquipo(e){return `<article class="equipment-card"><div class="row-between"><span class="tag">${e.tipo||'Equipo'}</span><span class="status ${e.estado==='activo'?'ok':'warn'}">${e.estado||'activo'}</span></div><h4>${e.nombre}</h4><div class="muted">${e.ubicacion||'Ubicación no informada'}</div><div class="progress"><i style="width:${e.estado==='activo'?100:30}%"></i></div><div class="row-between"><small class="muted">${e.fabricante||'Fabricante s/i'} ${e.modelo?`· ${e.modelo}`:''}</small><button class="btn" onclick="openEquipoModal('${e.id}')">Detalle</button></div></article>`}
function gotoPage(p){document.querySelector(`[data-page="${p}"]`).click()}
function renderEquipos(){const btn=canPlan()?'<button class="btn primary" onclick="openEquipoModal()">+ Nuevo equipo</button>':'';$('#page-equipos').innerHTML=`<div class="topbar"><div><h2>Equipos</h2><p>Maestro técnico editable del parque.</p></div>${btn}</div><div class="cards">${state.equipos.map(cardEquipo).join('')||'<div class="empty">Sin equipos cargados.</div>'}</div>`}
function openEquipoModal(id=''){if(!canPlan()&&id==='')return;const e=state.equipos.find(x=>x.id===id)||{};const editable=canPlan();$('#modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="row-between"><h3>${id?'Ficha del equipo':'Nuevo equipo'}</h3><button class="btn" onclick="closeModal()">Cerrar</button></div><form id="equipoForm" class="form-grid"><label>Nombre<input class="field" name="nombre" value="${e.nombre||''}" ${editable?'':'disabled'} required></label><label>Nombre alternativo<input class="field" name="nombre_alternativo" value="${e.nombre_alternativo||''}" ${editable?'':'disabled'}></label><label>Tipo<input class="field" name="tipo" value="${e.tipo||''}" ${editable?'':'disabled'}></label><label>Ubicación<input class="field" name="ubicacion" value="${e.ubicacion||''}" ${editable?'':'disabled'}></label><label>Fabricante<input class="field" name="fabricante" value="${e.fabricante||''}" ${editable?'':'disabled'}></label><label>Modelo<input class="field" name="modelo" value="${e.modelo||''}" ${editable?'':'disabled'}></label><label>Capacidad carga<input class="field" name="capacidad_carga" value="${e.capacidad_carga||''}" ${editable?'':'disabled'}></label><label>Pasajeros<input class="field" name="pasajeros" type="number" value="${e.pasajeros??''}" ${editable?'':'disabled'}></label><label>Velocidad<input class="field" name="velocidad" value="${e.velocidad||''}" ${editable?'':'disabled'}></label><label>Paradas<input class="field" name="paradas" type="number" value="${e.paradas??''}" ${editable?'':'disabled'}></label><label>Criticidad<select class="field" name="criticidad" ${editable?'':'disabled'}><option ${e.criticidad==='Alta'?'selected':''}>Alta</option><option ${e.criticidad==='Media'?'selected':''}>Media</option><option ${e.criticidad==='Baja'?'selected':''}>Baja</option></select></label><label>Estado<select class="field" name="estado" ${editable?'':'disabled'}><option value="activo" ${e.estado!=='retirado'?'selected':''}>activo</option><option value="retirado" ${e.estado==='retirado'?'selected':''}>retirado</option></select></label><label class="full">Observaciones<textarea class="field" name="observaciones" rows="4" ${editable?'':'disabled'}>${e.observaciones||''}</textarea></label>${editable?'<div class="full"><button class="btn primary" type="submit">Guardar</button></div>':''}</form></div></div>`;if(editable)$('#equipoForm').onsubmit=async ev=>{ev.preventDefault();const obj=Object.fromEntries(new FormData(ev.target));obj.pasajeros=obj.pasajeros?Number(obj.pasajeros):null;obj.paradas=obj.paradas?Number(obj.paradas):null;let q=id?sb.from('equipos').update(obj).eq('id',id):sb.from('equipos').insert(obj);const {error}=await q;if(error)return toast(error.message,'error');await loadEquipos();closeModal();renderAll();toast('Equipo guardado','success')};}
function closeModal(){ $('#modalRoot').innerHTML=''; }
function renderPreventivo(){const y=new Date().getFullYear();$('#page-preventivo').innerHTML=`<div class="topbar"><div><h2>Mantenimiento Preventivo</h2><p>Plan anual y cumplimiento mensual.</p></div>${canPlan()?'<button class="btn primary" onclick="openPlanModal()">+ Programar actividad</button>':''}</div><div class="panel"><div class="toolbar"><select id="prevYear" class="field"><option>${y}</option><option>${y+1}</option></select><select id="prevMonth" class="field">${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${i===new Date().getMonth()?'selected':''}>${new Date(2000,i).toLocaleString('es',{month:'long'})}</option>`).join('')}</select><button class="btn" onclick="loadPreventivos()">Consultar</button></div><div id="prevContent" class="empty">Selecciona período y pulsa Consultar.</div></div>`;loadPreventivos();}
async function loadPreventivos(){const y=Number($('#prevYear')?.value||new Date().getFullYear()),m=Number($('#prevMonth')?.value||new Date().getMonth()+1);const {data,error}=await sb.from('programacion_preventiva').select('*,equipos(nombre)').eq('anio',y).eq('mes',m).order('fecha_programada');if(error){if($('#prevContent'))$('#prevContent').innerHTML=`<span class="error">${error.message}</span>`;return;}const rows=data||[];if($('#prevContent'))$('#prevContent').innerHTML=rows.length?`<table><thead><tr><th>Equipo</th><th>Actividad</th><th>Fecha programada</th><th>Estado</th><th>Fecha ejecución</th><th>Observación</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.equipos?.nombre||''}</td><td>${r.actividad}</td><td>${r.fecha_programada||'—'}</td><td><span class="status ${r.estado==='ejecutado'?'ok':r.estado==='pendiente'?'bad':'warn'}">${r.estado}</span></td><td>${r.fecha_ejecucion||'—'}</td><td>${r.observacion||''}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No hay actividades programadas en este período.</div>';}
function openPlanModal(){if(!canPlan())return;const d=new Date();$('#modalRoot').innerHTML=`<div class="modal-bg"><div class="modal"><div class="row-between"><h3>Programar preventivo</h3><button class="btn" onclick="closeModal()">Cerrar</button></div><form id="planForm" class="form-grid"><label>Equipo<select class="field" name="equipo_id">${state.equipos.filter(e=>e.estado==='activo').map(e=>`<option value="${e.id}">${e.nombre}</option>`).join('')}</select></label><label>Año<input class="field" name="anio" type="number" value="${d.getFullYear()}"></label><label>Mes<input class="field" name="mes" type="number" min="1" max="12" value="${d.getMonth()+1}"></label><label>Fecha programada<input class="field" name="fecha_programada" type="date"></label><label class="full">Actividad<input class="field" name="actividad" required></label><label>Frecuencia<input class="field" name="frecuencia" placeholder="Mensual, trimestral..."></label><label>Estado<select class="field" name="estado"><option>programado</option><option>pendiente</option><option>ejecutado</option></select></label><div class="full"><button class="btn primary">Guardar</button></div></form></div></div>`;$('#planForm').onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));o.anio=Number(o.anio);o.mes=Number(o.mes);const {error}=await sb.from('programacion_preventiva').insert(o);if(error)return toast(error.message,'error');closeModal();loadPreventivos();toast('Actividad programada','success')};}
function renderCorrectivoShell(){
  const months=Array.from({length:12},(_,i)=>`<option value="${i+1}" ${state.correctivoMonth===i+1?'selected':''}>${new Date(2000,i).toLocaleString('es',{month:'long'})}</option>`).join('');
  $('#page-correctivo').innerHTML=`<div class="topbar"><div><h2>Mantenimiento Correctivo</h2><p>Base de averías cargada manualmente a Supabase.</p></div><div class="actions">${canPlan()?'<button class="btn primary" onclick="openImportAveriasModal()">↑ Importar Excel / CSV</button>':''}</div></div><div class="toolbar"><input id="corrYear" class="field" type="number" value="${state.correctivoYear}"><select id="corrMonth" class="field">${months}</select><select id="corrEquipo" class="field"><option value="">Todos los equipos</option>${state.equipos.map(e=>`<option>${e.nombre}</option>`).join('')}</select><button class="btn primary" onclick="loadCorrectivo()">Actualizar</button></div><div id="corrBody"><div class="empty">Cargando…</div></div>`
}
async function loadCorrectivo(home=false){
  if(!home){state.correctivoYear=Number($('#corrYear').value);state.correctivoMonth=Number($('#corrMonth').value);}
  const startDate=`${state.correctivoYear}-${String(state.correctivoMonth).padStart(2,'0')}-01`;
  const lastDay=new Date(state.correctivoYear,state.correctivoMonth,0).getDate();
  const endDate=`${state.correctivoYear}-${String(state.correctivoMonth).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
  const {data,error}=await sb.from('averias').select('id,equipo_id,equipo_original,numero_guia,supervisor_tecnico,fecha_inicio,hora_inicio,fecha_termino,hora_termino,estado_final,observaciones,duracion_minutos,equipos(nombre,nombre_alternativo)').gte('fecha_inicio',startDate).lte('fecha_inicio',endDate).order('fecha_inicio',{ascending:false});
  if(error){if(home)return;$('#corrBody').innerHTML=`<div class="notice error">${error.message}</div>`;return;}
  state.correctivo=(data||[]).map(r=>({
    ...r,
    equipo:r.equipos?.nombre||normalizarEquipo(r.equipo_original)||r.equipo_original||'Sin equipo',
    guia:r.numero_guia,
    responsable:r.supervisor_tecnico,
    duracion_horas:(r.duracion_minutos||0)/60,
    estado_normalizado:normalizarEstado(r.estado_final)
  }));
  const kpis=calcCorrectivoKpis(state.correctivo);
  if(home){updateHomeCorr(kpis);return;}
  renderCorrectivo({rows:state.correctivo,kpis});
}
function calcCorrectivoKpis(rows){
  const hours=rows.reduce((a,r)=>a+(r.duracion_horas||0),0);
  const op=rows.length?rows.filter(r=>r.estado_normalizado==='Operativo').length/rows.length*100:0;
  return {atenciones:rows.length,horas:hours,cierre_operativo:op};
}
function updateHomeCorr(k){if($('#homeCorr'))$('#homeCorr').textContent=k?.atenciones??0;if($('#homeHours'))$('#homeHours').textContent=fmtH(k?.horas||0);if($('#homeOp'))$('#homeOp').textContent=`${Number(k?.cierre_operativo||0).toFixed(0)}%`;}
function normalizarEstado(v=''){const x=String(v||'').toLowerCase();if(x.includes('detenido'))return 'Detenido';if(x.includes('operativo'))return 'Operativo';return v||'Sin estado'}
function normalizarEquipo(v=''){
  const x=String(v||'').trim().toUpperCase();
  if(x.includes('EILA 1')) return 'EILA 1';
  if(x.includes('EILA 2')) return 'EILA 2';
  if(x.includes('JAULA OTIS')) return 'JAULA OTIS';
  if(x.includes('NODO 3700')) return 'NODO 3700';
  if(x.includes('HUINCHE PTP')||x.includes('TERCER PANEL')) return 'HUINCHE PTP';
  if(x.includes('JAULA ASEA')||x.includes('ELEVADOR: JAULA ASEA')) return 'JAULA ASEA';
  if(x.includes('ALIMAK')||x.includes('TRASPASO DOMO')) return 'JAULA ALIMAK';
  if(x.includes('HILTON 02')||x.includes('ALIMENTACIÓN')||x.includes('ALIMENTACION')) return 'HILTON 02';
  if(x.includes('HILTON 03')||x.includes('MULTISERVICIO')) return 'HILTON 03';
  return String(v||'').trim();
}
function esRegistroNoCorrectivo(row){
  const guia=String(row['Número de guía de trabajo']??row['Numero de guia de trabajo']??'').toLowerCase();
  const obs=String(row['Observaciones']??'').toLowerCase();
  const t=`${guia} ${obs}`;
  const patrones=['preventivo','pauta eléctrico','pauta electrico','eléctrica quincenal','electrica quincenal','mecánica mensual','mecanica mensual','inspección mensual','inspeccion mensual','inspección jaula','inspeccion jaula','visita de inspección','visita de inspeccion','levantamiento fotograf','charla instructiva','apoyo para traslado','apoyo de conexión','apoyo de conexion','se presta apoyo','certificación','certificacion','pintado de piso'];
  return patrones.some(k=>t.includes(k));
}
function parseFechaExcel(v){
  if(v===null||v===undefined||v==='')return null;
  if(v instanceof Date&&!isNaN(v))return v.toISOString().slice(0,10);
  if(typeof v==='number'){
    const d=XLSX.SSF.parse_date_code(v); if(d)return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;
  }
  let x=String(v).trim();
  let m=x.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/);if(m)return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m=x.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})$/);if(m)return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  const d=new Date(x);return isNaN(d)?null:d.toISOString().slice(0,10);
}
function parseHora(v){
  if(v===null||v===undefined||v==='')return null;
  if(typeof v==='number'&&v>=0&&v<1){const min=Math.round(v*24*60)%1440;return `${String(Math.floor(min/60)).padStart(2,'0')}:${String(min%60).padStart(2,'0')}`;}
  let x=String(v).trim().toUpperCase().replace(/HRS?|HORAS?/g,'').replace(/\s+/g,' ');
  x=x.replace(/\b(AM|PM)\b/g,' $1').replace(/\s+/g,' ').trim();
  let m=x.match(/^(\d{1,2})(?::(\d{1,3}))?\s*(AM|PM)?$/);if(!m)return null;
  let h=Number(m[1]),mi=Number((m[2]||'0').slice(0,2));if(mi>59)mi=0;
  const ap=m[3];if(ap==='PM'&&h<12)h+=12;if(ap==='AM'&&h===12)h=0;if(h>23)return null;
  return `${String(h).padStart(2,'0')}:${String(mi).padStart(2,'0')}`;
}
function calcDuracionMin(fi,hi,ft,ht){if(!fi||!hi||!ft||!ht)return null;const a=new Date(`${fi}T${hi}:00`),b=new Date(`${ft}T${ht}:00`);const n=Math.round((b-a)/60000);return Number.isFinite(n)&&n>=0?n:null}
function makeClave(r){return [r.equipo_original,r.numero_guia,r.fecha_inicio,r.hora_inicio,r.fecha_termino,r.hora_termino].map(x=>String(x??'').trim().toLowerCase()).join('|')}
function mapAveriaRow(raw){
  const equipoOriginal=raw['Equipo']??'';
  const equipoNorm=normalizarEquipo(equipoOriginal);
  const eq=state.equipos.find(e=>e.nombre.toUpperCase()===equipoNorm.toUpperCase());
  const fi=parseFechaExcel(raw['Fecha inicio trabajo']); const hi=parseHora(raw['Hora inicio trabajo']); const ft=parseFechaExcel(raw['Fecha término de trabajo']??raw['Fecha termino de trabajo']); const ht=parseHora(raw['Hora término de trabajo']??raw['Hora termino de trabajo']);
  const r={equipo_id:eq?.id||null,equipo_original:String(equipoOriginal||equipoNorm||''),numero_guia:String(raw['Número de guía de trabajo']??raw['Numero de guia de trabajo']??'').replace(/\.0$/,''),supervisor_tecnico:String(raw['Nombre Supervisor/Técnico']??raw['Nombre Supervisor/Tecnico']??''),fecha_inicio:fi,hora_inicio:hi,fecha_termino:ft,hora_termino:ht,estado_final:String(raw['Estado final del equipo']??''),observaciones:String(raw['Observaciones']??''),duracion_minutos:calcDuracionMin(fi,hi,ft,ht),created_by:state.session.user.id};
  r.clave_unica=makeClave(r);r._equipoNorm=equipoNorm;r._valido=!!(r.equipo_original&&fi&&hi&&ft&&ht);return r;
}
async function openImportAveriasModal(){
  if(!canPlan())return;
  $('#modalRoot').innerHTML=`<div class="modal-bg"><div class="modal" style="width:min(920px,100%)"><div class="row-between"><h3>Importar base de averías</h3><button class="btn" onclick="closeModal()">Cerrar</button></div><div class="notice">Carga el Excel o CSV exportado desde tu bitácora. El sistema normaliza equipos, excluye registros claramente preventivos y evita duplicados.</div><input id="averiasFile" class="field" type="file" accept=".xlsx,.xls,.csv" style="width:100%"><div id="importPreview" style="margin-top:14px"><div class="empty">Selecciona un archivo para revisar antes de importar.</div></div></div></div>`;
  $('#averiasFile').onchange=previewAveriasFile;
}
async function previewAveriasFile(ev){
  const file=ev.target.files?.[0];if(!file)return;
  const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:'array',cellDates:true});const ws=wb.Sheets[wb.SheetNames[0]];const raw=XLSX.utils.sheet_to_json(ws,{defval:'',raw:true});
  const excluded=raw.filter(esRegistroNoCorrectivo);const candidate=raw.filter(r=>!esRegistroNoCorrectivo(r)).map(mapAveriaRow);const invalid=candidate.filter(r=>!r._valido);const valid=candidate.filter(r=>r._valido);
  const keys=[...new Set(valid.map(r=>r.clave_unica))];const existing=new Set();for(let i=0;i<keys.length;i+=80){const {data}=await sb.from('averias').select('clave_unica').in('clave_unica',keys.slice(i,i+80));(data||[]).forEach(x=>existing.add(x.clave_unica));}
  const uniqueInFile=new Set();const nuevos=[];let dup=0;valid.forEach(r=>{if(existing.has(r.clave_unica)||uniqueInFile.has(r.clave_unica)){dup++;return;}uniqueInFile.add(r.clave_unica);nuevos.push(r)});
  state.importDraft={fileName:file.name,total:raw.length,excluded:excluded.length,invalid:invalid.length,duplicates:dup,rows:nuevos};
  const sample=nuevos.slice(0,10);
  $('#importPreview').innerHTML=`<div class="grid-kpi" style="grid-template-columns:repeat(5,1fr)"><div class="kpi"><span>Leídos</span><strong>${raw.length}</strong></div><div class="kpi"><span>Nuevos</span><strong>${nuevos.length}</strong></div><div class="kpi"><span>Duplicados</span><strong>${dup}</strong></div><div class="kpi"><span>Excluidos</span><strong>${excluded.length}</strong></div><div class="kpi"><span>Con error</span><strong>${invalid.length}</strong></div></div><div class="panel"><h3>Vista previa de registros nuevos</h3><div style="overflow:auto"><table><thead><tr><th>Fecha</th><th>Equipo</th><th>Guía</th><th>Responsable</th><th>Duración</th><th>Estado</th></tr></thead><tbody>${sample.map(r=>`<tr><td>${r.fecha_inicio}</td><td>${r._equipoNorm}</td><td>${r.numero_guia||'—'}</td><td>${r.supervisor_tecnico||'—'}</td><td>${r.duracion_minutos==null?'—':fmtH(r.duracion_minutos/60)}</td><td>${normalizarEstado(r.estado_final)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No hay registros nuevos para importar.</td></tr>'}</tbody></table></div></div><button class="btn primary" ${nuevos.length?'':'disabled'} onclick="confirmImportAverias()">Importar ${nuevos.length} registros</button>`;
}
async function confirmImportAverias(){
  const d=state.importDraft;if(!d?.rows?.length)return;
  const {data:imp,error:impErr}=await sb.from('importaciones_averias').insert({nombre_archivo:d.fileName,total_registros:d.total,registros_nuevos:d.rows.length,registros_duplicados:d.duplicates,registros_error:d.invalid,usuario_id:state.session.user.id}).select('id').single();
  if(impErr)return toast(impErr.message,'error');
  const clean=d.rows.map(({_equipoNorm,_valido,...r})=>({...r,importacion_id:imp.id}));
  let inserted=0;for(let i=0;i<clean.length;i+=100){const {data,error}=await sb.from('averias').upsert(clean.slice(i,i+100),{onConflict:'clave_unica',ignoreDuplicates:true}).select('id');if(error)return toast(`Importación parcial: ${error.message}`,'error');inserted+=(data||[]).length;}
  closeModal();toast(`${inserted} averías importadas`,'success');renderCorrectivoShell();loadCorrectivo();renderInicio();
}
function renderCorrectivo(j){let rows=j.rows||[];const eq=$('#corrEquipo')?.value;if(eq)rows=rows.filter(r=>r.equipo===eq);let hours=rows.reduce((a,r)=>a+(r.duracion_horas||0),0),op=rows.length?rows.filter(r=>r.estado_normalizado==='Operativo').length/rows.length*100:0;const by={};rows.forEach(r=>by[r.equipo]=(by[r.equipo]||0)+1);const top=Object.entries(by).sort((a,b)=>b[1]-a[1])[0]?.[0]||'—';$('#corrBody').innerHTML=`<div class="grid-kpi"><div class="kpi"><span>Atenciones</span><strong>${rows.length}</strong></div><div class="kpi"><span>Horas atención</span><strong>${fmtH(hours)}</strong></div><div class="kpi"><span>Duración promedio</span><strong>${fmtH(rows.length?hours/rows.length:0)}</strong></div><div class="kpi"><span>Cierre operativo</span><strong>${op.toFixed(0)}%</strong></div><div class="kpi"><span>Más intervenido</span><strong style="font-size:17px">${top}</strong></div></div><div class="two-col"><div class="panel"><h3>Atenciones por equipo</h3><div class="chart-wrap"><canvas id="chartEq"></canvas></div></div><div class="panel"><h3>Horas de intervención por equipo</h3><div class="chart-wrap"><canvas id="chartHours"></canvas></div></div></div><div class="panel"><h3>Historial del período</h3><div style="overflow:auto"><table><thead><tr><th>Fecha</th><th>Equipo</th><th>Guía</th><th>Responsable</th><th>Duración</th><th>Estado final</th><th>Observación</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.fecha_inicio||''}</td><td>${r.equipo}</td><td>${r.guia||'—'}</td><td>${r.responsable||'—'}</td><td>${fmtH(r.duracion_horas)}</td><td><span class="status ${r.estado_normalizado==='Operativo'?'ok':'bad'}">${r.estado_normalizado}</span></td><td>${r.observaciones||''}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">Sin atenciones para el período seleccionado.</td></tr>'}</tbody></table></div></div>`;Object.values(state.charts).forEach(c=>c?.destroy?.());const labels=Object.keys(by),vals=Object.values(by),hourBy={};rows.forEach(r=>hourBy[r.equipo]=(hourBy[r.equipo]||0)+(r.duracion_horas||0));state.charts.a=new Chart($('#chartEq'),{type:'bar',data:{labels,datasets:[{label:'Atenciones',data:vals}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#aeb8c5'}},y:{ticks:{color:'#aeb8c5'},beginAtZero:true}}}});state.charts.b=new Chart($('#chartHours'),{type:'bar',data:{labels:Object.keys(hourBy),datasets:[{label:'Horas',data:Object.values(hourBy)}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#aeb8c5'}},y:{ticks:{color:'#aeb8c5'},beginAtZero:true}}}});}
function renderUsuarios(){if(!isAdmin()){ $('#page-usuarios').innerHTML='';return;}$('#page-usuarios').innerHTML=`<div class="topbar"><div><h2>Usuarios</h2><p>Gestión de accesos y roles.</p></div><button class="btn primary" onclick="openUserModal()">+ Crear usuario</button></div><div class="panel" id="usersTable"><div class="empty">Cargando…</div></div>`;loadUsers();}
async function loadUsers(){if(!isAdmin())return;const {data,error}=await sb.from('perfiles').select('id,nombre,email,rol,activo,created_at').order('nombre');if(error)return $('#usersTable').innerHTML=`<span class="error">${error.message}</span>`;$('#usersTable').innerHTML=`<table><thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th></tr></thead><tbody>${data.map(u=>`<tr><td>${u.nombre||''}</td><td>${u.email||''}</td><td>${u.rol}</td><td><span class="status ${u.activo?'ok':'bad'}">${u.activo?'Activo':'Inactivo'}</span></td></tr>`).join('')}</tbody></table>`}
function openUserModal(){if(!isAdmin())return;$('#modalRoot').innerHTML=`<div class="modal-bg"><div class="modal"><div class="row-between"><h3>Crear usuario</h3><button class="btn" onclick="closeModal()">Cerrar</button></div><form id="userForm" class="form-grid"><label>Nombre<input class="field" name="nombre" required></label><label>Correo<input class="field" name="email" type="email" required></label><label>Rol<select class="field" name="rol"><option>administrador</option><option>planificador</option><option>supervisor</option><option>tecnico</option><option>consulta</option></select></label><label>Contraseña temporal<input class="field" name="password" type="password" minlength="8" required></label><div class="full notice">La contraseña se envía únicamente a Supabase Auth y no se guarda en la tabla de perfiles.</div><div class="full"><button class="btn primary">Crear usuario</button></div></form></div></div>`;$('#userForm').onsubmit=async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(e.target));const res=await fetch(`${CFG.SUPABASE_URL}/functions/v1/create-user`,{method:'POST',headers:{Authorization:`Bearer ${state.session.access_token}`,apikey:CFG.SUPABASE_ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await res.json();if(!res.ok)return toast(j.error||'Error creando usuario','error');closeModal();loadUsers();toast('Usuario creado','success')};}
init();
</script>
