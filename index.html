<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Stainher | Dashboard de Mantenimiento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
  <script src="config.js"></script>
  <style>
    :root{--bg:#080b0f;--panel:#10151c;--panel2:#151b24;--line:#27303d;--text:#f3f5f7;--muted:#99a3b1;--accent:#ef5b2a;--green:#34d399;--yellow:#fbbf24;--red:#fb7185;--blue:#60a5fa}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 10% 0%,#161c25 0,#080b0f 32%);color:var(--text);font-family:Inter,Arial,sans-serif}
    button,input,select,textarea{font:inherit}.hidden{display:none!important}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{border-right:1px solid var(--line);padding:24px 18px;background:#0b0f14;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:12px;margin-bottom:30px}.brandmark{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,#ff6a33,#9e2a00);display:grid;place-items:center;font-weight:900}.brand h1{font-size:17px;margin:0}.brand small{color:var(--muted)}.nav{display:flex;flex-direction:column;gap:7px}.nav button{border:0;background:transparent;color:#c8d0db;text-align:left;padding:12px 14px;border-radius:10px;cursor:pointer}.nav button:hover,.nav button.active{background:var(--panel2);color:white}.nav .admin-only{border:1px solid transparent}.sidebar-bottom{position:absolute;bottom:20px;left:18px;right:18px}.userbox{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}.userbox strong{display:block}.userbox small{color:var(--muted)}.logout{width:100%;margin-top:10px;background:transparent;border:1px solid var(--line);color:white;padding:9px;border-radius:8px;cursor:pointer}.main{padding:28px 32px 60px;min-width:0}.topbar{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:25px}.topbar h2{margin:0;font-size:26px}.topbar p{color:var(--muted);margin:6px 0 0}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel2);color:white;padding:10px 14px;border-radius:9px;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);font-weight:700}.grid-kpi{display:grid;grid-template-columns:repeat(5,minmax(140px,1fr));gap:14px;margin-bottom:20px}.kpi{background:linear-gradient(180deg,#141a22,#0f141b);border:1px solid var(--line);border-radius:14px;padding:17px}.kpi span{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}.kpi strong{font-size:27px;display:block;margin-top:9px}.panel{background:rgba(16,21,28,.94);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px}.panel h3{margin:0 0 14px;font-size:16px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:15px}.field{background:#0c1117;border:1px solid var(--line);color:white;border-radius:9px;padding:10px 11px}.cards{display:grid;grid-template-columns:repeat(3,minmax(250px,1fr));gap:14px}.equipment-card{background:linear-gradient(180deg,#151b24,#0e1319);border:1px solid var(--line);border-radius:14px;padding:16px}.equipment-card .tag{display:inline-block;font-size:11px;padding:5px 8px;border-radius:99px;background:#202936;color:#dce3eb}.equipment-card h4{margin:12px 0 5px}.muted{color:var(--muted)}.row-between{display:flex;justify-content:space-between;align-items:center;gap:12px}.progress{height:7px;background:#222a35;border-radius:10px;overflow:hidden;margin:10px 0}.progress>i{display:block;height:100%;background:var(--green)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:11px;border-bottom:1px solid #202833;text-align:left;vertical-align:top}th{color:#aeb8c5;font-weight:600}.status{display:inline-block;padding:4px 8px;border-radius:99px;font-size:11px}.ok{background:rgba(52,211,153,.13);color:var(--green)}.bad{background:rgba(251,113,133,.13);color:var(--red)}.warn{background:rgba(251,191,36,.13);color:var(--yellow)}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px}.chart-wrap{height:310px}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.login{width:min(420px,100%);background:#10151c;border:1px solid var(--line);border-radius:18px;padding:28px}.login h1{margin:0 0 5px}.login p{color:var(--muted);margin-bottom:20px}.login input{width:100%;margin:7px 0 12px}.login .btn{width:100%;margin-top:6px}.notice{padding:12px;border:1px solid #3b4656;border-radius:10px;color:#cdd5df;background:#121922;margin:12px 0}.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:20px;z-index:20}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:#111820;border:1px solid var(--line);border-radius:16px;padding:20px}.modal h3{margin-top:0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid label{font-size:12px;color:#b6c0cc}.form-grid input,.form-grid select,.form-grid textarea{width:100%;margin-top:6px}.full{grid-column:1/-1}.empty{color:var(--muted);padding:30px;text-align:center}.error{color:#fda4af}.success{color:#6ee7b7}.kpi small{display:block;margin-top:6px;color:var(--muted);font-size:11px}.kpi.pending strong{color:#cbd5e1}.obs-cell{max-width:520px}.obs-preview{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.45}.link-btn{background:transparent;border:0;color:#93c5fd;padding:4px 0;cursor:pointer;font-weight:600}.trend-panel{margin-top:0}
    .storage-grid{display:grid;grid-template-columns:repeat(2,minmax(260px,1fr));gap:18px;margin-bottom:18px}.storage-card{background:linear-gradient(180deg,#141a22,#0f141b);border:1px solid var(--line);border-radius:14px;padding:18px}.storage-card h3{margin:0 0 4px}.storage-meta{color:var(--muted);font-size:12px}.storage-value{font-size:30px;font-weight:800;margin:14px 0 4px}.storage-bar{height:12px;background:#222a35;border-radius:99px;overflow:hidden;margin:12px 0}.storage-bar>i{display:block;height:100%;background:var(--green);width:0;transition:width .25s ease}.storage-bar.warn>i{background:var(--yellow)}.storage-bar.bad>i{background:var(--red)}.system-list{display:grid;grid-template-columns:repeat(3,minmax(160px,1fr));gap:12px}.system-stat{padding:14px;border:1px solid var(--line);border-radius:12px;background:#0e141b}.system-stat span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase}.system-stat strong{display:block;font-size:22px;margin-top:6px}@media(max-width:760px){.storage-grid,.system-list{grid-template-columns:1fr}}
    @media(max-width:1100px){.grid-kpi{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.two-col{grid-template-columns:1fr}}
    @media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{height:auto;position:relative}.sidebar-bottom{position:relative;left:auto;right:auto;bottom:auto;margin-top:20px}.main{padding:22px 16px}.grid-kpi{grid-template-columns:1fr 1fr}.cards{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}}
  
.kpi-help{margin-top:10px;border-top:1px solid var(--border);padding-top:8px;font-size:12px;color:var(--muted)}
.kpi-help summary{cursor:pointer;color:#9fc7ee;font-weight:600;list-style:none;display:flex;align-items:center;gap:6px}
.kpi-help summary::-webkit-details-marker{display:none}
.kpi-help summary::before{content:"▸";font-size:11px;transition:transform .15s ease}
.kpi-help[open] summary::before{transform:rotate(90deg)}
.kpi-help div{margin-top:8px;line-height:1.45;color:#b8c2cf}

    .prev-equipment-grid{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:12px;margin-bottom:18px}.prev-equipment-card{background:linear-gradient(180deg,#141a22,#0f141b);border:1px solid var(--line);border-radius:13px;padding:15px;cursor:pointer;transition:.15s ease}.prev-equipment-card:hover{border-color:#3f526a}.prev-equipment-card.selected{border-color:var(--blue);box-shadow:inset 0 0 0 1px rgba(96,165,250,.22)}.prev-equipment-card h4{margin:0 0 5px}.prev-equipment-card .pct{font-size:25px;font-weight:800;margin:10px 0 3px}.prev-mini{display:grid;grid-template-columns:1fr auto;gap:5px;font-size:12px;color:var(--muted)}.prev-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}.prev-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.prev-detail-head{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:12px}.inline-field{width:100%;min-width:120px;background:#0b1118;border:1px solid #2a3544;color:#e8edf3;border-radius:7px;padding:7px 8px}.inline-status{min-width:120px}.saving{opacity:.55;pointer-events:none}.prev-compliance{display:inline-block;padding:4px 8px;border-radius:99px;background:rgba(52,211,153,.12);color:var(--green);font-weight:700;font-size:11px}.prev-compliance.zero{background:#202733;color:#aeb8c5}.report-note{font-size:12px;color:var(--muted);margin-top:8px}.report-title{font-weight:700}.kpi .accent-green{color:var(--green)}.kpi .accent-yellow{color:var(--yellow)}.kpi .accent-red{color:var(--red)}
    @media(max-width:1350px){.prev-equipment-grid{grid-template-columns:repeat(3,minmax(190px,1fr))}}
    @media(max-width:900px){.prev-equipment-grid{grid-template-columns:repeat(2,minmax(180px,1fr))}}
    @media(max-width:600px){.prev-equipment-grid{grid-template-columns:1fr}.prev-detail-head{align-items:flex-start;flex-direction:column}}

</style>
</head>
<body>
<div id="loginView" class="login-wrap">
  <form id="loginForm" class="login">
    <div class="brand"><div class="brandmark">S</div><div><h1>STAINHER</h1><small>Mantenimiento · Codelco Andina</small></div></div>
    <h1>Iniciar sesión</h1><p>Acceso al dashboard de mantenimiento.</p>
    <input class="field" id="email" type="email" placeholder="Correo" required>
    <input class="field" id="password" type="password" placeholder="Contraseña" required>
    <button class="btn primary" type="submit">Ingresar</button>
    <div id="loginMsg" class="notice hidden"></div>
  </form>
</div>

<div id="appView" class="app hidden">
  <aside class="sidebar">
    <div class="brand"><div class="brandmark">S</div><div><h1>STAINHER</h1><small>Dashboard Mantenimiento</small></div></div>
    <nav class="nav">
      <button data-page="inicio" class="active">▦ Inicio</button>
      <button data-page="preventivo">✓ Preventivo</button>
      <button data-page="correctivo">⚙ Correctivo</button>
      <button data-page="equipos">▣ Equipos</button>
      <button data-page="sistema" class="admin-only hidden">◫ Sistema</button>
      <button data-page="usuarios" class="admin-only hidden">♙ Usuarios</button>
    </nav>
    <div class="sidebar-bottom"><div class="userbox"><strong id="userName">Usuario</strong><small id="userRole">rol</small><button id="logoutBtn" class="logout">Cerrar sesión</button></div></div>
  </aside>
  <main class="main">
    <section id="page-inicio" class="page"></section>
    <section id="page-preventivo" class="page hidden"></section>
    <section id="page-correctivo" class="page hidden"></section>
    <section id="page-equipos" class="page hidden"></section>
    <section id="page-sistema" class="page hidden"></section>
    <section id="page-usuarios" class="page hidden"></section>
  </main>
</div>
<div id="modalRoot"></div>
<script>
const CFG=window.STAINHER_CONFIG; const sb=supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
let state={session:null,profile:null,equipos:[],correctivo:[],correctivoMonth:new Date().getMonth()+1,correctivoYear:new Date().getFullYear(),charts:{},system:{},preventivos:[],prevSelectedEquipo:'',prevYear:new Date().getFullYear(),prevMonth:new Date().getMonth()+1};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const fmtH=n=>Number.isFinite(n)?`${n.toFixed(1)} h`:'—';
function toast(msg,type=''){const el=document.createElement('div');el.className=`notice ${type}`;el.textContent=msg;$('#modalRoot').appendChild(el);setTimeout(()=>el.remove(),3500)}
function isAdmin(){return state.profile?.rol==='administrador'} function canPlan(){return ['administrador','planificador'].includes(state.profile?.rol)}
async function loadProfile(){const {data,error}=await sb.from('perfiles').select('*').eq('id',state.session.user.id).single();if(error)throw error;state.profile=data;$('#userName').textContent=data.nombre||state.session.user.email;$('#userRole').textContent=data.rol;$$('.admin-only').forEach(x=>x.classList.toggle('hidden',!isAdmin()));}
async function loadEquipos(){const {data,error}=await sb.from('equipos').select('*').order('nombre');if(error)throw error;state.equipos=data||[];}
function showApp(){ $('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');renderAll(); }
function showLogin(){ $('#appView').classList.add('hidden');$('#loginView').classList.remove('hidden'); }
async function init(){const {data:{session}}=await sb.auth.getSession();if(session){state.session=session;try{await loadProfile();await loadEquipos();showApp();}catch(e){console.error(e);showLogin();}}else showLogin();}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const m=$('#loginMsg');m.classList.add('hidden');const {data,error}=await sb.auth.signInWithPassword({email:$('#email').value,password:$('#password').value});if(error){m.textContent=error.message;m.classList.remove('hidden');return;}state.session=data.session;try{await loadProfile();await loadEquipos();showApp();}catch(err){m.textContent='Usuario autenticado, pero falta su perfil/rol.';m.classList.remove('hidden')}});
$('#logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};
$$('.nav button').forEach(b=>b.onclick=()=>{if(['usuarios','sistema'].includes(b.dataset.page)&&!isAdmin())return;$$('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$$('.page').forEach(x=>x.classList.add('hidden'));$(`#page-${b.dataset.page}`).classList.remove('hidden');if(b.dataset.page==='correctivo')loadCorrectivo();if(b.dataset.page==='preventivo')renderPreventivo();if(b.dataset.page==='sistema')renderSistema();if(b.dataset.page==='usuarios')renderUsuarios();});
function renderAll(){renderInicio();renderEquipos();renderPreventivo();renderCorrectivoShell();renderSistema();renderUsuarios();}
function renderInicio(){const activos=state.equipos.filter(e=>e.estado==='activo').length;$('#page-inicio').innerHTML=`<div class="topbar"><div><h2>Panel de Mantenimiento</h2><p>Vista integrada de parque, preventivo y correctivo.</p></div><div class="actions">${isAdmin()?'<button class="btn primary" onclick="openUserModal()">+ Crear usuario</button>':''}</div></div><div class="grid-kpi"><div class="kpi"><span>Equipos</span><strong>${state.equipos.length}</strong><details class="kpi-help"><summary>Cómo se calcula</summary><div><b>Equipos = total de equipos registrados en el maestro.</b><br>Incluye equipos activos y retirados que permanezcan registrados para conservar su trazabilidad histórica.</div></details></div><div class="kpi"><span>Activos</span><strong>${activos}</strong><details class="kpi-help"><summary>Cómo se calcula</summary><div><b>Activos = equipos cuyo estado es “activo”.</b><br>Los equipos fuera de servicio o retirados se mantienen en el parque y en el histórico, pero no se contabilizan en este KPI.</div></details></div><div class="kpi"><span>Correctivos mes</span><strong id="homeCorr">—</strong><details class="kpi-help"><summary>Cómo se calcula</summary><div><b>Correctivos mes = número de atenciones correctivas del mes actual.</b><br>Se cuentan los registros válidos cargados en la base de averías para el período vigente, después de las exclusiones configuradas.</div></details></div><div class="kpi"><span>Horas correctivo</span><strong id="homeHours">—</strong><details class="kpi-help"><summary>Cómo se calcula</summary><div><b>Horas correctivo = suma de la duración de todas las atenciones del mes.</b><br>Cada duración se calcula entre Fecha/Hora inicio y Fecha/Hora término del trabajo.</div></details></div><div class="kpi"><span>Cierre operativo</span><strong id="homeOp">—</strong><details class="kpi-help"><summary>Cómo se calcula</summary><div><b>Cierre operativo = (atenciones finalizadas Operativas ÷ total de atenciones) × 100.</b><br>Usa el campo Estado final del equipo de la base de averías.</div></details></div></div><div class="panel"><div class="row-between"><h3>Parque de equipos</h3><button class="btn" onclick="gotoPage('equipos')">Ver todos</button></div><div class="cards">${state.equipos.map(cardEquipo).join('')||'<div class="empty">Aún no hay equipos cargados.</div>'}</div></div>`;loadCorrectivo(true);} 
function cardEquipo(e){return `<article class="equipment-card"><div class="row-between"><span class="tag">${e.tipo||'Equipo'}</span><span class="status ${e.estado==='activo'?'ok':e.estado==='fuera_servicio'?'bad':'warn'}">${e.estado==='fuera_servicio'?'fuera de servicio':(e.estado||'activo')}</span></div><h4>${e.nombre}</h4><div class="muted">${e.ubicacion||'Ubicación no informada'}</div><div class="progress"><i style="width:${e.estado==='activo'?100:e.estado==='fuera_servicio'?10:30}%"></i></div><div class="row-between"><small class="muted">${e.fabricante||'Fabricante s/i'} ${e.modelo?`· ${e.modelo}`:''}</small><button class="btn" onclick="openEquipoModal('${e.id}')">Detalle</button></div></article>`}
function gotoPage(p){document.querySelector(`[data-page="${p}"]`).click()}
function renderEquipos(){const btn=canPlan()?'<button class="btn primary" onclick="openEquipoModal()">+ Nuevo equipo</button>':'';$('#page-equipos').innerHTML=`<div class="topbar"><div><h2>Equipos</h2><p>Maestro técnico editable del parque.</p></div>${btn}</div><div class="cards">${state.equipos.map(cardEquipo).join('')||'<div class="empty">Sin equipos cargados.</div>'}</div>`}
function openEquipoModal(id=''){if(!canPlan()&&id==='')return;const e=state.equipos.find(x=>x.id===id)||{};const editable=canPlan();$('#modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="row-between"><h3>${id?'Ficha del equipo':'Nuevo equipo'}</h3><button class="btn" onclick="closeModal()">Cerrar</button></div><form id="equipoForm" class="form-grid"><label>Nombre<input class="field" name="nombre" value="${e.nombre||''}" ${editable?'':'disabled'} required></label><label>Nombre alternativo<input class="field" name="nombre_alternativo" value="${e.nombre_alternativo||''}" ${editable?'':'disabled'}></label><label>Tipo<input class="field" name="tipo" value="${e.tipo||''}" ${editable?'':'disabled'}></label><label>Ubicación<input class="field" name="ubicacion" value="${e.ubicacion||''}" ${editable?'':'disabled'}></label><label>Fabricante<input class="field" name="fabricante" value="${e.fabricante||''}" ${editable?'':'disabled'}></label><label>Modelo<input class="field" name="modelo" value="${e.modelo||''}" ${editable?'':'disabled'}></label><label>Capacidad carga<input class="field" name="capacidad_carga" value="${e.capacidad_carga||''}" ${editable?'':'disabled'}></label><label>Pasajeros<input class="field" name="pasajeros" type="number" value="${e.pasajeros??''}" ${editable?'':'disabled'}></label><label>Velocidad<input class="field" name="velocidad" value="${e.velocidad||''}" ${editable?'':'disabled'}></label><label>Paradas<input class="field" name="paradas" type="number" value="${e.paradas??''}" ${editable?'':'disabled'}></label><label>Criticidad<select class="field" name="criticidad" ${editable?'':'disabled'}><option ${e.criticidad==='Alta'?'selected':''}>Alta</option><option ${e.criticidad==='Media'?'selected':''}>Media</option><option ${e.criticidad==='Baja'?'selected':''}>Baja</option></select></label><label>Estado<select class="field" name="estado" ${editable?'':'disabled'}><option value="activo" ${(!e.estado||e.estado==='activo')?'selected':''}>activo</option><option value="fuera_servicio" ${e.estado==='fuera_servicio'?'selected':''}>fuera de servicio</option><option value="retirado" ${e.estado==='retirado'?'selected':''}>retirado</option></select></label><label class="full">Observaciones<textarea class="field" name="observaciones" rows="4" ${editable?'':'disabled'}>${e.observaciones||''}</textarea></label>${editable?'<div class="full"><button class="btn primary" type="submit">Guardar</button></div>':''}</form></div></div>`;if(editable)$('#equipoForm').onsubmit=async ev=>{ev.preventDefault();const obj=Object.fromEntries(new FormData(ev.target));obj.pasajeros=obj.pasajeros?Number(obj.pasajeros):null;obj.paradas=obj.paradas?Number(obj.paradas):null;let q=id?sb.from('equipos').update(obj).eq('id',id):sb.from('equipos').insert(obj);const {error}=await q;if(error)return toast(error.message,'error');await loadEquipos();closeModal();renderAll();toast('Equipo guardado','success')};}
function closeModal(){ $('#modalRoot').innerHTML=''; }
function openDeletePreventivoModal(){
  if(!isAdmin())return;
  const y=Number($('#prevYear')?.value||state.prevYear||new Date().getFullYear());
  const m=Number($('#prevMonth')?.value||state.prevMonth||new Date().getMonth()+1);
  const monthName=new Date(2000,m-1).toLocaleString('es-CL',{month:'long'});

function planHeaderScore(row){
  const vals=(row||[]).map(v=>cleanHeader(v));
  const has=(aliases)=>vals.some(v=>aliases.some(a=>v===cleanHeader(a)||v.includes(cleanHeader(a))));
  const equipo=has(['Equipo','Nombre equipo','Ascensor / Equipo']);
  const actividad=has(['Actividad','Actividad de mantenimiento','Pauta','Tarea','Descripción','Descripcion','Descripción actividad','Descripcion actividad']);
  const frecuencia=has(['Frecuencia','Periodicidad']);
  let months=0;
  vals.forEach(v=>{for(let i=0;i<12;i++){if(MONTH_ALIASES[i].includes(v)||v===String(i+1)||v===String(i+1).padStart(2,'0')){months++;break}}});
  const plano=has(['Mes']) && has(['Estado']);
  return (equipo?6:0)+(actividad?6:0)+(frecuencia?1:0)+months*2+(plano?4:0);
}
function detectPlanSheetAndHeader(wb){
  let best=null;
  for(const sheetName of wb.SheetNames){
    const ws=wb.Sheets[sheetName];
    const grid=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});
    for(let i=0;i<Math.min(grid.length,80);i++){
      const row=grid[i]||[];
      const first=cleanHeader(row[0]);
      const dateMonths=row.slice(1,13).filter(v=>{
        if(v instanceof Date&&!Number.isNaN(v.getTime()))return true;
        const d=new Date(v);return v&&!Number.isNaN(d.getTime());
      }).length;
      const legacyScore=(first.includes('columna primaria')&&dateMonths>=8)?100+dateMonths:0;
      const score=Math.max(planHeaderScore(row),legacyScore);
      if(!best||score>best.score)best={sheetName,ws,grid,headerIndex:i,score,legacy:legacyScore>0};
    }
  }
  return best;
}
function planObjectsFromGrid(grid,headerIndex){
  const src=(grid[headerIndex]||[]).map((v,i)=>String(v||'').trim()||`__col_${i}`);
  const headers=[];const used={};
  src.forEach((h,i)=>{let k=h;if(used[k])k=`${k}_${i}`;used[k]=1;headers.push(k)});
  return grid.slice(headerIndex+1).map((row,ri)=>{const o={__row:headerIndex+2+ri};headers.forEach((h,i)=>o[h]=row?.[i]??'');return o});
}
function detectMonthCol(obj,monthIndex){const keys=Object.keys(obj||{});return keys.find(k=>{const c=cleanHeader(k);return MONTH_ALIASES[monthIndex].includes(c)||c===String(monthIndex+1)||c===String(monthIndex+1).padStart(2,'0')})||null}
function inferFrequencyFromActivity(activity,count){
  const a=cleanHeader(activity);
  if(a.includes('quincenal'))return 'Quincenal';
  if(a.includes('mensual'))return 'Mensual';
  if(a.includes('trimestral'))return 'Trimestral';
  if(a.includes('semestral'))return 'Semestral';
  if(a.includes('anual'))return 'Anual';
  if(count>=10)return 'Mensual';
  if(count>=4)return 'Trimestral';
  if(count===2)return 'Semestral';
  if(count===1)return 'Anual';
  return '';
}
function isLegacyEquipmentRow(row){
  if(!row||!row[0])return false;
  const label=String(row[0]).trim();
  const eq=mapEquipoPlan(label);
  if(!eq)return false;
  const vals=row.slice(1,13);
  const formulaLike=vals.filter(v=>String(v||'').includes('IFERROR')||String(v||'').includes('#REF!')).length;
  return formulaLike>=4 || vals.filter(v=>v!==''&&v!=null).length>=8;
}
function parseLegacyPlanMatrix(detected,year,siMode){
  const parsed=[];const errors=[];const grid=detected.grid;let currentEq=null;
  for(let ri=detected.headerIndex+1;ri<grid.length;ri++){
    const row=grid[ri]||[];const label=String(row[0]??'').trim();
    if(!label)continue;
    if(isLegacyEquipmentRow(row)){
      currentEq=mapEquipoPlan(label);
      if(!currentEq)errors.push(`Fila ${ri+1}: equipo no reconocido “${label}”`);
      continue;
    }
    if(!currentEq)continue;
    const monthStates=[];
    for(let mi=0;mi<12;mi++){
      const est=stateFromMatrixValue(row[mi+1],siMode);
      if(est)monthStates.push({mi,est});
    }
    if(!monthStates.length)continue;
    const frecuencia=inferFrequencyFromActivity(label,monthStates.length);
    monthStates.forEach(({mi,est})=>parsed.push({
      equipo_id:currentEq.id,equipo_nombre:currentEq.nombre,actividad:label,frecuencia,
      anio:year,mes:mi+1,fecha_programada:null,estado:est
    }));
  }
  return {parsed,errors};
}

function combineLocalDateTime(fecha,hora){

}
function calcReliabilityKpis(rows){
  const eq=$('#corrEquipo')?.value||'';
  const scoped=eq?rows.filter(r=>r.equipo===eq):rows;

  // La guía de trabajo es el ID de la falla. Registros sin guía no participan
  // en MTBF, MTTR ni Disponibilidad.
  const valid=scoped.filter(r=>String(r.guia||'').trim() && Number.isFinite(Number(r.duracion_horas)) && Number(r.duracion_horas)>=0);
  if(!valid.length)return {ready:false,mttr:null,mtbf:null,disponibilidad:null,fallas:0,downtime:0,observedHours:0};

  // Agrupa por número de guía para no contar dos veces una misma falla.
  // Si una misma guía tiene más de una intervención, sus duraciones se acumulan.
  const events=new Map();
  valid.forEach(r=>{
    const key=String(r.guia).trim();
    const h=Number(r.duracion_horas)||0;
    events.set(key,(events.get(key)||0)+h);
  });

  const fallas=events.size;
  const downtime=[...events.values()].reduce((a,h)=>a+h,0);
  const days=new Date(state.correctivoYear,state.correctivoMonth,0).getDate();
  const periodHours=days*24;
  const equipmentCount=eq?1:Math.max(1,new Set(scoped.map(r=>r.equipo).filter(Boolean)).size);
  const observedHours=periodHours*equipmentCount;
  const uptime=Math.max(0,observedHours-downtime);

  return {
    ready:true,
    mttr:fallas?downtime/fallas:null,
    mtbf:fallas?uptime/fallas:null,
    disponibilidad:observedHours?uptime/observedHours*100:null,
    fallas,
    downtime,
    observedHours
  };
}
function calcCorrectivoKpis(rows){
  const hours=rows.reduce((a,r)=>a+(r.duracion_horas||0),0);
  const op=rows.length?rows.filter(r=>r.estado_normalizado==='Operativo').length/rows.length*100:0;
  return {atenciones:rows.length,horas:hours,cierre_operativo:op,...calcReliabilityKpis(rows)};
}

function parseFechaExcel(v){
  if(v===null||v===undefined||v==='')return null;
  if(v instanceof Date&&!isNaN(v))return v.toISOString().slice(0,10);
  if(typeof v==='number'){
    const d=XLSX.SSF.parse_date_code(v); if(d)return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;
  }
  let x=String(v).trim();
  let m=x.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/);if(m)return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m=x.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})$/);if(m)return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  const d=new Date(x);return isNaN(d)?null:d.toISOString().slice(0,10);
}
function parseHora(v){
  if(v===null||v===undefined||v==='')return null;
  if(typeof v==='number'&&v>=0&&v<1){const min=Math.round(v*24*60)%1440;return `${String(Math.floor(min/60)).padStart(2,'0')}:${String(min%60).padStart(2,'0')}`;}
  let x=String(v).trim().toUpperCase().replace(/HRS?|HORAS?/g,'').replace(/\s+/g,' ');
  x=x.replace(/\b(AM|PM)\b/g,' $1').replace(/\s+/g,' ').trim();
  let m=x.match(/^(\d{1,2})(?::(\d{1,3}))?\s*(AM|PM)?$/);if(!m)return null;
  let h=Number(m[1]),mi=Number((m[2]||'0').slice(0,2));if(mi>59)mi=0;
  const ap=m[3];if(ap==='PM'&&h<12)h+=12;if(ap==='AM'&&h===12)h=0;if(h>23)return null;
  return `${String(h).padStart(2,'0')}:${String(mi).padStart(2,'0')}`;
}

  $('#importPreview').innerHTML=`<div class="grid-kpi" style="grid-template-columns:repeat(5,1fr)"><div class="kpi"><span>Leídos</span><strong>${raw.length}</strong></div><div class="kpi"><span>Nuevos</span><strong>${nuevos.length}</strong></div><div class="kpi"><span>Duplicados</span><strong>${dup}</strong></div><div class="kpi"><span>Excluidos</span><strong>${excluded.length}</strong></div><div class="kpi"><span>Con error</span><strong>${invalid.length}</strong></div></div><div class="panel"><h3>Vista previa de registros nuevos</h3><div style="overflow:auto"><table><thead><tr><th>Fecha</th><th>Equipo</th><th>Guía</th><th>Responsable</th><th>Duración</th><th>Estado</th></tr></thead><tbody>${sample.map(r=>`<tr><td>${r.fecha_inicio}</td><td>${r._equipoNorm}</td><td>${r.numero_guia||'—'}</td><td>${r.supervisor_tecnico||'—'}</td><td>${r.duracion_minutos==null?'—':fmtH(r.duracion_minutos/60)}</td><td>${normalizarEstado(r.estado_final)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No hay registros nuevos para importar.</td></tr>'}</tbody></table></div></div><button class="btn primary" ${nuevos.length?'':'disabled'} onclick="confirmImportAverias()">Importar ${nuevos.length} registros</button>`;
}
async function confirmImportAverias(){
  const d=state.importDraft;if(!d?.rows?.length)return;
  const {data:imp,error:impErr}=await sb.from('importaciones_averias').insert({nombre_archivo:d.fileName,total_registros:d.total,registros_nuevos:d.rows.length,registros_duplicados:d.duplicates,registros_error:d.invalid,usuario_id:state.session.user.id}).select('id').single();
  if(impErr)return toast(impErr.message,'error');
  const clean=d.rows.map(({_equipoNorm,_valido,...r})=>({...r,importacion_id:imp.id}));
  let inserted=0;for(let i=0;i<clean.length;i+=100){const {data,error}=await sb.from('averias').upsert(clean.slice(i,i+100),{onConflict:'clave_unica',ignoreDuplicates:true}).select('id');if(error)return toast(`Importación parcial: ${error.message}`,'error');inserted+=(data||[]).length;}
  closeModal();toast(`${inserted} averías importadas`,'success');renderCorrectivoShell();loadCorrectivo();renderInicio();
}
function openAveriaDetail(id){const r=state.correctivo.find(x=>String(x.id)===String(id));if(!r)return;$('#modalRoot').innerHTML=`<div class="modal-bg"><div class="modal"><div class="row-between"><h3>${r.equipo} · ${r.guia||'Sin guía'}</h3><button class="btn" onclick="closeModal()">Cerrar</button></div><div class="form-grid"><div><span class="muted">Fecha</span><p>${r.fecha_inicio||'—'} ${r.hora_inicio||''}</p></div><div><span class="muted">Responsable</span><p>${r.responsable||'—'}</p></div><div><span class="muted">Duración atención</span><p>${fmtH(r.duracion_horas)}</p></div><div><span class="muted">Estado final</span><p>${r.estado_normalizado}</p></div><div class="full"><span class="muted">Observación</span><p style="white-space:pre-wrap;line-height:1.55">${r.observaciones||'Sin observación'}</p></div></div></div></div>`;}
function renderCorrectivo(j){
  let rows=j.rows||[];const eq=$('#corrEquipo')?.value;if(eq)rows=rows.filter(r=>r.equipo===eq);
  let hours=rows.reduce((a,r)=>a+(r.duracion_horas||0),0),op=rows.length?rows.filter(r=>r.estado_normalizado==='Operativo').length/rows.length*100:0;
  const by={};rows.forEach(r=>by[r.equipo]=(by[r.equipo]||0)+1);const top=Object.entries(by).sort((a,b)=>b[1]-a[1])[0]?.[0]||'—';
  const rel=calcReliabilityKpis(rows);
  const relValue=(v,suffix=' h')=>rel.ready&&Number.isFinite(v)?`${v.toFixed(1)}${suffix}`:'N/D';
  const relNote=rel.ready?`${rel.fallas} fallas únicas por guía`:'Sin guías válidas en el período';
  $('#corrBody').innerHTML=`
    <div class="grid-kpi"><div class="kpi"><span>Atenciones</span><strong>${rows.length}</strong><details class="kpi-help"><summary>Cómo se calcula</summary><div><b>Atenciones = número de registros del período filtrado.</b><br>Corresponde a todas las intervenciones correctivas que cumplen con el año, mes y equipo seleccionados, después de excluir registros no correctivos.</div></details></div><div class="kpi"><span>Horas atención</span><strong>${fmtH(hours)}</strong><details class="kpi-help"><summary>Cómo se calcula</summary><div><b>Horas atención = suma de las duraciones de todas las intervenciones del período.</b><br>Cada duración se obtiene desde Fecha/Hora inicio de trabajo hasta Fecha/Hora término de trabajo.</div></details></div><div class="kpi"><span>Duración promedio</span><strong>${fmtH(rows.length?hours/rows.length:0)}</strong><details class="kpi-help"><summary>Cómo se calcula</summary><div><b>Duración promedio = Horas atención ÷ Atenciones.</b><br>Mide cuántas horas dura, en promedio, cada intervención correctiva del período seleccionado.</div></details></div><div class="kpi"><span>Cierre operativo</span><strong>${op.toFixed(0)}%</strong><details class="kpi-help"><summary>Cómo se calcula</summary><div><b>Cierre operativo = (atenciones con estado final Operativo ÷ total de atenciones) × 100.</b><br>El estado final se normaliza a partir de la columna Estado final del equipo.</div></details></div><div class="kpi"><span>Más intervenido</span><strong style="font-size:17px">${top}</strong><details class="kpi-help"><summary>Cómo se calcula</summary><div><b>Más intervenido = equipo con mayor cantidad de atenciones en el período.</b><br>Si hay empate, se muestra el primero según el orden del consolidado.</div></details></div></div>
    <div class="grid-kpi" style="grid-template-columns:repeat(3,minmax(180px,1fr))">
      <div class="kpi ${rel.ready?'':'pending'}"><span>MTBF</span><strong>${relValue(rel.mtbf)}</strong><small>${relNote}</small><details class="kpi-help"><summary>Cómo se calcula</summary><div><b>MTBF = Horas operativas ÷ Nº de fallas únicas.</b><br>Falla única = Número de guía de trabajo. Horas operativas = horas calendario del período menos horas de intervención. Si se muestran todos los equipos, las horas calendario se multiplican por la cantidad de equipos con registros en el período.</div></details></div>
      <div class="kpi ${rel.ready?'':'pending'}"><span>MTTR</span><strong>${relValue(rel.mttr)}</strong><small>${relNote}</small><details class="kpi-help"><summary>Cómo se calcula</summary><div><b>MTTR = Horas totales de intervención ÷ Nº de fallas únicas.</b><br>La restitución corresponde a Fecha/Hora término de trabajo y el inicio corresponde a Fecha/Hora inicio de trabajo. Si una misma guía tiene varias intervenciones, sus duraciones se acumulan.</div></details></div>
      <div class="kpi ${rel.ready?'':'pending'}"><span>Disponibilidad</span><strong>${relValue(rel.disponibilidad,'%')}</strong><small>${relNote}</small><details class="kpi-help"><summary>Cómo se calcula</summary><div><b>Disponibilidad = Horas operativas ÷ Horas calendario × 100.</b><br>Para este dashboard se considera que el tiempo de indisponibilidad es igual a la duración registrada de la atención, desde inicio hasta término del trabajo.</div></details></div>
    </div>
    <div class="two-col"><div class="panel"><h3>Atenciones por equipo</h3><div class="chart-wrap"><canvas id="chartEq"></canvas></div></div><div class="panel"><h3>Horas de intervención por equipo</h3><div class="chart-wrap"><canvas id="chartHours"></canvas></div></div></div>
    <div class="panel trend-panel"><h3>Tendencia mensual de atenciones · ${state.correctivoYear}</h3><div class="chart-wrap" style="height:260px"><canvas id="chartTrend"></canvas></div></div>
    <div class="panel"><h3>Historial del período</h3><div style="overflow:auto"><table><thead><tr><th>Fecha</th><th>Equipo</th><th>Guía</th><th>Responsable</th><th>Duración</th><th>Estado final</th><th>Observación</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.fecha_inicio||''}</td><td>${r.equipo}</td><td>${r.guia||'—'}</td><td>${r.responsable||'—'}</td><td>${fmtH(r.duracion_horas)}</td><td><span class="status ${r.estado_normalizado==='Operativo'?'ok':'bad'}">${r.estado_normalizado}</span></td><td class="obs-cell"><div class="obs-preview">${r.observaciones||'—'}</div>${r.observaciones?`<button class="link-btn" onclick="openAveriaDetail('${r.id}')">Ver detalle</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">Sin atenciones para el período seleccionado.</td></tr>'}</tbody></table></div></div>`;
  Object.values(state.charts).forEach(c=>c?.destroy?.());state.charts={};
  const labels=Object.keys(by),vals=Object.values(by),hourBy={};rows.forEach(r=>hourBy[r.equipo]=(hourBy[r.equipo]||0)+(r.duracion_horas||0));
  state.charts.a=new Chart($('#chartEq'),{type:'bar',data:{labels,datasets:[{label:'Atenciones',data:vals}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#aeb8c5'}},y:{ticks:{color:'#aeb8c5'},beginAtZero:true}}}});
  state.charts.b=new Chart($('#chartHours'),{type:'bar',data:{labels:Object.keys(hourBy),datasets:[{label:'Horas',data:Object.values(hourBy)}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#aeb8c5'}},y:{ticks:{color:'#aeb8c5'},beginAtZero:true}}}});
  const trend=j.trend||calcTrendMensual(state.correctivoYearRows||[]);const monthLabels=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  state.charts.c=new Chart($('#chartTrend'),{type:'line',data:{labels:monthLabels,datasets:[{label:'Atenciones',data:trend,tension:.25,fill:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#aeb8c5'}},y:{ticks:{color:'#aeb8c5'},beginAtZero:true,precision:0}}}});
}
function pdfHeader(doc,title,subtitle){doc.setFont('helvetica','bold');doc.setFontSize(18);doc.text('STAINHER',14,16);doc.setFontSize(14);doc.text(title,14,27);doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(90);doc.text(subtitle,14,34);doc.setTextColor(0);doc.setDrawColor(239,91,42);doc.setLineWidth(.8);doc.line(14,38,196,38);}
function ensurePdf(){return window.jspdf?.jsPDF&&window.jspdf.jsPDF;}
function downloadPreventivoReport(equipoId=''){const C=ensurePdf();if(!C)return toast('No se pudo cargar el generador PDF','error');let rows=[...(state.preventivos||[])];if(equipoId)rows=rows.filter(r=>r.equipo_id===equipoId);const k=preventivoStats(rows),month=new Date(2000,(state.prevMonth||1)-1).toLocaleString('es-CL',{month:'long'}),doc=new C({orientation:'landscape',unit:'mm',format:'a4'});const equipo=equipoId?(rows[0]?.equipos?.nombre||state.equipos.find(e=>e.id===equipoId)?.nombre||'Equipo'):'Todos los equipos';pdfHeader(doc,'Informe Mensual de Mantenimiento Preventivo',`${month} ${state.prevYear} · ${equipo}`);doc.setFontSize(10);doc.text(`Cumplimiento: ${k.pct.toFixed(0)}%`,14,47);doc.text(`Programadas: ${k.total}`,62,47);doc.text(`Ejecutadas: ${k.exec}`,102,47);doc.text(`Pendientes: ${k.pend}`,140,47);doc.text(`Atrasadas: ${k.late}`,178,47);doc.autoTable({startY:53,head:[['Equipo','Actividad','Frecuencia','F. programada','Estado','F. ejecución','Observación']],body:rows.map(r=>[r.equipos?.nombre||'',r.actividad||'',r.frecuencia||'',r.fecha_programada||'—',r.estado||'',r.fecha_ejecucion||'—',r.observacion||'']),styles:{fontSize:7,cellPadding:2},headStyles:{fillColor:[35,43,54]},columnStyles:{1:{cellWidth:60},6:{cellWidth:65}}});doc.setFontSize(7);doc.setTextColor(100);doc.text(`Generado ${new Date().toLocaleString('es-CL')} · Dashboard Stainher`,14,202);doc.save(`Preventivo_${state.prevYear}_${String(state.prevMonth).padStart(2,'0')}${equipoId?'_'+equipo.replace(/\s+/g,'_'):''}.pdf`);}
function downloadCorrectivoReport(){const C=ensurePdf();if(!C)return toast('No se pudo cargar el generador PDF','error');let rows=[...(state.correctivo||[])];const eq=$('#corrEquipo')?.value||'';if(eq)rows=rows.filter(r=>r.equipo===eq);const hours=rows.reduce((a,r)=>a+(r.duracion_horas||0),0),op=rows.length?rows.filter(r=>r.estado_normalizado==='Operativo').length/rows.length*100:0,rel=calcReliabilityKpis(rows),month=new Date(2000,(state.correctivoMonth||1)-1).toLocaleString('es-CL',{month:'long'}),doc=new C({orientation:'landscape',unit:'mm',format:'a4'});pdfHeader(doc,'Informe Mensual de Mantenimiento Correctivo',`${month} ${state.correctivoYear} · ${eq||'Todos los equipos'}`);doc.setFontSize(10);doc.text(`Atenciones: ${rows.length}`,14,47);doc.text(`Horas atención: ${hours.toFixed(1)} h`,55,47);doc.text(`Cierre operativo: ${op.toFixed(0)}%`,108,47);doc.text(`MTTR: ${rel.ready?rel.mttr.toFixed(1)+' h':'N/D'}`,164,47);doc.text(`Disponibilidad: ${rel.ready?rel.disponibilidad.toFixed(1)+'%':'N/D'}`,213,47);doc.autoTable({startY:53,head:[['Fecha','Equipo','Guía','Responsable','Duración','Estado','Observación']],body:rows.map(r=>[r.fecha_inicio||'',r.equipo||'',r.guia||'—',r.responsable||'—',fmtH(r.duracion_horas),r.estado_normalizado||'',r.observaciones||'']),styles:{fontSize:7,cellPadding:2},headStyles:{fillColor:[35,43,54]},columnStyles:{6:{cellWidth:75}}});doc.setFontSize(7);doc.setTextColor(100);doc.text(`Generado ${new Date().toLocaleString('es-CL')} · Dashboard Stainher`,14,202);doc.save(`Correctivo_${state.correctivoYear}_${String(state.correctivoMonth).padStart(2,'0')}${eq?'_'+eq.replace(/\s+/g,'_'):''}.pdf`);}
const GITHUB_OWNER='Ismagalvez',GITHUB_REPO='Stainher-Dashboard',GITHUB_REFERENCE_KB=1024*1024;
function fmtBytesFromKB(kb){const b=(Number(kb)||0)*1024;if(b<1024*1024)return `${(b/1024).toFixed(1)} KB`;if(b<1024*1024*1024)return `${(b/1024/1024).toFixed(1)} MB`;return `${(b/1024/1024/1024).toFixed(2)} GB`;}
function renderSistema(){if(!isAdmin()){if($('#page-sistema'))$('#page-sistema').innerHTML='';return;}$('#page-sistema').innerHTML=`<div class="topbar"><div><h2>Sistema</h2><p>Monitoreo de tamaño del repositorio y crecimiento de datos.</p></div><button class="btn" onclick="loadSistema()">↻ Actualizar</button></div><div class="storage-grid"><div class="storage-card"><div class="row-between"><div><h3>GitHub</h3><div class="storage-meta">${GITHUB_OWNER}/${GITHUB_REPO}</div></div><span id="ghStatus" class="status warn">Consultando</span></div><div id="ghSize" class="storage-value">—</div><div class="storage-meta">Referencia de mantenimiento: 1 GB</div><div id="ghBar" class="storage-bar"><i></i></div><div class="row-between"><small id="ghPct" class="muted">—</small><small id="ghUpdated" class="muted">—</small></div><details class="kpi-help"><summary>Qué significa</summary><div>El tamaño se obtiene desde la API pública del repositorio. El 1 GB se usa como referencia preventiva de mantenimiento, no como una cuota rígida de GitHub Free. Conviene evitar subir respaldos, fotografías, PDFs o Excel históricos al repositorio y mantener GitHub principalmente para el código del dashboard.</div></details></div><div class="storage-card"><h3>Supabase</h3><div class="storage-meta">Volumen lógico utilizado por el dashboard</div><div class="system-list" style="margin-top:16px"><div class="system-stat"><span>Equipos</span><strong id="sysEq">—</strong></div><div class="system-stat"><span>Averías</span><strong id="sysAv">—</strong></div><div class="system-stat"><span>Preventivos</span><strong id="sysPrev">—</strong></div></div><details class="kpi-help"><summary>Qué significa</summary><div>Estos valores muestran la cantidad de registros del dashboard, no los MB reales consumidos por la base de datos. Para conocer el almacenamiento real del proyecto Supabase se debe revisar el panel de uso de Supabase o implementar una consulta administrativa segura del lado servidor.</div></details></div></div><div class="panel"><h3>Recomendaciones para mantener bajo el uso</h3><div class="notice">Mantén en GitHub solo código y archivos livianos del sitio. Las cargas Excel del Correctivo y Preventivo se procesan en el navegador y sus datos se guardan en Supabase, por lo que no es necesario conservar esos Excel dentro del repositorio.</div><div id="systemMsg" class="muted">Actualizando información…</div></div>`;loadSistema();}
async function loadSistema(){if(!isAdmin())return;const msg=$('#systemMsg');if(msg)msg.textContent='Actualizando información…';try{const gh=await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}`,{headers:{'Accept':'application/vnd.github+json'}});if(!gh.ok)throw new Error(`GitHub ${gh.status}`);const repo=await gh.json();const kb=Number(repo.size)||0,pct=Math.min(100,(kb/GITHUB_REFERENCE_KB)*100);if($('#ghSize'))$('#ghSize').textContent=fmtBytesFromKB(kb);if($('#ghPct'))$('#ghPct').textContent=`${pct.toFixed(pct<1?2:1)}% de la referencia de 1 GB`;const bar=$('#ghBar');if(bar){bar.querySelector('i').style.width=`${Math.max(pct,.3)}%`;bar.classList.toggle('warn',pct>=60&&pct<80);bar.classList.toggle('bad',pct>=80);}const st=$('#ghStatus');if(st){st.className=`status ${pct>=80?'bad':pct>=60?'warn':'ok'}`;st.textContent=pct>=80?'Revisar':pct>=60?'Atención':'Normal';}if($('#ghUpdated'))$('#ghUpdated').textContent=`GitHub actualizado: ${new Date(repo.updated_at).toLocaleDateString('es-CL')}`;}catch(e){console.error(e);if($('#ghStatus')){$('#ghStatus').className='status bad';$('#ghStatus').textContent='No disponible';}if($('#ghSize'))$('#ghSize').textContent='—';}
  const count=async table=>{const {count,error}=await sb.from(table).select('*',{count:'exact',head:true});if(error)throw error;return count||0};
  try{const [eq,av,pv]=await Promise.all([count('equipos'),count('averias'),count('programacion_preventiva')]);if($('#sysEq'))$('#sysEq').textContent=eq.toLocaleString('es-CL');if($('#sysAv'))$('#sysAv').textContent=av.toLocaleString('es-CL');if($('#sysPrev'))$('#sysPrev').textContent=pv.toLocaleString('es-CL');if(msg)msg.textContent=`Última actualización: ${new Date().toLocaleString('es-CL')}`;}catch(e){console.error(e);if(msg)msg.textContent='No fue posible leer uno o más contadores de Supabase.';}}
function renderUsuarios(){if(!isAdmin()){ $('#page-usuarios').innerHTML='';return;}$('#page-usuarios').innerHTML=`<div class="topbar"><div><h2>Usuarios</h2><p>Gestión de accesos y roles.</p></div><button class="btn primary" onclick="openUserModal()">+ Crear usuario</button></div><div class="panel" id="usersTable"><div class="empty">Cargando…</div></div>`;loadUsers();}
async function loadUsers(){if(!isAdmin())return;const {data,error}=await sb.from('perfiles').select('id,nombre,email,rol,activo,created_at').order('nombre');if(error)return $('#usersTable').innerHTML=`<span class="error">${error.message}</span>`;$('#usersTable').innerHTML=`<table><thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th></tr></thead><tbody>${data.map(u=>`<tr><td>${u.nombre||''}</td><td>${u.email||''}</td><td>${u.rol}</td><td><span class="status ${u.activo?'ok':'bad'}">${u.activo?'Activo':'Inactivo'}</span></td></tr>`).join('')}</tbody></table>`}
function openUserModal(){if(!isAdmin())return;$('#modalRoot').innerHTML=`<div class="modal-bg"><div class="modal"><div class="row-between"><h3>Crear usuario</h3><button class="btn" onclick="closeModal()">Cerrar</button></div><form id="userForm" class="form-grid"><label>Nombre<input class="field" name="nombre" required></label><label>Correo<input class="field" name="email" type="email" required></label><label>Rol<select class="field" name="rol"><option>administrador</option><option>planificador</option><option>supervisor</option><option>tecnico</option><option>consulta</option></select></label><label>Contraseña temporal<input class="field" name="password" type="password" minlength="8" required></label><div class="full notice">La contraseña se envía únicamente a Supabase Auth y no se guarda en la tabla de perfiles.</div><div class="full"><button class="btn primary">Crear usuario</button></div></form></div></div>`;$('#userForm').onsubmit=async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(e.target));const res=await fetch(`${CFG.SUPABASE_URL}/functions/v1/create-user`,{method:'POST',headers:{Authorization:`Bearer ${state.session.access_token}`,apikey:CFG.SUPABASE_ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await res.json();if(!res.ok)return toast(j.error||'Error creando usuario','error');closeModal();loadUsers();toast('Usuario creado','success')};}
init();
</script>
