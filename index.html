};

async function v14UpdatePersonState(id,value){
  if(!isAdmin())return toast('Solo el Administrador puede activar, desactivar o cambiar el estado de la dotación.','error');
  const {error}=await sb.from('dotacion_contrato').update({estado:value}).eq('id',id);
  if(error)return toast(error.message,'error');
  await renderStandaloneDotacion();toast('Estado de dotación actualizado','success');
}

renderContractDotacion=function(){
  const rows=state.contractData?.dotacion||[],active=rows.filter(x=>x.estado==='activo'),tech=rows.filter(x=>x.area==='tecnico'),adm=rows.filter(x=>x.area==='administrativo_apoyo'),prev=rows.filter(x=>x.area==='prevencion'),sups=tech.filter(x=>v13Norm(x.cargo).includes('supervisor'));
  const dates=rows.flatMap(p=>V13_EXP_FIELDS.filter(([k])=>k!=='fecha_exp_licencia_interna'||v14HasInternalLicense(p)).map(([k])=>p[k]).filter(Boolean)),exp=dates.filter(d=>v12Days(d)<0).length,soon=dates.filter(d=>v12Days(d)>=0&&v12Days(d)<=60).length;
  document.getElementById('contractContent').innerHTML=`<div class="v12-doc-summary"><div class="contract-card"><div class="contract-label">Dotación contractual</div><div class="contract-kpi">${rows.length}</div></div><div class="contract-card"><div class="contract-label">Cubierta</div><div class="contract-kpi">${active.length}</div></div><div class="contract-card"><div class="contract-label">Documentos ≤ 60 días</div><div class="contract-kpi accent-yellow">${soon}</div></div><div class="contract-card"><div class="contract-label">Documentos vencidos</div><div class="contract-kpi">${exp}</div></div></div>${isAdmin()?'<div class="tab-actions"><button class="btn primary" onclick="openPersonModal()">+ Agregar persona / vacante</button></div>':''}<div class="panel"><h3>Personal Técnico · ${tech.filter(x=>x.estado==='activo').length} cubiertos / ${tech.length}</h3><div class="people-grid">${sups.map(s=>`<div class="crew-card"><div class="contract-label">Supervisor</div>${v13PersonCard(s)}<div class="contract-label" style="margin-top:12px">Técnicos asociados</div><div style="display:grid;gap:9px;margin-top:7px">${tech.filter(t=>t.id!==s.id&&t.estado!=='vacante'&&v13SupervisorNameMatch(t.supervisor_nombre,s.nombre)).map(v13PersonCard).join('')||'<div class="muted">Sin técnicos asociados.</div>'}</div></div>`).join('')}</div></div><div class="two-col"><div class="panel"><h3>Administrativo / Apoyo · ${adm.filter(x=>x.estado==='activo').length}</h3><div style="display:grid;gap:10px">${adm.map(v13PersonCard).join('')}</div></div><div class="panel"><h3>Prevención de Riesgos · ${prev.filter(x=>x.estado==='activo').length} cubiertos / ${prev.length}</h3><div style="display:grid;gap:10px">${prev.map(v13PersonCard).join('')}</div></div></div><div class="privacy-note">Las vigencias operacionales se muestran para control del contrato. RUT y fecha de nacimiento solo son visibles para Administrador y Prevención con permiso de edición.</div>`;

openPersonModal=function(id=''){
  if(!id&&!isAdmin())return toast('Solo el Administrador puede agregar personas o vacantes.','error');
  if(id&&!v14CanEditDotacionFields())return toast('Dotación está en modo solo lectura.','error');
  const p=(state.contractData?.dotacion||[]).find(x=>String(x.id)===String(id))||{},sups=(state.contractData?.dotacion||[]).filter(x=>x.area==='tecnico'&&v13Norm(x.cargo).includes('supervisor'));
  const dateField=(n,l)=>`<label>${l}<input class="field" name="${n}" type="date" value="${p[n]||''}"></label>`;
  const stateField=isAdmin()?`<label>Estado<select class="field" name="estado"><option value="activo" ${(!p.estado||p.estado==='activo')?'selected':''}>Activo</option><option value="vacante" ${p.estado==='vacante'?'selected':''}>Vacante</option><option value="inactivo" ${p.estado==='inactivo'?'selected':''}>Inactivo</option></select></label>`:'';
  document.getElementById('modalRoot').innerHTML=`<div class="modal-bg"><div class="modal modal-wide-v9"><div class="row-between"><h3>${id?'Editar':'Agregar'} dotación</h3><button class="btn" onclick="closeModal()">Cerrar</button></div><form id="personFormV14" class="form-grid"><label class="full">Nombre<input class="field" name="nombre" value="${esc(p.nombre||'')}" required></label><label>Cargo<input class="field" name="cargo" value="${esc(p.cargo||'')}" required></label><label>Área<select class="field" name="area"><option value="tecnico" ${p.area==='tecnico'?'selected':''}>Personal Técnico</option><option value="administrativo_apoyo" ${p.area==='administrativo_apoyo'?'selected':''}>Administrativo / Apoyo</option><option value="prevencion" ${p.area==='prevencion'?'selected':''}>Prevención</option></select></label><label>Supervisor<select class="field" name="supervisor_nombre"><option value="">No aplica</option>${sups.map(s=>`<option ${p.supervisor_nombre===s.nombre?'selected':''}>${esc(s.nombre)}</option>`).join('')}</select></label>${stateField}<label>RUT<input class="field" name="rut" value="${esc(p.rut||'')}"></label><label>Fecha nacimiento<input class="field" name="fecha_nacimiento" type="date" value="${p.fecha_nacimiento||''}"></label><label>Estado credencial<input class="field" name="estado_credencial" value="${esc(p.estado_credencial||'')}"></label><div class="full"><div class="contract-label">Habilitación Licencia Interna División Andina</div><div class="v14-license-options"><label><input type="checkbox" name="licencia_camino_industrial" ${p.licencia_camino_industrial===true?'checked':''}> Camino Industrial</label><label><input type="checkbox" name="licencia_rajo" ${p.licencia_rajo===true?'checked':''}> Rajo</label><label><input type="checkbox" name="licencia_mina_subterranea" ${p.licencia_mina_subterranea===true?'checked':''}> Mina Subterránea</label></div></div>${dateField('fecha_exp_licencia_interna','Expiración Licencia Interna')}${dateField('fecha_exp_documento','Expiración Cédula de Identidad')}${dateField('fecha_exp_examen','Expiración Examen')}${dateField('fecha_exp_induccion','Expiración Inducción')}${dateField('fecha_exp_psicosensometrico','Expiración Psicosensométrico')}${dateField('fecha_exp_manejo_defensivo','Expiración Manejo Defensivo')}${dateField('fecha_exp_areas_circulares','Expiración Áreas Circulares')}${dateField('fecha_exp_licencia_municipal','Expiración Licencia Municipal')}<div class="full row-between"><div>${id&&isAdmin()?`<button type="button" class="btn v14-admin-danger" onclick="v14DeletePerson('${p.id}')">Eliminar persona</button>`:''}</div><button class="btn primary">Guardar</button></div></form></div></div>`;
  document.getElementById('personFormV14').onsubmit=async e=>{
    e.preventDefault();const form=e.target,o=Object.fromEntries(new FormData(form));
    o.licencia_camino_industrial=form.licencia_camino_industrial.checked;
    o.licencia_rajo=form.licencia_rajo.checked;
    o.licencia_mina_subterranea=form.licencia_mina_subterranea.checked;
    const hasLic=o.licencia_camino_industrial||o.licencia_rajo||o.licencia_mina_subterranea;
    o.estado_licencia_interna=hasLic?'ACTIVA':'NO REGISTRA';
    o.clase_licencia_interna=null;
    if(!hasLic)o.fecha_exp_licencia_interna=null;
    ['supervisor_nombre','rut','fecha_nacimiento','fecha_exp_licencia_interna','fecha_exp_documento','fecha_exp_examen','fecha_exp_induccion','fecha_exp_psicosensometrico','fecha_exp_manejo_defensivo','fecha_exp_areas_circulares','fecha_exp_licencia_municipal'].forEach(k=>o[k]=o[k]||null);
    if(!isAdmin())delete o.estado;
    const q=id?sb.from('dotacion_contrato').update(o).eq('id',id):sb.from('dotacion_contrato').insert(o);
    const {error}=await q;if(error)return toast(error.message,'error');closeModal();await renderStandaloneDotacion();toast('Dotación actualizada','success');
  };
};
async function v14DeletePerson(id){

}

// -------------------- Liderazgo: ejecución programada ----------------
state.v14LeadershipExec={};
function v14ExecKey(name,code){return `${v13Norm(name)}|${code}`}
async function v14LoadExecutionAvailability(){
  state.v14LeadershipExec={};
  if(!['supervisor','prevencion'].includes(v11Role())||!canEditV11('liderazgo'))return;
  const now=new Date(),year=now.getFullYear(),month=now.getMonth()+1;
  const [g,c]=await Promise.all([
    sb.from('liderazgo_programacion').select('*').eq('anio',year).eq('mes',month),
    sb.from('liderazgo_cumplimiento').select('*').eq('anio',year).eq('mes',month).eq('estado','realizado')
  ]);
  if(g.error||c.error){console.warn('Disponibilidad liderazgo',g.error||c.error);return}
  let goals=g.data||[],done=c.data||[];
  if(v11Role()==='supervisor'){
    const ident=await currentSupervisorIdentityV11(),nm=ident.nombre||state.profile?.nombre||'';
    goals=goals.filter(x=>v13SupervisorNameMatch(x.supervisor_nombre,nm));
    done=done.filter(x=>v13SupervisorNameMatch(x.supervisor_nombre,nm));
  }
  const doneMap={};done.forEach(x=>{const k=v14ExecKey(x.supervisor_nombre,x.control_codigo);doneMap[k]=(doneMap[k]||0)+1});
  goals.forEach(x=>{const k=v14ExecKey(x.supervisor_nombre,x.control_codigo),real=doneMap[k]||0,row={name:x.supervisor_nombre,userId:x.supervisor_user_id||null,meta:Number(x.meta)||0,done:real,pending:Math.max(0,(Number(x.meta)||0)-real)};const rec=state.v14LeadershipExec[x.control_codigo]||(state.v14LeadershipExec[x.control_codigo]={rows:[],meta:0,done:0,pending:0});rec.rows.push(row);rec.meta+=row.meta;rec.done+=row.done;rec.pending+=row.pending});
}

v12ControlActions=function(c){
  if(!c.active)return '<button class="btn" disabled>Formulario pendiente</button>';
  const role=v11Role(),rec=state.v14LeadershipExec?.[c.code];
  if(role==='supervisor'&&canEditV11('liderazgo')){
    if(!rec||rec.meta<=0)return '<button class="btn v14-disabled" disabled>No programado este mes</button><span class="v14-control-state">Sin actividad programada para el mes en curso.</span>';
    if(rec.pending<=0)return `<button class="btn v14-disabled" disabled>Cumplido</button><span class="v14-control-state ok">${rec.done} de ${rec.meta} realizados.</span>`;
    return `<button class="btn primary" onclick="openControlV12(${c.n})">Realizar ahora</button><span class="v14-control-state warn">Pendientes: ${rec.pending} · Realizados: ${rec.done}/${rec.meta}</span>`;
  }
  if(role==='prevencion'&&canEditV11('liderazgo')){
    if(!rec||rec.meta<=0)return '<button class="btn v14-disabled" disabled>No programado este mes</button><span class="v14-control-state">Ningún supervisor tiene esta actividad programada.</span>';
    if(rec.pending<=0)return `<button class="btn v14-disabled" disabled>Cumplido</button><span class="v14-control-state ok">Programación mensual completada.</span>`;
    return `<button class="btn primary" onclick="openControlV12(${c.n})">Realizar ahora</button><span class="v14-control-state warn">${rec.pending} ejecución(es) pendiente(s) en el mes actual.</span>`;
  }
  return `<button class="btn" onclick="previewControlV12(${c.n})">Vista previa</button><button class="btn" onclick="downloadControlV12(${c.n})">Descargar formato</button>`;
};

const _renderLiderazgoV14Base=renderLiderazgoV95;

openControlV12=async function(n){
  n=Number(n);if(!canExecuteLeadershipV11())return toast('Tu perfil no tiene permiso para ejecutar controles.','error');
  const c=V12_CONTROLS.find(x=>x.n===n),rec=c?state.v14LeadershipExec?.[c.code]:null;
  if(!c||!rec||rec.pending<=0)return toast('Este control no tiene actividades pendientes programadas para el mes en curso.','error');
  if(v11Role()==='supervisor'){
    const r=rec.rows.find(x=>x.pending>0);if(!r)return toast('Tu programación mensual ya está cumplida.','error');
    state.v14ForcedSupervisor={name:r.name,userId:r.userId};return _openControlV14Base(n);
  }
  if(v11Role()==='prevencion')return v14SelectSupervisorForControl(n,c,rec.rows.filter(x=>x.pending>0));
};

function v14SelectSupervisorForControl(n,c,rows){
  document.getElementById('modalRoot').innerHTML=`<div class="modal-bg"><div class="modal"><div class="row-between"><h3>Seleccionar supervisor</h3><button class="btn" onclick="closeModal()">Cerrar</button></div><div class="notice">Solo aparecen supervisores con el Control N.º ${c.n} programado y pendiente en el mes actual.</div><form id="v14ExecSelect" class="form-grid"><label class="full">Supervisor<select id="v14ExecSupervisor" class="field">${rows.map((r,i)=>`<option value="${i}">${esc(r.name)} · ${r.done}/${r.meta} realizados · ${r.pending} pendiente(s)</option>`).join('')}</select></label><div class="full"><button class="btn primary">Continuar</button></div></form></div></div>`;
  document.getElementById('v14ExecSelect').onsubmit=async e=>{e.preventDefault();const r=rows[Number(document.getElementById('v14ExecSupervisor').value)];if(!r)return;state.v14ForcedSupervisor={name:r.name,userId:r.userId};closeModal();await _openControlV14Base(n)};
}

const _v12RegisterV14=v12Register;
v12Register=async function(ctrl,date,selId,turno=''){
  const s=v12SupervisorData(selId),now=new Date(),dt=new Date(date+'T12:00:00');
  if(dt.getFullYear()!==now.getFullYear()||dt.getMonth()!==now.getMonth())throw new Error('El control debe ejecutarse dentro del mes en curso.');
  const [g,c]=await Promise.all([
    sb.from('liderazgo_programacion').select('*').eq('anio',now.getFullYear()).eq('mes',now.getMonth()+1).eq('control_codigo',ctrl.code),
    sb.from('liderazgo_cumplimiento').select('id,supervisor_nombre').eq('anio',now.getFullYear()).eq('mes',now.getMonth()+1).eq('control_codigo',ctrl.code).eq('estado','realizado')
  ]);
  if(g.error)throw g.error;if(c.error)throw c.error;
  const goals=(g.data||[]).filter(x=>v13SupervisorNameMatch(x.supervisor_nombre,s.supervisor_nombre));
  const meta=goals.reduce((a,x)=>a+(Number(x.meta)||0),0),done=(c.data||[]).filter(x=>v13SupervisorNameMatch(x.supervisor_nombre,s.supervisor_nombre)).length;
  if(meta<=0)throw new Error('Este supervisor no tiene el control programado para el mes en curso.');
  if(done>=meta)throw new Error('La cantidad programada para este control ya fue completada.');
  const out=await _v12RegisterV14(ctrl,date,selId,turno);state.v14ForcedSupervisor=null;await v14LoadExecutionAvailability();return out;
};

setTimeout(async()=>{v13CleanHomeLayout();if(!document.querySelector('#page-inicio')?.classList.contains('hidden'))await renderHomeAlertsV95();},120);

}

v11Role=function(){return state.v15PreviewRole||_v11RoleV15()};

v11Permissions=function(profile=state.profile){if(state.v15PreviewRole&&isAdmin())return {...(V11_DEFAULTS[state.v15PreviewRole]||V11_DEFAULTS.consulta)};return _v11PermissionsV15(profile)};

async function v15LoadPreviewUsers(){const role=document.getElementById('v15PreviewRole')?.value||'';const sel=document.getElementById('v15PreviewUser');if(!sel)return;sel.innerHTML='<option value="">Perfil genérico</option>';if(!role)return;const {data}=await sb.from('perfiles').select('id,nombre,rol').eq('rol',role).eq('activo',true).order('nombre');sel.innerHTML+=[...(data||[])].map(x=>`<option value="${x.id}">${esc(x.nombre||x.id)}</option>`).join('')}

document.addEventListener('submit',e=>{if(v15MutationBlocked()&&e.target.closest('#appView')){e.preventDefault();e.stopImmediatePropagation();toast('Modo prueba: las acciones de escritura están bloqueadas.','warn')}},true);
document.addEventListener('click',e=>{if(!v15MutationBlocked())return;const b=e.target.closest('button');if(!b||!b.closest('#appView'))return;const t=(b.textContent||'').toLowerCase();if(/guardar|crear|eliminar|editar|programar|realizar ahora|importar|registrar|aprobar|rechazar/.test(t)){e.preventDefault();e.stopImmediatePropagation();toast('Modo prueba: acción bloqueada.','warn')}},true);

// ----------- Login / contraseña -----------
function v15InstallPasswordRecovery(){
  const form=document.getElementById('loginForm');if(form&&!document.getElementById('v15Forgot')){const b=document.createElement('button');b.id='v15Forgot';b.type='button';b.className='link-btn';b.style='width:100%;margin-top:10px;text-align:center';b.textContent='¿Olvidaste tu contraseña?';b.onclick=v15ForgotPassword;form.insertBefore(b,document.getElementById('loginMsg'));}
  const box=document.querySelector('.userbox');if(box&&!document.getElementById('v15OwnPass')){const b=document.createElement('button');b.id='v15OwnPass';b.className='logout';b.style='margin-top:8px';b.textContent='Cambiar mi contraseña';b.onclick=v15OpenPasswordChange;box.insertBefore(b,document.getElementById('logoutBtn'));}

async function v15ForgotPassword(){const email=document.getElementById('email')?.value?.trim();if(!email)return toast('Ingresa tu correo primero.','error');const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)return toast(error.message,'error');toast('Supabase envió el enlace de recuperación al correo indicado.','success')}
function v15OpenPasswordChange(){document.getElementById('modalRoot').innerHTML=`<div class="modal-bg"><div class="modal"><div class="row-between"><h3>Nueva contraseña</h3><button class="btn" onclick="closeModal()">Cerrar</button></div><form id="v15PassForm" class="form-grid"><label class="full">Nueva contraseña<input class="field" name="p1" type="password" minlength="8" required></label><label class="full">Repetir contraseña<input class="field" name="p2" type="password" minlength="8" required></label><div class="full notice">La contraseña no se muestra ni se almacena en el dashboard. Se actualiza directamente en Supabase Auth.</div><div class="full"><button class="btn primary">Actualizar contraseña</button></div></form></div></div>`;document.getElementById('v15PassForm').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(f.p1!==f.p2)return toast('Las contraseñas no coinciden.','error');const {error}=await sb.auth.updateUser({password:f.p1});if(error)return toast(error.message,'error');try{await sb.from('perfiles').update({debe_cambiar_password:false}).eq('id',state.session.user.id)}catch(_){ }closeModal();toast('Contraseña actualizada','success')}}
sb.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')setTimeout(v15OpenPasswordChange,250)});

// ----------- Centro de notificaciones -----------
function v15InstallBell(){if(document.getElementById('v15NotifyBtn'))return;const b=document.createElement('button');b.id='v15NotifyBtn';b.className='v15-notify-btn hidden';b.innerHTML='🔔<span id="v15NotifyCount" class="v15-notify-count hidden">0</span>';b.onclick=v15OpenNotifications;document.body.appendChild(b)}
async function v15LoadNotifications(){if(!state.session)return;try{const {data,error}=await sb.from('notificaciones_v15').select('*').or(`destinatario_user_id.is.null,destinatario_user_id.eq.${state.session.user.id}`).order('created_at',{ascending:false}).limit(40);if(error)throw error;state.v15Notifications=data||[];const n=state.v15Notifications.filter(x=>!x.leida).length;const b=document.getElementById('v15NotifyBtn'),c=document.getElementById('v15NotifyCount');b?.classList.remove('hidden');if(c){c.textContent=String(n);c.classList.toggle('hidden',!n)}}catch(e){console.warn('Notificaciones V15',e)}}
async function v15OpenNotifications(){await v15LoadNotifications();document.getElementById('modalRoot').innerHTML=`<div class="modal-bg"><div class="modal"><div class="row-between"><h3>Notificaciones</h3><button class="btn" onclick="closeModal()">Cerrar</button></div>${state.v15Notifications.map(x=>`<div class="notice ${x.prioridad==='critica'?'error':''}"><div class="row-between"><strong>${esc(x.titulo)}</strong><small>${new Date(x.created_at).toLocaleString('es-CL')}</small></div><div style="margin-top:5px">${esc(x.mensaje||'')}</div>${!x.leida?`<button class="link-btn" onclick="v15MarkNotification('${x.id}')">Marcar como leída</button>`:''}</div>`).join('')||'<div class="empty">Sin notificaciones.</div>'}</div></div>`}
async function v15MarkNotification(id){await sb.from('notificaciones_v15').update({leida:true,leida_at:new Date().toISOString()}).eq('id',id);await v15OpenNotifications();await v15LoadNotifications()}
async function v15Notify(title,msg,priority='normal',uid=null){try{await sb.from('notificaciones_v15').insert({titulo:title,mensaje:msg,prioridad:priority,destinatario_user_id:uid,created_by:state.session?.user?.id})}catch(e){console.warn(e)}}

// ----------- Asistente mobile para formularios de Liderazgo -----------
function v15IsLeadershipModal(root){const t=(root?.querySelector('h3')?.textContent||'').toLowerCase();return /control|extintor|epp|ambiental|vehículo|vehiculo|auditiva|respiratoria/.test(t)}
function v15EnhanceLeadershipForm(form){if(!form||form.dataset.v15Wizard||!v15IsLeadershipModal(form.closest('.modal')))return;form.dataset.v15Wizard='1';form.classList.add('v15-guided');
  const candidates=[...form.querySelectorAll('input[required],select[required],textarea[required],.v12-form-table select,.v13-check-row select,.v13-fatigue-table select')].filter(x=>x.type!=='hidden'&&!x.disabled);
  candidates.forEach(el=>{if(el.tagName==='SELECT'&&!el.querySelector('option[value=""]')){const o=document.createElement('option');o.value='';o.textContent='Seleccionar…';el.insertBefore(o,el.firstChild);if(!el.dataset.v15Preserve)el.value='';}el.required=true;const row=el.closest('tr,.v13-check-row');row?.classList.add('v15-check-card');el.addEventListener('change',v15WizardProgress);el.addEventListener('input',v15WizardProgress)});
  const bar=document.createElement('div');bar.className='v15-wizard';bar.innerHTML=`<div class="v15-wizard-head"><strong>Asistente de completitud</strong><span id="v15WizardText">0 / ${candidates.length}</span></div><div class="v15-wizard-progress"><i id="v15WizardBar"></i></div><div class="v15-wizard-actions"><button type="button" class="btn" onclick="v15NextPending(this)">Siguiente pendiente →</button><span class="muted" style="align-self:center">El sistema te llevará al próximo campo sin completar.</span></div>`;form.prepend(bar);form.dataset.v15Count=String(candidates.length);v15WizardProgress(form);
  form.addEventListener('submit',ev=>{const miss=v15MissingFields(form);if(miss.length){ev.preventDefault();ev.stopImmediatePropagation();toast(`Faltan ${miss.length} campo(s) por completar.`,'error');v15FocusField(miss[0])}},true);
}
function v15MissingFields(form){return [...form.querySelectorAll('input[required],select[required],textarea[required]')].filter(el=>!el.disabled&&(!String(el.value||'').trim()||(el.type==='checkbox'&&!el.checked)))}
function v15WizardProgress(src){const form=src?.closest?src.closest('form'):src;if(!form?.dataset?.v15Wizard)return;const all=[...form.querySelectorAll('input[required],select[required],textarea[required]')].filter(x=>!x.disabled),miss=v15MissingFields(form),done=all.length-miss.length,pct=all.length?done/all.length*100:100;const txt=form.querySelector('#v15WizardText'),bar=form.querySelector('#v15WizardBar');if(txt)txt.textContent=`${done} / ${all.length}`;if(bar)bar.style.width=`${pct}%`;all.forEach(x=>x.classList.toggle('v15-required-missing',miss.includes(x)))}
function v15FocusField(el){if(!el)return;el.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>el.focus({preventScroll:true}),300)}
function v15NextPending(btn){const form=btn.closest('form'),miss=v15MissingFields(form);v15WizardProgress(form);if(!miss.length)return toast('Formulario completo. Ya puedes firmar/generar el PDF.','success');v15FocusField(miss[0])}
const v15ModalObserver=new MutationObserver(()=>{if(innerWidth<=900){const form=document.querySelector('#modalRoot .modal form:not([data-v15-wizard])');if(form)v15EnhanceLeadershipForm(form)}});v15ModalObserver.observe(document.getElementById('modalRoot'),{childList:true,subtree:true});

async function renderTurnosV15(){const p=document.getElementById('page-turnos');if(!p||!canViewV11('turnos'))return;p.innerHTML='<div class="empty">Cargando turnos y novedades…</div>';const y=new Date().getFullYear(),m=new Date().getMonth()+1;const {data,error}=await sb.from('turnos_novedades_v15').select('*,perfiles:user_id(nombre,email)').eq('anio',y).eq('mes',m).order('fecha_inicio',{ascending:true});if(error){p.innerHTML=`<div class="notice error">${esc(error.message)}<br><small>Ejecuta PATCH_V15.sql.</small></div>`;return}const rows=v15OwnFilterRows(data||[]),sum=t=>rows.filter(x=>x.tipo===t).reduce((a,x)=>a+Number(x.cantidad||0),0);p.innerHTML=`<div class="topbar"><div><h2>Turnos y Novedades</h2><p>Gestión mensual de novedades asociadas a la jornada. Solo Administrador modifica registros.</p></div><div class="actions">${isAdmin()?'<button class="btn primary" onclick="v15OpenTurnEvent()">+ Registrar novedad</button>':''}</div></div><div class="v15-summary-grid"><div class="v15-summary-card"><span>Encierro planificado</span><strong>${sum('encierro_planificado')}</strong></div><div class="v15-summary-card"><span>Encierro no planificado</span><strong>${sum('encierro_no_planificado')}</strong></div><div class="v15-summary-card"><span>Horas extra</span><strong>${sum('hora_extra')}</strong></div><div class="v15-summary-card"><span>Días adicionales</span><strong>${sum('dia_adicional')}</strong></div><div class="v15-summary-card"><span>Horas feriado</span><strong>${sum('feriado')}</strong></div><div class="v15-summary-card"><span>Suspendido encierro</span><strong>${sum('suspendido_encierro')}</strong></div></div><div class="panel"><h3>Novedades del mes actual</h3><div class="v15-calendar-list">${rows.map(x=>`<div class="v15-event"><div><b>${fmtDateCL(x.fecha_inicio)}</b>${x.fecha_fin&&x.fecha_fin!==x.fecha_inicio?`<small> → ${fmtDateCL(x.fecha_fin)}</small>`:''}</div><div><strong>${esc(x.perfiles?.nombre||'Usuario')}</strong><small>${esc(x.tipo.replaceAll('_',' '))}</small></div><div>${esc(x.motivo||'Sin motivo')}</div><div><span class="v15-type ${x.tipo.includes('encierro')?'encierro':''}">${Number(x.cantidad||0)} ${x.unidad||''}</span></div>${isAdmin()?`<button class="btn" onclick="v15DeleteTurnEvent('${x.id}')">Eliminar</button>`:''}</div>`).join('')||'<div class="empty">Sin novedades registradas este mes.</div>'}</div></div>`}
async function v15OpenTurnEvent(){if(!isAdmin())return;const {data:users}=await sb.from('perfiles').select('id,nombre,rol').eq('activo',true).in('rol',['supervisor','tecnico','prevencion','administrador']).order('nombre');const today=new Date().toISOString().slice(0,10);document.getElementById('modalRoot').innerHTML=`<div class="modal-bg"><div class="modal"><div class="row-between"><h3>Registrar novedad de turno</h3><button class="btn" onclick="closeModal()">Cerrar</button></div><form id="v15TurnForm" class="form-grid"><label class="full">Persona<select class="field" name="user_id" required><option value="">Seleccionar</option>${(users||[]).map(u=>`<option value="${u.id}">${esc(u.nombre)} · ${esc(u.rol)}</option>`).join('')}</select></label><label>Tipo<select class="field" name="tipo" required><option value="encierro_planificado">Encierro planificado</option><option value="encierro_no_planificado">Encierro no planificado</option><option value="suspendido_encierro">Turno suspendido por encierro</option><option value="hora_extra">Horas extra</option><option value="dia_adicional">Día adicional</option><option value="feriado">Horas de feriado</option></select></label><label>Cantidad<input class="field" name="cantidad" type="number" min="0" step="0.5" value="1" required></label><label>Fecha inicio<input class="field" name="fecha_inicio" type="date" value="${today}" required></label><label>Fecha término<input class="field" name="fecha_fin" type="date" value="${today}" required></label><label class="full">Motivo<textarea class="field" name="motivo" rows="3" required></textarea></label><div class="full"><button class="btn primary">Guardar novedad</button></div></form></div></div>`;document.getElementById('v15TurnForm').onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target)),d=new Date(o.fecha_inicio+'T12:00:00');o.cantidad=Number(o.cantidad)||0;o.unidad=['hora_extra','feriado'].includes(o.tipo)?'horas':'días';o.anio=d.getFullYear();o.mes=d.getMonth()+1;o.aprobado_por=state.session.user.id;o.created_by=state.session.user.id;const {error}=await sb.from('turnos_novedades_v15').insert(o);if(error)return toast(error.message,'error');await v15Notify('Novedad de turno registrada',`${o.tipo.replaceAll('_',' ')} · ${o.fecha_inicio}`,'normal',o.user_id);closeModal();await renderTurnosV15();toast('Novedad registrada','success')}}
async function v15DeleteTurnEvent(id){if(!isAdmin()||!confirm('¿Eliminar esta novedad?'))return;const {error}=await sb.from('turnos_novedades_v15').delete().eq('id',id);if(error)return toast(error.message,'error');await renderTurnosV15();toast('Registro eliminado','success')}

async function renderSolicitudesV15(){const p=document.getElementById('page-solicitudes');if(!p||!canViewV11('solicitudes'))return;p.innerHTML='<div class="empty">Cargando solicitudes…</div>';const role=v11Role(),uid=state.v15PreviewUser?.id||state.session.user.id;let q=sb.from('solicitudes_v15').select('*,perfiles:solicitante_user_id(nombre,email,rol)').order('created_at',{ascending:false});if(!['administrador','recursos_humanos'].includes(role))q=q.eq('solicitante_user_id',uid);const {data,error}=await q;if(error){p.innerHTML=`<div class="notice error">${esc(error.message)}<br><small>Ejecuta PATCH_V15.sql.</small></div>`;return}const rows=data||[];p.innerHTML=`<div class="topbar"><div><h2>Solicitudes</h2><p>Vacaciones y ausencias con trazabilidad y aprobación.</p></div><div class="actions">${['supervisor','tecnico'].includes(role)&&!v15MutationBlocked()?'<button class="btn primary" onclick="v15VacationModal()">+ Solicitar vacaciones</button>':''}${['administrador','recursos_humanos'].includes(role)&&!v15MutationBlocked()?'<button class="btn" onclick="v15MedicalLeaveModal()">+ Registrar licencia médica</button>':''}</div></div><div class="panel"><div class="v15-calendar-list">${rows.map(x=>`<div class="v15-event"><div><b>${fmtDateCL(x.fecha_inicio)}</b><small> → ${fmtDateCL(x.fecha_fin)}</small></div><div><strong>${esc(x.perfiles?.nombre||'')}</strong><small>${esc(x.tipo.replaceAll('_',' '))}</small></div><div>${esc(x.comentario||'')}</div><div><span class="status ${x.estado==='aprobada'?'ok':x.estado==='rechazada'?'bad':'warn'}">${esc(x.estado)}</span></div><div class="actions">${isAdmin()&&x.estado==='pendiente'?`<button class="btn" onclick="v15ResolveRequest('${x.id}','aprobada')">Aprobar</button><button class="btn" onclick="v15ResolveRequest('${x.id}','rechazada')">Rechazar</button>`:''}</div></div>`).join('')||'<div class="empty">Sin solicitudes.</div>'}</div></div>`}
function v15VacationModal(){const today=new Date().toISOString().slice(0,10);document.getElementById('modalRoot').innerHTML=`<div class="modal-bg"><div class="modal"><div class="row-between"><h3>Solicitud de vacaciones</h3><button class="btn" onclick="closeModal()">Cerrar</button></div><form id="v15VacForm" class="form-grid"><label>Desde<input class="field" name="fecha_inicio" type="date" min="${today}" required></label><label>Hasta<input class="field" name="fecha_fin" type="date" min="${today}" required></label><label class="full">Comentario<textarea class="field" name="comentario" rows="3"></textarea></label><div class="full"><button class="btn primary">Enviar solicitud</button></div></form></div></div>`;document.getElementById('v15VacForm').onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));o.tipo='vacaciones';o.estado='pendiente';o.solicitante_user_id=state.session.user.id;o.created_by=state.session.user.id;const {error}=await sb.from('solicitudes_v15').insert(o);if(error)return toast(error.message,'error');await v15Notify('Nueva solicitud de vacaciones',`${state.profile?.nombre||state.session.user.email} · ${o.fecha_inicio} al ${o.fecha_fin}`,'importante',null);closeModal();await renderSolicitudesV15();toast('Solicitud enviada','success')}}
async function v15MedicalLeaveModal(){if(!['administrador','recursos_humanos'].includes(v11Role()))return;const {data:users}=await sb.from('perfiles').select('id,nombre,rol').eq('activo',true).order('nombre');document.getElementById('modalRoot').innerHTML=`<div class="modal-bg"><div class="modal"><div class="row-between"><h3>Registrar licencia médica</h3><button class="btn" onclick="closeModal()">Cerrar</button></div><form id="v15LicForm" class="form-grid"><label class="full">Persona<select class="field" name="solicitante_user_id" required><option value="">Seleccionar</option>${(users||[]).map(u=>`<option value="${u.id}">${esc(u.nombre)} · ${esc(u.rol)}</option>`).join('')}</select></label><label>Desde<input class="field" name="fecha_inicio" type="date" required></label><label>Hasta<input class="field" name="fecha_fin" type="date" required></label><label class="full">Observación<textarea class="field" name="comentario" rows="3"></textarea></label><div class="full"><button class="btn primary">Registrar licencia</button></div></form></div></div>`;document.getElementById('v15LicForm').onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));o.tipo='licencia_medica';o.estado='aprobada';o.resuelto_por=state.session.user.id;o.resuelto_at=new Date().toISOString();o.created_by=state.session.user.id;const {error}=await sb.from('solicitudes_v15').insert(o);if(error)return toast(error.message,'error');closeModal();await renderSolicitudesV15();toast('Licencia médica registrada','success')}}
async function v15ResolveRequest(id,status){if(!isAdmin())return;const {data,error}=await sb.from('solicitudes_v15').update({estado:status,resuelto_por:state.session.user.id,resuelto_at:new Date().toISOString()}).eq('id',id).select('*').single();if(error)return toast(error.message,'error');if(status==='aprobada'&&data?.tipo==='vacaciones'){const d=new Date(data.fecha_inicio+'T12:00:00');await sb.from('turnos_novedades_v15').insert({user_id:data.solicitante_user_id,tipo:'vacaciones',fecha_inicio:data.fecha_inicio,fecha_fin:data.fecha_fin,cantidad:1,unidad:'período',motivo:'Vacaciones aprobadas',anio:d.getFullYear(),mes:d.getMonth()+1,aprobado_por:state.session.user.id,created_by:state.session.user.id})}await v15Notify(`Solicitud ${status}`,`${data?.tipo||'Solicitud'} · ${data?.fecha_inicio||''}`,'normal',data?.solicitante_user_id);await renderSolicitudesV15();toast(`Solicitud ${status}`,'success')}

async function v15OpenCorrectiveMobile(){if(!v15CanMobileCorrective())return;const opts=state.equipos.filter(x=>x.estado!=='retirado').map(e=>`<option value="${e.id}" data-name="${esc(e.nombre)}">${esc(e.nombre)}</option>`).join(''),today=new Date().toISOString().slice(0,10),time=new Date().toTimeString().slice(0,5);document.getElementById('modalRoot').innerHTML=`<div class="modal-bg"><div class="modal"><div class="row-between"><h3>Registrar incidente correctivo</h3><button class="btn" onclick="closeModal()">Cerrar</button></div><div class="notice">Registro desde terreno. Se incorpora a la misma tabla de averías utilizada por la importación SmartChip y alimenta MTTR, MTBF y Disponibilidad.</div><form id="v15CorrForm" class="form-grid"><label class="full">Equipo<select class="field" name="equipo_id" required><option value="">Seleccionar equipo</option>${opts}</select></label><label>Fecha inicio<input class="field" name="fecha_inicio" type="date" value="${today}" required></label><label>Hora inicio<input class="field" name="hora_inicio" type="time" value="${time}" required></label><label>Fecha término<input class="field" name="fecha_termino" type="date" value="${today}" required></label><label>Hora término<input class="field" name="hora_termino" type="time" required></label><label class="full">Descripción / diagnóstico<textarea class="field" name="observaciones" rows="4" required></textarea></label><label class="full">Causa probable<textarea class="field" name="causa" rows="3"></textarea></label><label class="full">Acción correctiva<textarea class="field" name="accion" rows="3"></textarea></label><label>Estado final<select class="field" name="estado_final" required><option value="Operativo">Operativo</option><option value="Fuera de servicio">Fuera de servicio</option><option value="Operativo con observaciones">Operativo con observaciones</option></select></label><label>N.º guía / referencia<input class="field" name="numero_guia" placeholder="Opcional"></label><div class="full"><button class="btn primary">Registrar incidente</button></div></form></div></div>`;document.getElementById('v15CorrForm').onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target)),eq=state.equipos.find(x=>String(x.id)===String(o.equipo_id));const dur=calcDuracionMin(o.fecha_inicio,o.hora_inicio,o.fecha_termino,o.hora_termino);if(dur==null)return toast('Revisa fecha y hora de inicio/término.','error');const obs=[o.observaciones,o.causa?`Causa probable: ${o.causa}`:'',o.accion?`Acción correctiva: ${o.accion}`:''].filter(Boolean).join('\n');const payload={equipo_id:o.equipo_id,equipo_original:eq?.nombre||'',numero_guia:o.numero_guia||`MOV-${Date.now()}`,supervisor_tecnico:state.profile?.nombre||state.session.user.email,fecha_inicio:o.fecha_inicio,hora_inicio:o.hora_inicio,fecha_termino:o.fecha_termino,hora_termino:o.hora_termino,estado_final:o.estado_final,observaciones:obs,duracion_minutos:dur,created_by:state.session.user.id};payload.clave_unica=makeClave(payload);const {error}=await sb.from('averias').upsert(payload,{onConflict:'clave_unica',ignoreDuplicates:true});if(error)return toast(error.message,'error');closeModal();await loadCorrectivo();toast('Incidente registrado','success')}}

/* ---------- Alertas sincronizadas escritorio/mobile ---------- */
let v152AlertFilter='todas';
let v152ShowAll=false;
function v152AlertLevel(days){
  if(days==null)return 'info';
  if(days<0||days<=30)return 'critical';
  if(days<=60)return 'soon';
  return 'info';
}
function v152AlertKindLabel(k){
  return ({dotacion:'Dotación',cumpleanos:'Cumpleaños',feriados:'Feriados',recordatorios:'Recordatorios'})[k]||k;
}
function v152RenderAlerts(items){
  const box=document.getElementById('homeImpactAlerts');
  if(!box)return;
  const sorted=[...items].sort((a,b)=>{
    if(a.manual!==b.manual){
      // Mantener recordatorios manuales visibles, pero respetando la urgencia.
      const ad=a.days??99999,bd=b.days??99999;
      if(Math.abs(ad-bd)>60)return ad-bd;
    }
    return (a.days??99999)-(b.days??99999);
  });
  const filtered=sorted.filter(a=>v152AlertFilter==='todas'||a.kind===v152AlertFilter);
  const manual=filtered.filter(a=>a.manual);
  let visible=v152ShowAll?filtered:filtered.slice(0,5);
  // Si el usuario creó recordatorios y ninguno quedó en el Top 5, mostrar el más próximo
  // para que no parezca perdido entre dispositivos.
  if(!v152ShowAll && manual.length && !visible.some(x=>x.manual)){
    visible=[...visible.slice(0,4),manual[0]];
    visible.sort((a,b)=>(a.days??99999)-(b.days??99999));
  }
  const filters=[['todas','Todas'],['dotacion','Dotación'],['cumpleanos','Cumpleaños'],['feriados','Feriados'],['recordatorios','Recordatorios']];
  box.className='v152-alert-wrap';
  box.innerHTML=`
    <div class="v152-alert-header">
      <div><h3>Alertas y próximos hitos</h3><span class="v152-alert-count">${filtered.length} evento(s)</span></div>
      ${filtered.length>5?`<button class="btn" onclick="v152ShowAll=!v152ShowAll;renderHomeAlertsV95()">${v152ShowAll?'Ver menos':'Ver todas'}</button>`:''}
    </div>
    <div class="v152-alert-filterbar">
      ${filters.map(([k,l])=>`<button class="btn ${v152AlertFilter===k?'primary':''}" onclick="v152AlertFilter='${k}';v152ShowAll=false;renderHomeAlertsV95()">${l}</button>`).join('')}
    </div>
    <div class="v152-alert-list">
      ${visible.map(a=>{
        const lv=v152AlertLevel(a.days);
        const canDelete=a.manual && (isAdmin() || a.creator===state.session?.user?.id);
        return `<div class="v152-alert-card ${lv} ${a.manual?'manual':''}">
          <div class="v152-alert-icon">${a.icon||'🔔'}</div>
          <div class="v152-alert-main"><b>${esc(a.title||'Alerta')}</b><small>${esc(a.txt||'')}</small></div>
          <div class="v152-alert-days"><b>${a.days==null?'—':a.days<0?Math.abs(a.days):a.days}</b><small>${a.days<0?'días vencido':'días'}</small></div>
          ${canDelete?`<button class="v152-alert-delete" title="Eliminar recordatorio" onclick="deleteReminderV95('${a.id}')">×</button>`:''}
        </div>`;
      }).join('')||'<div class="empty">Sin alertas próximas.</div>'}
    </div>`;
}
renderHomeAlertsV95=async function(){
  const box=document.getElementById('homeImpactAlerts');if(!box)return;
  const items=[];
  try{
    const {data:b}=await sb.rpc('proximos_cumpleanos_v95');
    const x=(b||[])[0];
    if(x)items.push({kind:'cumpleanos',icon:'🎂',title:'Cumpleaños',txt:`${x.nombre} · ${v95TextDate(x.fecha_evento)}`,days:Number(x.dias_restantes)});
  }catch(e){console.warn('cumpleaños',e)}
  try{
    const now=new Date();now.setHours(0,0,0,0);
    const hol=(typeof CHILE_HOLIDAYS!=='undefined'?CHILE_HOLIDAYS:[])
      .map(([date,name])=>({date,name,days:Math.round((new Date(date+'T00:00:00')-now)/86400000)}))
      .filter(x=>x.days>=0).sort((a,b)=>a.days-b.days)[0];
    if(hol)items.push({kind:'feriados',icon:'🇨🇱',title:'Próximo feriado',txt:`${hol.name} · ${fmtDateCL(hol.date)}`,days:hol.days});
  }catch(e){}
  try{
    let q=await sb.rpc('dotacion_consulta_v14');
    if(q.error)q=await sb.from('dotacion_contrato').select('*');
    if(!q.error){
      const ex=[];
      (q.data||[]).filter(p=>p.estado==='activo').forEach(p=>
        (typeof V13_EXP_FIELDS!=='undefined'?V13_EXP_FIELDS:[]).forEach(([k,l])=>{
          if(k==='fecha_exp_licencia_interna'&&typeof v14HasInternalLicense==='function'&&!v14HasInternalLicense(p))return;
          if(p[k])ex.push({name:p.nombre,label:l,date:p[k],days:v12Days(p[k])});
        })
      );
      ex.sort((a,b)=>a.days-b.days).slice(0,8).forEach(x=>items.push({
        kind:'dotacion',icon:'📄',title:x.label,txt:`${x.name} · ${v95TextDate(x.date)}`,days:x.days
      }));
    }
  }catch(e){console.warn('dotacion alertas',e)}
  try{
    const today=new Date().toISOString().slice(0,10);
    const {data:r}=await sb.from('recordatorios_alertas').select('*')
      .eq('activo',true).gte('fecha_evento',today).order('fecha_evento',{ascending:true}).limit(20);
    (r||[]).forEach(x=>items.push({
      kind:'recordatorios',manual:true,id:x.id,creator:x.created_by,
      icon:x.tipo==='alerta'?'⚠️':x.tipo==='hito'?'◆':'🔔',
      title:x.titulo||'Recordatorio',
      txt:`${x.descripcion||x.tipo||'Recordatorio'} · ${v95TextDate(x.fecha_evento)}`,
      days:v95Days? v95Days(x.fecha_evento):v12Days(x.fecha_evento)
    }));
  }catch(e){console.warn('recordatorios',e)}
  v152RenderAlerts(items);
  v13CleanHomeLayout?.();
};

    </form>
  </div></div>`;
  document.getElementById('v152RequestForm').onsubmit=async e=>{
    e.preventDefault();
    const o=Object.fromEntries(new FormData(e.target));
    if(o.fecha_fin<o.fecha_inicio)return toast('La fecha término no puede ser anterior a la fecha de inicio.','error');

    if(error)return toast(error.message,'error');
    await v15Notify('Nueva solicitud',`${state.profile?.nombre||state.session.user.email} · ${v152RequestLabel(o.tipo)} · ${o.fecha_inicio} al ${o.fecha_fin}`,'importante',null);
    closeModal();
    await renderSolicitudesV15();
    toast('Solicitud enviada','success');
  };
}

      </div>`).join('')||`<div class="empty"><b>No tienes solicitudes registradas.</b><div class="muted" style="margin-top:6px">Usa “+ Nueva solicitud” para iniciar una.</div></div>`}

function v153RenderAlerts(items){
  const box=document.getElementById('homeImpactAlerts');if(!box)return;

  let visible=v152ShowAll?filtered:filtered.slice(0,5);
  const manual=filtered.filter(x=>x.manual);
  if(!v152ShowAll && manual.length && !visible.some(x=>x.manual)){
    visible=[...visible.slice(0,4),manual[0]].sort((a,b)=>(a.days??99999)-(b.days??99999));
  }
  const filters=[['todas','Todas'],['dotacion','Dotación'],['cumpleanos','Cumpleaños'],['feriados','Feriados'],['recordatorios','Recordatorios']];
  box.innerHTML=`
    <div class="v153-home-head">

      <div class="v153-home-actions">
        <button class="btn primary" onclick="openReminderV95()">+ Nuevo recordatorio / alerta</button>
        ${filtered.length>5?`<button class="btn" onclick="v152ShowAll=!v152ShowAll;renderHomeAlertsV95()">${v152ShowAll?'Ver menos':'Ver todas'}</button>`:''}
      </div>
    </div>
    <div class="v152-alert-filterbar">
      ${filters.map(([k,l])=>`<button class="btn ${v152AlertFilter===k?'primary':''}" onclick="v152AlertFilter='${k}';v152ShowAll=false;renderHomeAlertsV95()">${l}</button>`).join('')}
    </div>
    <div class="v152-alert-list">
      ${visible.map(a=>{
        const lv=v152AlertLevel(a.days);
        const canDelete=a.manual&&(isAdmin()||a.creator===state.session?.user?.id);
        return `<div class="v152-alert-card ${lv} ${a.manual?'manual':''}">
          <div class="v152-alert-icon">${a.icon||'🔔'}</div>
          <div class="v152-alert-main"><b>${esc(a.title||'Alerta')}</b><small>${esc(a.txt||'')}</small>${a.manual?`<span class="v153-scope">${esc(v153ScopeLabel(a.scope))}</span>`:''}</div>

renderHomeAlertsV95=async function(){
  const box=document.getElementById('homeImpactAlerts');if(!box)return;
  const items=[];
  try{
    const {data:b,error}=await sb.rpc('proximos_cumpleanos_v153');
    if(error)throw error;
    (b||[]).forEach(x=>items.push({
      kind:'cumpleanos',icon:'🎂',title:'Cumpleaños',
      txt:`${x.nombre} · ${v95TextDate(x.fecha_evento)}`,
      days:Number(x.dias_restantes)
    }));
  }catch(e){console.warn('cumpleaños v153',e)}
  try{
    const now=new Date();now.setHours(0,0,0,0);
    const hol=(typeof CHILE_HOLIDAYS!=='undefined'?CHILE_HOLIDAYS:[])
      .map(([date,name])=>({date,name,days:Math.round((new Date(date+'T00:00:00')-now)/86400000)}))
      .filter(x=>x.days>=0).sort((a,b)=>a.days-b.days)[0];
    if(hol)items.push({kind:'feriados',icon:'🇨🇱',title:'Próximo feriado',txt:`${hol.name} · ${fmtDateCL(hol.date)}`,days:hol.days});
  }catch(e){}
  try{
    let q=await sb.rpc('dotacion_consulta_v14');
    if(q.error)q=await sb.from('dotacion_contrato').select('*');
    if(!q.error){
      const exp=[];
      (q.data||[]).filter(p=>p.estado==='activo').forEach(p=>
        (typeof V13_EXP_FIELDS!=='undefined'?V13_EXP_FIELDS:[]).forEach(([k,l])=>{
          if(k==='fecha_exp_licencia_interna'&&typeof v14HasInternalLicense==='function'&&!v14HasInternalLicense(p))return;
          if(p[k])exp.push({name:p.nombre,label:l,date:p[k],days:v12Days(p[k])});
        })
      );
      exp.sort((a,b)=>a.days-b.days).slice(0,8).forEach(x=>items.push({
        kind:'dotacion',icon:'📄',title:x.label,txt:`${x.name} · ${v95TextDate(x.date)}`,days:x.days
      }));
    }
  }catch(e){console.warn('dotacion alertas',e)}
  try{
    const {data:r,error}=await sb.rpc('recordatorios_visibles_v153');
    if(error)throw error;
    (r||[]).forEach(x=>items.push({
      kind:'recordatorios',manual:true,id:x.id,creator:x.created_by,scope:x.visibilidad,
      icon:x.tipo==='alerta'?'⚠️':x.tipo==='hito'?'◆':'🔔',
      title:x.titulo||'Recordatorio',
      txt:`${x.descripcion||x.tipo||'Recordatorio'} · ${v95TextDate(x.fecha_evento)}`,
      days:v95Days? v95Days(x.fecha_evento):v12Days(x.fecha_evento)
    }));
  }catch(e){console.warn('recordatorios v153',e)}
  v153RenderAlerts(items);
};

function v153GenerateCorrectivoReport(opt){
  const C=ensurePdf();if(!C)return toast('No se pudo cargar el generador PDF','error');
  let rows=[...(state.correctivo||[])];const eq=document.getElementById('corrEquipo')?.value||'';if(eq)rows=rows.filter(r=>r.equipo===eq);
  const valid=rows.filter(r=>!r.excluir_kpi),hours=valid.reduce((a,r)=>a+(r.duracion_horas||0),0),op=valid.length?valid.filter(r=>r.estado_normalizado==='Operativo').length/valid.length*100:0,rel=calcReliabilityKpis(valid);
  const month=MONTHS_ES[(state.correctivoMonth||1)-1],doc=new C({orientation:'landscape',unit:'mm',format:'a4'});
  pdfHeader(doc,'Informe de Confiabilidad',`${month} ${state.correctivoYear} · ${eq||'Todos los equipos'}`);
  let y=46;
  if(opt.resumen){
    doc.setFontSize(10);doc.text(`Período analizado: ${month} ${state.correctivoYear}`,14,y);y+=7;
    doc.text(`Equipos filtrados: ${eq||'Todos'}`,14,y);y+=8;
  }
  if(opt.kpis){
    doc.setFontSize(10);
    const vals=[`Atenciones: ${valid.length}`,`Horas: ${hours.toFixed(1)} h`,`Cierre operativo: ${op.toFixed(0)}%`,`MTTR: ${rel.ready?rel.mttr.toFixed(1)+' h':'N/D'}`,`MTBF: ${rel.ready?rel.mtbf.toFixed(1)+' h':'N/D'}`,`Disponibilidad: ${rel.ready?rel.disponibilidad.toFixed(1)+'%':'N/D'}`];
    doc.autoTable({startY:y,body:[vals.slice(0,3),vals.slice(3)],theme:'grid',styles:{fontSize:9}});y=doc.lastAutoTable.finalY+6;
  }
  if(opt.graficos){
    ['chartEq','chartHours','chartTrend'].forEach((id,i)=>{
      const c=document.getElementById(id);if(!c)return;
      if(y>150){doc.addPage();y=20}
      try{const img=c.toDataURL('image/png',1);doc.addImage(img,'PNG',14,y,84,48);if(i%2===0){const next=document.getElementById(['chartHours','chartTrend'][i/2|0]);}y+=54}catch(_){}
    });
  }
  if(opt.historial){
    if(y>150){doc.addPage();y=20}
    doc.autoTable({startY:y,head:[['Fecha','Equipo','Guía','Responsable','Duración','Estado','Observación']],body:rows.map(r=>[r.fecha_inicio||'',r.equipo||'',r.guia||'—',r.responsable||'—',fmtH(r.duracion_horas),r.estado_normalizado||'',r.observaciones||'']),styles:{fontSize:7,cellPadding:2},columnStyles:{6:{cellWidth:75}}});y=doc.lastAutoTable.finalY+6;
  }
  if(opt.metodologia){
    if(y>160){doc.addPage();y=20}
    doc.setFontSize(8);doc.text('MTTR = horas totales de intervención / fallas válidas. MTBF = horas operativas / fallas válidas. Disponibilidad = horas operativas / horas calendario × 100.',14,y,{maxWidth:260});
  }
  closeModal();doc.save(`Confiabilidad_${state.correctivoYear}_${String(state.correctivoMonth).padStart(2,'0')}.pdf`);
}

function v154WordStats(rows){const stop=new Set(['para','con','del','las','los','una','uno','por','que','se','sin','falla','equipo','servicio','revisa','revisión','cambio','realiza','realizado']),map={};rows.forEach(r=>String(r.observaciones||'').toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,' ').split(/\s+/).filter(w=>w.length>4&&!stop.has(w)).forEach(w=>map[w]=(map[w]||0)+1));return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,8)}
v153GenerateCorrectivoReport=function(opt){const C=ensurePdf();if(!C)return;let rows=[...(state.correctivo||[])];const eq=document.getElementById('corrEquipo')?.value||'';if(eq)rows=rows.filter(r=>r.equipo===eq);const valid=rows.filter(r=>!r.excluir_kpi),hours=valid.reduce((a,r)=>a+(r.duracion_horas||0),0),rel=calcReliabilityKpis(valid),month=MONTHS_ES[(state.correctivoMonth||1)-1],doc=new C({orientation:'landscape',unit:'mm',format:'a4'});pdfHeader(doc,'Informe Técnico de Confiabilidad',`${month} ${state.correctivoYear} · ${eq||'Todos los equipos'}`);let y=46,byEq={};valid.forEach(r=>{const k=r.equipo||'Sin equipo',o=byEq[k]||(byEq[k]={n:0,h:0});o.n++;o.h+=Number(r.duracion_horas||0)});const rank=Object.entries(byEq).sort((a,b)=>b[1].n-a[1].n),top=rank[0];doc.autoTable({startY:y,body:[[ `Atenciones: ${valid.length}`,`Horas: ${hours.toFixed(1)} h`,`MTTR: ${rel.ready?rel.mttr.toFixed(1)+' h':'N/D'}`],[`MTBF: ${rel.ready?rel.mtbf.toFixed(1)+' h':'N/D'}`,`Disponibilidad: ${rel.ready?rel.disponibilidad.toFixed(1)+'%':'N/D'}`,`Más recurrente: ${top?top[0]:'N/D'}`]],theme:'grid',styles:{fontSize:8}});y=doc.lastAutoTable.finalY+7;let cum=0,total=valid.length||1;doc.autoTable({startY:y,head:[['#','Equipo','Eventos','Horas','%','% acum.']],body:rank.slice(0,10).map(([n,o],i)=>{cum+=o.n;return[i+1,n,o.n,o.h.toFixed(1),(o.n/total*100).toFixed(1)+'%',(cum/total*100).toFixed(1)+'%']}),styles:{fontSize:7.5}});y=doc.lastAutoTable.finalY+7;if(y>145){doc.addPage();y=20}const words=v154WordStats(valid),hyp=[];if(top&&top[1].n>=2)hyp.push(`Recurrencia concentrada en ${top[0]}: ${top[1].n} eventos.`);if(words.length)hyp.push(`Términos recurrentes: ${words.slice(0,5).map(x=>x[0]+' ('+x[1]+')').join(', ')}.`);if(rel.ready&&rel.mttr>4)hyp.push(`MTTR elevado (${rel.mttr.toFixed(1)} h): revisar diagnóstico, repuestos y escalamiento.`);if(!hyp.length)hyp.push('No existe recurrencia suficiente para una hipótesis robusta de causa raíz.');doc.autoTable({startY:y,head:[['Análisis preliminar de causa raíz']],body:hyp.map(x=>[x]),styles:{fontSize:8}});y=doc.lastAutoTable.finalY+6;doc.autoTable({startY:y,head:[['Acciones recomendadas']],body:[['Aplicar 5 Porqués a fallas repetitivas.'],['Separar causa técnica, operación, energía/infraestructura, ambiente y terceros.'],['Revisar repuestos críticos y acciones preventivas para reducir recurrencia y MTTR.']],styles:{fontSize:8}});y=doc.lastAutoTable.finalY+7;if(opt.graficos)['chartEq','chartHours','chartTrend'].forEach(id=>{const c=document.getElementById(id);if(!c)return;if(y>145){doc.addPage();y=20}try{doc.addImage(c.toDataURL('image/png',1),'PNG',14,y,110,55);y+=61}catch(_){}});if(opt.historial){if(y>145){doc.addPage();y=20}doc.autoTable({startY:y,head:[['Fecha','Equipo','Guía','Responsable','Duración','Estado','Observación']],body:rows.map(r=>[r.fecha_inicio||'',r.equipo||'',r.guia||'—',r.responsable||'—',fmtH(r.duracion_horas),r.estado_normalizado||'',r.observaciones||'']),styles:{fontSize:6.8},columnStyles:{6:{cellWidth:75}}})}doc.save(`Confiabilidad_Tecnica_${state.correctivoYear}_${String(state.correctivoMonth).padStart(2,'0')}.pdf`);closeModal()}

renderContractDotacion=function(){const rows=state.contractData?.dotacion||[],tech=rows.filter(x=>x.area==='tecnico'),adm=rows.filter(x=>x.area==='administrativo_apoyo'),prev=rows.filter(x=>x.area==='prevencion'),sups=tech.filter(x=>v13Norm(x.cargo).includes('supervisor'));document.getElementById('contractContent').innerHTML=`${isAdmin()?'<div class="tab-actions"><button class="btn primary" onclick="openPersonModal()">+ Agregar persona / vacante</button></div>':''}<div class="panel"><h3>Personal Técnico · Supervisores y equipos asociados</h3>${sups.map((s,i)=>{const crew=tech.filter(t=>t.id!==s.id&&t.estado!=='vacante'&&v13SupervisorNameMatch(t.supervisor_nombre,s.nombre));return `<details class="v151-crew"><summary><div class="v154-group-summary"><b>Grupo ${i+1}</b><span>1 Supervisor · ${crew.length} Técnico${crew.length===1?'':'s'}</span></div></summary><div class="v151-person-list">${v154PersonRow(s)}${crew.map(v154PersonRow).join('')}</div></details>`}).join('')}</div><div class="two-col"><div class="panel"><h3>Administrativo / Apoyo</h3><div class="v151-person-list">${adm.map(v154PersonRow).join('')||'<div class="empty">Sin registros.</div>'}</div></div><div class="panel"><h3>Prevención de Riesgos</h3><div class="v151-person-list">${prev.map(v154PersonRow).join('')||'<div class="empty">Sin registros.</div>'}</div></div></div>`};renderContractDotacionV151=renderContractDotacion

/* ---------- Informe correctivo: títulos, ejes y análisis técnico ---------- */
function v155EquipmentContext(name){
  const n=String(name||'').toUpperCase();
  if(n.includes('ASEA')) return 'equipo de transporte vertical con sistemas electromecánicos donde la recurrencia debe correlacionarse con puertas, contactos de seguridad, guiado, motorización y condiciones ambientales';
  if(n.includes('ALIMAK')) return 'jaula de cremallera y piñón, sensible a condición de piñones, guiado, limitador, contactores y contaminación por polvo';
  if(n.includes('3700')||n.includes('OTIS')) return 'ascensor electromecánico/electrónico donde deben revisarse sistemas de puertas, alimentación, control y señalización';
  if(n.includes('EILA')) return 'ascensor de edificio con foco en disponibilidad, puertas, maniobra y seguridad de operación';
  if(n.includes('HILTON')) return 'montacarga/ascensor de servicio donde la disponibilidad depende de energía, puertas, control y condición mecánica';
  if(n.includes('PTP')) return 'equipo de izaje/transporte vertical asociado a condiciones industriales de operación';
  return 'equipo de transporte vertical; el análisis debe vincular frecuencia, duración, recurrencia y subsistema intervenido';
}

function v155TechAnalysis(metric, rows, eq){
  const valid=rows.filter(r=>!r.excluir_kpi);
  const byEq={};
  valid.forEach(r=>{
    const k=r.equipo||'Sin equipo';
    const o=byEq[k]||(byEq[k]={n:0,h:0,obs:[]});
    o.n++;o.h+=Number(r.duracion_horas||0);
    if(r.observaciones)o.obs.push(String(r.observaciones));
  });
  const rankN=Object.entries(byEq).sort((a,b)=>b[1].n-a[1].n);
  const rankH=Object.entries(byEq).sort((a,b)=>b[1].h-a[1].h);
  const topN=rankN[0], topH=rankH[0];
  const rel=calcReliabilityKpis(valid);
  const ctx=v155EquipmentContext(eq||topN?.[0]||'');

  if(metric==='failures'){
    if(!topN)return 'No existen fallas válidas suficientes para establecer una concentración por equipo.';
    const pct=(topN[1].n/(valid.length||1)*100).toFixed(1);
    return `${topN[0]} concentra ${topN[1].n} eventos, equivalentes al ${pct}% de las fallas válidas del período. En términos técnicos, esta concentración debe revisarse considerando que se trata de ${v155EquipmentContext(topN[0])}. La recurrencia por sí sola no confirma una causa raíz; se debe verificar si los eventos comparten subsistema, componente y modo de falla.`;
  }
  if(metric==='hours'){
    if(!topH)return 'No existen horas válidas suficientes para comparar tiempos de intervención.';
    const avg=topH[1].n?topH[1].h/topH[1].n:0;
    return `${topH[0]} acumula ${topH[1].h.toFixed(1)} h de intervención, con un promedio de ${avg.toFixed(1)} h por evento. Esto indica que su impacto operacional está asociado ${topH[1].n>1?'tanto a recurrencia como a duración de las intervenciones':'principalmente a la duración de una o pocas intervenciones'}. Para ${v155EquipmentContext(topH[0])}, corresponde revisar tiempos de diagnóstico, disponibilidad de repuestos, accesibilidad y complejidad del trabajo antes de atribuir el resultado a una degradación del equipo.`;
  }
  if(metric==='mttr'){
    if(!rel.ready)return 'La cantidad o calidad de datos no permite calcular un MTTR representativo para el período.';
    return `El MTTR calculado es ${rel.mttr.toFixed(1)} h. Este valor representa el tiempo medio de recuperación de las fallas válidas. Para ${ctx}, un incremento sostenido del MTTR debe contrastarse con la complejidad de las intervenciones, tiempos de espera por repuestos, diagnóstico y condiciones de acceso. Con un único período no corresponde afirmar deterioro sin observar tendencia histórica.`;
  }
  if(metric==='mtbf'){
    if(!rel.ready)return 'La cantidad o calidad de datos no permite calcular un MTBF representativo para el período.';
    return `El MTBF calculado es ${rel.mtbf.toFixed(1)} h. Técnicamente, un valor bajo frente a períodos anteriores indicaría menor separación entre fallas y pérdida de confiabilidad; sin comparación histórica no se debe afirmar deterioro. Para ${ctx}, la interpretación debe complementarse identificando si los eventos provienen del mismo subsistema o de causas independientes.`;
  }
  if(metric==='availability'){
    if(!rel.ready)return 'No existen antecedentes suficientes para obtener una disponibilidad representativa.';
    return `La disponibilidad calculada es ${rel.disponibilidad.toFixed(1)}%. Este indicador está condicionado por la frecuencia de eventos y, especialmente, por sus tiempos de recuperación. En ${ctx}, una disponibilidad reducida debe analizarse junto con MTTR, MTBF y duración acumulada de indisponibilidad, evitando interpretar el porcentaje de manera aislada.`;
  }
  return 'Los datos disponibles no permiten emitir un análisis técnico específico adicional.';
}

function v155PdfChartBlock(doc, canvasId, title, xLabel, yLabel, analysis, y){
  const c=document.getElementById(canvasId);
  if(!c)return y;
  if(y>120){doc.addPage();y=20}
  doc.setFontSize(11);doc.text(title,14,y);y+=5;
  doc.setFontSize(8);doc.text(`Eje X: ${xLabel}`,14,y);doc.text(`Eje Y: ${yLabel}`,105,y);y+=4;
  try{doc.addImage(c.toDataURL('image/png',1),'PNG',14,y,118,58)}catch(_){}
  y+=63;
  doc.setFontSize(8);doc.setTextColor(40);
  const lines=doc.splitTextToSize(`Análisis técnico: ${analysis}`,260);
  doc.text(lines,14,y);y+=lines.length*4+6;
  return y;
}

v153GenerateCorrectivoReport=function(opt){
  const C=ensurePdf();if(!C)return toast('No se pudo cargar el generador PDF','error');
  let rows=[...(state.correctivo||[])];
  const eq=document.getElementById('corrEquipo')?.value||'';
  if(eq)rows=rows.filter(r=>r.equipo===eq);
  const valid=rows.filter(r=>!r.excluir_kpi);
  const hours=valid.reduce((a,r)=>a+Number(r.duracion_horas||0),0);
  const rel=calcReliabilityKpis(valid);
  const month=MONTHS_ES[(state.correctivoMonth||1)-1];
  const doc=new C({orientation:'landscape',unit:'mm',format:'a4'});
  pdfHeader(doc,'Informe Técnico de Confiabilidad',`${month} ${state.correctivoYear} · ${eq||'Todos los equipos'}`);
  let y=46;

  const byEq={};
  valid.forEach(r=>{
    const k=r.equipo||'Sin equipo';
    const o=byEq[k]||(byEq[k]={n:0,h:0});
    o.n++;o.h+=Number(r.duracion_horas||0);
  });
  const rank=Object.entries(byEq).sort((a,b)=>b[1].n-a[1].n);
  const top=rank[0];

  doc.setFontSize(11);doc.text('Resumen ejecutivo',14,y);y+=5;
  doc.autoTable({
    startY:y,
    body:[
      [`Atenciones válidas: ${valid.length}`,`Horas de intervención: ${hours.toFixed(1)} h`,`MTTR: ${rel.ready?rel.mttr.toFixed(1)+' h':'N/D'}`],
      [`MTBF: ${rel.ready?rel.mtbf.toFixed(1)+' h':'N/D'}`,`Disponibilidad: ${rel.ready?rel.disponibilidad.toFixed(1)+'%':'N/D'}`,`Mayor recurrencia: ${top?top[0]:'N/D'}`]
    ],
    theme:'grid',styles:{fontSize:8}
  });
  y=doc.lastAutoTable.finalY+8;

  if(opt.graficos){
    y=v155PdfChartBlock(doc,'chartEq','Distribución de fallas por equipo','Equipo','Número de fallas [eventos]',v155TechAnalysis('failures',rows,eq),y);
    y=v155PdfChartBlock(doc,'chartHours','Horas de intervención por equipo','Equipo','Horas de intervención [h]',v155TechAnalysis('hours',rows,eq),y);
    y=v155PdfChartBlock(doc,'chartTrend','Tendencia de indicadores de confiabilidad','Período','Indicador de confiabilidad',v155TechAnalysis('mttr',rows,eq)+' '+v155TechAnalysis('mtbf',rows,eq),y);
  }

  if(y>120){doc.addPage();y=20}
  doc.setFontSize(11);doc.text('Análisis de disponibilidad',14,y);y+=5;
  doc.setFontSize(8);
  const avLines=doc.splitTextToSize(v155TechAnalysis('availability',rows,eq),265);
  doc.text(avLines,14,y);y+=avLines.length*4+7;

  let cum=0,total=valid.length||1;
  const pareto=rank.slice(0,10).map(([name,o],i)=>{cum+=o.n;return [i+1,name,o.n,o.h.toFixed(1),(o.n/total*100).toFixed(1)+'%',(cum/total*100).toFixed(1)+'%']});
  doc.setFontSize(11);doc.text('Pareto de recurrencia por equipo',14,y);y+=4;
  doc.autoTable({
    startY:y,
    head:[['#','Equipo','Eventos','Horas','% eventos','% acumulado']],
    body:pareto.length?pareto:[['—','Sin datos','0','0','0%','0%']],
    styles:{fontSize:7.5}
  });
  y=doc.lastAutoTable.finalY+6;
  doc.setFontSize(8);
  const pTxt=top?`${top[0]} es el equipo con mayor recurrencia del período. El Pareto permite priorizar equipos, pero no reemplaza el análisis de modo de falla. La prioridad técnica debe considerar frecuencia, duración, criticidad operacional y si los eventos corresponden al mismo subsistema.`:'No hay eventos suficientes para construir una priorización Pareto representativa.';
  doc.text(doc.splitTextToSize('Análisis técnico: '+pTxt,265),14,y);
  y+=14;

  if(opt.historial){
    if(y>120){doc.addPage();y=20}
    doc.autoTable({
      startY:y,
      head:[['Fecha','Equipo','Guía','Responsable','Duración','Estado','Observación']],
      body:rows.map(r=>[r.fecha_inicio||'',r.equipo||'',r.guia||'—',r.responsable||'—',fmtH(r.duracion_horas),r.estado_normalizado||'',r.observaciones||'']),
      styles:{fontSize:6.8},columnStyles:{6:{cellWidth:75}}
    });
  }

  doc.save(`Stainher_App_Confiabilidad_${state.correctivoYear}_${String(state.correctivoMonth).padStart(2,'0')}.pdf`);
  closeModal();
}

/* ---------- Envío documental genérico ---------- */
async function v155SendDocument({pdfDoc,fileName,subject,documentType,module,recordId,to=[]}){
  if(!pdfDoc)throw new Error('PDF no disponible');
  const pdfBase64=pdfDoc.output('datauristring').split(',')[1];
  const payload={
    file_name:fileName,
    subject,
    document_type:documentType,
    module,
    record_id:recordId||null,
    recipients:to,
    pdf_base64:pdfBase64
  };
  const {data,error}=await sb.functions.invoke('send-document-v155',{body:payload});
  if(error)throw error;
  return data;
}

function v156NormName(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim()}
function v156UserDotationIdentity(rows){
  const name=v156NormName(state.profile?.nombre||state.session?.user?.user_metadata?.nombre||'');
  return rows.find(p=>v156NormName(p.nombre)===name)||null;
}
function v156VisibleDotation(rows){
  const role=v11Role();
  if(!['supervisor','tecnico'].includes(role))return rows;
  const me=v156UserDotationIdentity(rows);
  if(!me)return [];
  if(role==='supervisor'){
    return rows.filter(p=>p.id===me.id||v156NormName(p.supervisor_nombre)===v156NormName(me.nombre));

  const supervisor=me.supervisor_nombre;
  if(!supervisor)return [me];
  return rows.filter(p=>v156NormName(p.nombre)===v156NormName(supervisor)||v156NormName(p.supervisor_nombre)===v156NormName(supervisor));

/* =========================================================
   CONTROL 4 PAGINADO Y UN SOLO SISTEMA DE COMPLETITUD
========================================================= */
function v156VehGroups(){
  const src=V13_VEH_GROUPS||[];
  const groups={general:[],exterior:[],interior:[],equipamiento:[]};
  src.forEach(([name,items])=>{
    const n=v13Norm(name);
    if(/exterior|neumatic|luces|vidrio|espejo|carroceria/.test(n))groups.exterior.push([name,items]);
    else if(/interior|cinturon|asiento|tablero|panel|bocina|limpiaparabris/.test(n))groups.interior.push([name,items]);
    else if(/equip|emerg|extintor|botiquin|triangulo|herramient/.test(n))groups.equipamiento.push([name,items]);
    else groups.general.push([name,items]);
  });
  // si las categorías de origen no vienen separadas, repartir por nombre de ítem
  if(!groups.exterior.length&&!groups.interior.length&&!groups.equipamiento.length){
    const flat=src.flatMap(([g,items])=>items.map(x=>[g,x]));
    groups.general=[];
    flat.forEach(([g,item])=>{
      const n=v13Norm(item);
      if(/luz|faro|neumatic|espejo|parabris|carroceria|patente|puerta|vidrio/.test(n))groups.exterior.push([g,[item]]);
      else if(/cinturon|asiento|tablero|bocina|freno mano|limpia|calefaccion|interior/.test(n))groups.interior.push([g,[item]]);
      else if(/extintor|botiquin|triangulo|gata|herramient|chaleco|cuña|emergencia/.test(n))groups.equipamiento.push([g,[item]]);
      else groups.general.push([g,[item]]);
    });
  }
  return groups;
}
function v156VehChoice(base,label){
  return `<label class="v154-check-choice"><input type="checkbox" name="${base}" value="${label}">${label}</label>`;
}
function v156VehRow(section,idx,item){
  const base=`v156_${section}_${idx}`;
  return `<div class="v154-check-row v156-check-row" data-v156-check="${base}" data-label="${esc(item)}">
    <span>${esc(item)}</span>
    ${v156VehChoice(base,'Bueno')}${v156VehChoice(base,'Malo')}${v156VehChoice(base,'N/A')}
  </div>`;
}
function v156RenderSectionGroups(section,groups){
  let i=0;
  return groups.map(([g,items])=>`<div class="v154-check-group">
    <h4>${esc(g)}</h4>
    <div class="v154-check-toolbar"><button type="button" class="btn" onclick="v156MarkSectionGood(this)">Marcar todo Bueno</button></div>
    ${items.map(item=>v156VehRow(section,i++,item)).join('')}
  </div>`).join('')||'<div class="muted">Sin ítems configurados en esta sección.</div>';
}
function v156BindVehForm(form){
  form.querySelectorAll('.v156-check-row').forEach(row=>{
    const boxes=[...row.querySelectorAll('input[type="checkbox"]')];
    boxes.forEach(b=>b.addEventListener('change',()=>{
      if(b.checked)boxes.filter(x=>x!==b).forEach(x=>x.checked=false);
      row.classList.remove('missing');
      row.classList.toggle('complete',boxes.some(x=>x.checked));
      v156UpdateVehProgress();
    }));
  });
  form.querySelectorAll('input,select,textarea').forEach(el=>{
    ['input','change'].forEach(ev=>el.addEventListener(ev,()=>{
      if(v156FieldValid(el))el.classList.remove('v156-missing');
      v156UpdateVehProgress();
    }));
  });
}
function v156MarkSectionGood(btn){
  btn.closest('.v154-check-group').querySelectorAll('.v156-check-row').forEach(row=>{
    const boxes=[...row.querySelectorAll('input[type="checkbox"]')];boxes.forEach(x=>x.checked=false);
    const ok=boxes.find(x=>x.value==='Bueno');if(ok)ok.checked=true;
    row.classList.add('complete');row.classList.remove('missing');
  });v156UpdateVehProgress();
}
function v156FieldValid(el){
  if(el.type==='number')return String(el.value).trim()!==''&&!Number.isNaN(Number(el.value));
  return String(el.value||'').trim()!=='';
}
function v156PageMissing(page){
  const missing=[];
  page.querySelectorAll('[required]').forEach(el=>{if(!v156FieldValid(el))missing.push(el)});
  page.querySelectorAll('.v156-check-row').forEach(row=>{if(![...row.querySelectorAll('input[type="checkbox"]')].some(x=>x.checked))missing.push(row)});
  if(page.querySelector('#vehCtlSigV13')&&!V12_SIG?.vehCtlSigV13)missing.push(page.querySelector('#vehCtlSigV13'));
  return missing;
}
function v156ValidateCurrentPage(){
  const page=document.querySelector('.v156-page.active');if(!page)return true;
  const missing=v156PageMissing(page);
  page.querySelectorAll('.v156-missing,.missing').forEach(x=>x.classList.remove('v156-missing','missing'));
  if(!missing.length)return true;
  missing.forEach(x=>x.classList.add(x.classList.contains('v156-check-row')?'missing':'v156-missing'));
  missing[0].scrollIntoView({behavior:'smooth',block:'center'});
  toast(`Completa ${missing.length} campo${missing.length===1?'':'s'} de esta página.`,'error');
  return false;
}
let v156VehPage=0;
function v156ShowVehPage(n){
  const pages=[...document.querySelectorAll('.v156-page')];if(!pages.length)return;
  v156VehPage=Math.max(0,Math.min(n,pages.length-1));
  pages.forEach((p,i)=>p.classList.toggle('active',i===v156VehPage));
  const title=document.getElementById('v156StepTitle'),count=document.getElementById('v156StepCount');
  if(title)title.textContent=pages[v156VehPage].dataset.title||'Formulario';
  if(count)count.textContent=`Paso ${v156VehPage+1} de ${pages.length}`;
  const prev=document.getElementById('v156Prev'),next=document.getElementById('v156Next'),finish=document.getElementById('v156Finish');
  if(prev)prev.disabled=v156VehPage===0;
  if(next)next.classList.toggle('hidden',v156VehPage===pages.length-1);
  if(finish)finish.classList.toggle('hidden',v156VehPage!==pages.length-1);
  v156UpdateVehProgress();
  document.querySelector('.modal')?.scrollTo?.({top:0,behavior:'smooth'});
}
function v156NextVehPage(){if(v156ValidateCurrentPage())v156ShowVehPage(v156VehPage+1)}
function v156PrevVehPage(){v156ShowVehPage(v156VehPage-1)}
function v156AllVehItems(){
  const form=document.getElementById('vehCtlFormV156');if(!form)return {done:0,total:0};
  let total=0,done=0;
  form.querySelectorAll('[required]').forEach(el=>{total++;if(v156FieldValid(el))done++});
  form.querySelectorAll('.v156-check-row').forEach(row=>{total++;if([...row.querySelectorAll('input[type="checkbox"]')].some(x=>x.checked))done++});
  total++;if(V12_SIG?.vehCtlSigV13)done++;
  return {done,total};
}
function v156UpdateVehProgress(){
  const {done,total}=v156AllVehItems();
  const txt=document.getElementById('v156Completion'),bar=document.querySelector('#v156Progress i');
  if(txt)txt.textContent=`${done} / ${total} completados${done===total?' · Formulario listo para finalizar':''}`;
  if(bar)bar.style.width=(total?done/total*100:0)+'%';
  const form=document.getElementById('vehCtlFormV156');
  form?.querySelectorAll('[required]').forEach(el=>el.classList.toggle('v156-ok',v156FieldValid(el)));
  if(V12_SIG?.vehCtlSigV13){
    const st=document.getElementById('vehCtlSigV13_state');if(st){st.textContent='Firma completada ✓';st.classList.add('ok')}
  }
}

const _v156GenerateVehicleBase=generateVehiculoV13;
generateVehiculoV13=async function(e){
  e.preventDefault();
  const pages=[...document.querySelectorAll('.v156-page')];
  for(let i=0;i<pages.length;i++){
    const miss=v156PageMissing(pages[i]);
    if(miss.length){
      v156ShowVehPage(i);
      miss.forEach(x=>x.classList.add(x.classList.contains('v156-check-row')?'missing':'v156-missing'));
      miss[0].scrollIntoView({behavior:'smooth',block:'center'});
      return toast(`Faltan ${miss.length} campos/ítems por completar.`,'error');
    }
  }
  return _v156GenerateVehicleBase(e);
};

========================================================= */
function v156PdfChartTwoColumn(doc,canvasId,title,xLabel,yLabel,analysis,y){
  const c=document.getElementById(canvasId);if(!c)return y;
  if(y>125){doc.addPage();y=20}
  const leftX=14,leftW=165,rightX=186,rightW=97;
  doc.setFont('helvetica','bold');doc.setFontSize(10.5);doc.text(title,leftX,y);
  doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(90);
  doc.text(`Eje X: ${xLabel}`,leftX,y+5);doc.text(`Eje Y: ${yLabel}`,leftX+75,y+5);
  try{doc.addImage(c.toDataURL('image/png',1),'PNG',leftX,y+9,leftW,63)}catch(_){}
  doc.setTextColor(30);doc.setFont('helvetica','bold');doc.setFontSize(9);doc.text('Análisis técnico preliminar',rightX,y);
  doc.setFont('helvetica','normal');doc.setFontSize(7.6);
  const lines=doc.splitTextToSize(analysis,rightW);
  // jsPDF no justifica multi-línea consistentemente; se usa maxWidth con alineación justificada donde está disponible
  try{doc.text(lines,rightX,y+7,{maxWidth:rightW,align:'justify'})}catch(_){doc.text(lines,rightX,y+7)}
  const h=Math.max(76,lines.length*4+12);
  return y+h;
}

/* reemplazar únicamente el helper utilizado por V15.5 */
v155PdfChartBlock=function(doc,canvasId,title,xLabel,yLabel,analysis,y){
  return v156PdfChartTwoColumn(doc,canvasId,title,xLabel,yLabel,analysis,y);
};

  [['TRABAJADOR',x1],['APROBADOR',x2],['EMPLEADOR',x3]].forEach(([t,x])=>{doc.setFont('helvetica','bold');doc.setFontSize(8);doc.text(t,x+boxW/2,y,{align:'center'});doc.rect(x,y+3,boxW,boxH)});
  if(r.firma_solicitante)doc.addImage(r.firma_solicitante,'PNG',x1+4,y+7,boxW-8,20);
  if(r.firma_aprobador)doc.addImage(r.firma_aprobador,'PNG',x2+4,y+7,boxW-8,20);
  if(emp.firma_base64)doc.addImage(emp.firma_base64,'PNG',x3+4,y+7,boxW-8,20);
  y+=38;doc.setFont('helvetica','normal');doc.setFontSize(7.3);
  doc.text(r.perfiles?.nombre||'',x1+boxW/2,y,{align:'center'});
  doc.text(state.profile?.nombre||'',x2+boxW/2,y,{align:'center'});
  doc.text(emp.nombre||'LUIS POBLETE LÓPEZ',x3+boxW/2,y,{align:'center'});
  y+=4;doc.text(r.perfiles?.rol||'',x1+boxW/2,y,{align:'center'});
  doc.text(state.profile?.rol||'Aprobador',x2+boxW/2,y,{align:'center'});
  doc.text(emp.cargo||'Representante Legal',x3+boxW/2,y,{align:'center'});
  y+=4;doc.text('',x1+boxW/2,y,{align:'center'});
  doc.text(new Date().toLocaleString('es-CL'),x2+boxW/2,y,{align:'center'});
  doc.text(emp.empresa||'Stainher Ascensores Ltda.',x3+boxW/2,y,{align:'center'});
  return doc;
}

/* =========================================================
   EMAIL AUTO: conectores reales para formularios
========================================================= */
async function v156SafeAutoSend(doc,fileName,type,module,recordId,to=[]){
  try{
    await v155SendDocument({pdfDoc:doc,fileName,subject:`Stainher App · ${fileName.replace(/_/g,' ').replace('.pdf','')}`,documentType:type,module,recordId,to});
    toast('PDF generado y correo enviado','success');
    return true;
  }catch(e){
    console.warn('Correo automático',e);
    toast('PDF generado. Correo no enviado: '+(e.message||String(e)),'warn');
    return false;
  }
}

generateExtV12=async function(e){e.preventDefault();const d=extDataV12();if(!d.supervisor_nombre||!d.fecha||!d.rows.length||!V12_SIG.extSigV12)return toast('Completa supervisor, fecha, al menos un extintor y firma.','error');try{await v12Register(v12Control(5),d.fecha,'extSupV12');const doc=buildExtPdfV12(d),fn=`Control_5_Extintores_${d.fecha}.pdf`;doc.save(fn);await v156SafeAutoSend(doc,fn,'liderazgo','liderazgo',null);closeModal();await renderLiderazgoV95()}catch(err){toast(err.message||String(err),'error')}};

/* Preventivo: generar y enviar */
downloadPreventivoReport=async function(equipoId=''){
  const C=ensurePdf();if(!C)return toast('No se pudo cargar el generador PDF','error');
  let rows=[...(state.preventivos||[])];if(equipoId)rows=rows.filter(r=>r.equipo_id===equipoId);
  const k=preventivoStats(rows),r=edpRange(state.prevYear,state.prevMonth),doc=new C({orientation:'landscape',unit:'mm',format:'a4'}),equipo=equipoId?(rows[0]?.equipos?.nombre||state.equipos.find(e=>e.id===equipoId)?.nombre||'Equipo'):'Todos los equipos';
  pdfHeader(doc,'Informe EDP de Mantenimiento Preventivo',`${MONTHS_ES[state.prevMonth-1]} ${state.prevYear} · ${fmtDateCL(r.start)} al ${fmtDateCL(r.end)} · ${equipo}`);
  doc.setFontSize(10);doc.text(`Cumplimiento: ${k.pct.toFixed(0)}%`,14,47);doc.text(`Programadas: ${k.total}`,62,47);doc.text(`Ejecutadas: ${k.exec}`,102,47);doc.text(`Pendientes: ${k.pend}`,140,47);doc.text(`Atrasadas: ${k.late}`,178,47);
  doc.autoTable({startY:53,head:[['Equipo','Actividad','Frecuencia','F. programada','Estado','F. ejecución','Observación']],body:rows.map(x=>[x.equipos?.nombre||'',x.actividad||'',x.frecuencia||'',x.fecha_programada||'—',x.estado||'',x.fecha_ejecucion||'—',x.observacion||'']),styles:{fontSize:7,cellPadding:2},columnStyles:{1:{cellWidth:60},6:{cellWidth:65}}});
  const fn=`Preventivo_EDP_${state.prevYear}_${pad2(state.prevMonth)}${equipoId?'_'+equipo.replace(/\s+/g,'_'):''}.pdf`;
  doc.save(fn);await v156SafeAutoSend(doc,fn,'preventivo','preventivo',equipoId||null);
};
