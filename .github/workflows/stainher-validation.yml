name: Stainher validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          find assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          find tests -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Validate runtime, cache, versions, and design regressions
        run: node --test tests/deployment-validation-r217.mjs
      - name: Run existing regression tests
        run: node --test tests/*.mjs
