name: Stainher validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          find assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          find tests -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Validate runtime, cache, versions, and design regressions
        run: node --test tests/deployment-validation-r217.mjs tests/mobile-release-r231.mjs
      - name: Visual QA - real leadership KPI markup
        run: |
          npm install --no-save playwright@1.56.1 @electric-sql/pglite
          npx playwright install --with-deps chromium
          node tests/leadership-visual-r220.mjs
          node tests/mobile-contrast-r226.mjs
          node tests/preventivo-mobile-visual-r276.mjs
          node tests/correctivo-mobile-dates-r277.mjs
          node tests/ggrr-mobile-controls-r278.mjs
          node tests/mobile-date-shell-integration-r279.mjs
          node tests/solicitudes-zoom-created-r280.mjs
          node tests/solicitudes-filter-specificity-r281.mjs
          node tests/correctivo-kpi-focus-zoom-r283.mjs
          node tests/control-stainher-contrast-r282.mjs
          node tests/fatigue-no-area-r285.mjs
          node tests/control-real-contrast-r286.mjs
          node tests/extintores-contrast-r287.mjs
          node tests/controls-remaining-dark-r288.mjs
          node tests/turn-publish-button-r290.mjs
          node tests/publicacion-turnos-r290.mjs
          node tests/iphone-safearea-dock-r228.mjs
          node tests/turnos-mobile-visual-r226-hotfix.mjs
          node tests/cross-module-contrast-r230.mjs
          node tests/turnos-functional-actions-r231.mjs
          node tests/turnos-matrix-scroll-r264.mjs
      - name: Store visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stainher-visual-evidence-r231
          path: artifacts/
          if-no-files-found: warn
      - name: Diagnose request-close historical regression
        run: node tests/request-close-r177.mjs
      - name: Run complete regression suite (blocking)
        id: legacy
        run: |
          node --test --test-reporter=tap tests/*.mjs > legacy-test-results.tap 2>&1 || { grep -A 28 '^not ok' legacy-test-results.tap | head -130; exit 1; }
      - name: Publish historical failure report
        if: always()
        run: |
          echo '### Historical regression tests' >> "$GITHUB_STEP_SUMMARY"
          grep '^# tests\|^# pass\|^# fail\|^not ok' legacy-test-results.tap | tail -90 >> "$GITHUB_STEP_SUMMARY" || true
          if [ "${{ steps.legacy.outcome }}" = "failure" ]; then
            echo 'Historical tests remain failing; this job is NOT evidence of full functional approval.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Archive full historical regressions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-regression-audit
          path: legacy-test-results.tap
          if-no-files-found: warn
